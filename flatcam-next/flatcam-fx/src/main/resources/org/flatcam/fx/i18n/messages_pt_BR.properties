# CncPreflight.java
ui.c7a394da9f72=Laser: potência é o valor S/PWM solicitado ao controlador, não RPM físico. A prévia mostra trajetos, mas não simula feixe, material, intertravamentos nem configurações elétricas; não é validação de segurança.
# CncPreflight.java
ui.e6b011d26eaf=Laser: uma passagem por caminho, sem Multi-Depth, troca mecânica, Dwell ou Extra Cut. Pontos isolados exigem tempo de exposição e são recusados. End Z/XY é comum; avanço/potência são individuais por grupo e Z_laser/Marlin permitem foco individual.
# CncPreflight.java
ui.fb3647cef05d=GRBL laser: confirme $30 (escala de S), $32 (modo laser) e a ligação de controle. O FX comanda M5 antes dos posicionamentos; não detecta a configuração da máquina nem assume que S representa uma porcentagem.
# CncPreflight.java
ui.bfb39f3cb997=Marlin laser: confirme INCH_MODE_SUPPORT para IN, a configuração da saída e o modo padrão de controle, não inline. G0_FEEDRATE fixo pode ignorar Feed rapids. M400 inclui o estacionamento final, mas não confirma o desligamento físico do feixe.
# CncPreflight.java
ui.5ed498ea494d=Marlin FAN: M106/M107 usam PWM de 1 a 255 neste perfil. Confirme FAN pin e LASER_SYNCHRONOUS_M106_M107; velocidade de ventilador não equivale a potência óptica calibrada.
# CncPreflight.java
ui.833e9f781ddb=Repetier: o valor de potência é PWM FAN de 0 a 255, não RPM. M106/M107 exigem uma saída FAN e circuito adequados; não confirmam rotação física. Potência zero não liga a saída nem garante parada final se ela já estava ligada.
# CncPreflight.java
ui.a963bb6108f4=Repetier: @pause solicita a troca ao operador via Repetier-Host; não seleciona uma ferramenta automaticamente. M84 libera os motores e pode perder a referência. Confira fixação, origem e altura antes de retomar; a prévia não simula essa perda.
# CncPreflight.java
ui.2a98c7ae4ac7=Berta: confirme a configuração dos comandos M110/M111 e da origem G54. Seus efeitos dependem da máquina e não são simulados; não use o perfil apenas por aceitar G-code genérico.
# CncPreflight.java
ui.12993adbfa62=Berta: G64 P0.03 mantém o valor do perfil Python na unidade do programa: 0,03 mm em MM ou 0,762 mm em IN. É uma tolerância de trajetória configurada, não precisão garantida. Confira antes de exportar.
# CncPreflight.java
ui.ad72fab202c4=Dwell: o tempo da interface continua em segundos; G4 P é emitido em milissegundos, inclusive em IN. O avanço nativo é por minuto, sem G94.
# CncPreflight.java
ui.1a5bfef7cb45=Troca manual: três pausas M0 por ferramenta. Entre elas há um movimento comandado até Z0 usando o Feed Z da fresa e retorno ao Tool change Z; G90 é restaurado antes dos movimentos verticais. Não é sondagem nem detecção automática de contato.
# CncPreflight.java
ui.bfa4c6d10df1=Confirme o zero de peça, a posição XY e a altura livre antes de continuar cada pausa. Movimentos do operador e mudanças de origem/unidades não são simulados.
# CncPreflight.java
ui.056653f07521=Troca Custom: Tn/M6 quando a troca está ativada, sem M0 adicional. A altura e o XY são comandados antes da macro; depois, G90 e Z são restaurados antes do próximo XY. A macro, a seleção física da ferramenta e mudanças de origem não são simuladas.
# CncPreflight.java
ui.551bc50c7c28=ISEL ICP: somente mm; coordenadas em micrômetros, VEL/FASTVEL em micrômetros por segundo e WAIT em milissegundos. Valores são truncados para inteiros, sem aumentar a precisão do controlador.
# CncPreflight.java
ui.c055d19b5676=ISEL ICP: GETTOOL executa a troca automática mesmo sem pausa manual. Confirme a macro, o referenciamento e as alturas; a prévia não simula essa troca nem o tempo dos rápidos. O estacionamento preserva a origem, sem WPCLEAR.
# CncPreflight.java
ui.b78eb28ba8ec=line_xyz: a subida inicial e a restauração de Z após M6 mantêm X/Y atuais. XYZ são explicitados quando conhecidos; confirme que o controlador aceita o preâmbulo vertical. A macro M6 não é simulada.
# CncPreflight.java
ui.beced43c3234=ISEL CNC: o perfil usa mm, G71/G94 e T1–T128. Os tempos Dwell configurados em segundos são convertidos para milissegundos no G-code.
# CncPreflight.java
ui.47beaa3c3a96=ISEL Remote DIN/ISO: M01 é parada com interação do operador. Em outros controladores confirme se a parada é opcional e está habilitada; não presuma que M01 sempre terá o mesmo comportamento.
# CncPreflight.java
ui.61300f9e6d65=ISEL CNC: alturas/XY de troca são emitidos antes de M06 e Z é restaurado depois. A macro de troca e o referenciamento físico não são simulados. M30 termina após o estacionamento final.
# CncPreflight.java
ui.b47b197e04cf=Marlin: confirme SPINDLE_FEATURE e CUTTER_POWER_UNIT=RPM. O valor S só representa RPM nessa configuração.
# CncPreflight.java
ui.d39e5a5107c0=Marlin: Tn pode selecionar extrusores; Tn/M6 exigem configuração ou macro compatível com CNC. M0 depende do suporte de pausa; IN exige INCH_MODE_SUPPORT.
# CncPreflight.java
ui.942ad8da333b=Marlin: cada G0 recebe Feed rapids, mas G0_FEEDRATE fixo pode ignorar F. M400 espera os movimentos do planejador, não confirma parada física do spindle.
# CncPreflight.java
ui.0fb95639fea3=A prévia de sondagem não simula G31, contato, G92 ou macros de troca. Não valida a segurança da máquina.
# CncPreflight.java
ui.651add8c8080=A prévia é 2D: não simula remoção de material, grampos, limites da máquina nem movimentos de macros M6.
