# DrillGCodeToolPanel.java
ui.d71b60bbe44f=Passo entre centros = diâmetro × (1 − sobreposição / 100). Aceita 0 até menos de 100%. Pertence a cada ferramenta; não muda a sobreposição de NCC/Paint.\n\nSobreposição alta gera muitos furos. Há limite de um milhão de furos convertidos por tarefa para evitar esgotar memória. O trabalho pode ser cancelado.
