ui.c6f75fe3b23b=Espelha objetos (Gerber, Excellon, Geometry) em relação a um eixo, para fresar ou imprimir o outro lado da placa, e cria furos de alinhamento que coincidem nas duas faces.
# ToolDescriptions.java
ui.3b96feaf8903=Alinha um objeto a outro clicando em pads ou furos correspondentes. Um ponto só translada; dois pontos também giram.
# ToolDescriptions.java
ui.b2fea9c879ea=Cria um Excellon com furos nos centros dos pads de um Gerber, com diâmetro fixo, proporcional ao pad ou deixando um anel de cobre.
# ToolDescriptions.java
ui.0b8e9011cee9=Gera o contorno de corte da placa, com pontes (gaps) que a mantêm presa à chapa até o fim.
# ToolDescriptions.java
ui.2d1f657564d1=Non-Copper Clearing: remove o cobre que não faz parte do circuito, com uma ou mais ferramentas (Rest Machining) e limite por área ou objeto.
# ToolDescriptions.java
ui.bb56be5daffe=Preenche polígonos com caminhos de ferramenta (Standard, Seed, Lines ou Combo).
# ToolDescriptions.java
ui.f8f0c90e86c1=Gera caminhos ao redor das trilhas e pads para isolá-los eletricamente, com vários passes e ferramentas.
# ToolDescriptions.java
ui.963280419814=Gera o G-code para furar os furos de um Excellon, com profundidade, múltiplos passes e pós-processador.
# ToolDescriptions.java
ui.4b12f23a90a9=Replica um objeto numa grade de colunas e linhas, para fabricar várias placas de uma vez.
# ToolDescriptions.java
ui.c108c58fb278=Exporta um filme positivo ou negativo (SVG, PNG ou PDF) para fotolito, com escala, inclinação, espelho e furação.
# ToolDescriptions.java
ui.81d2799b4fdb=Gera os caminhos e o G-code de um dispensador de pasta de solda a partir do Gerber da máscara de pasta.
# ToolDescriptions.java
ui.102074b7e873=Remove de um objeto a área coberta por outro (Gerber ou Geometry).
# ToolDescriptions.java
ui.940c6a7360e7=Verifica regras de projeto: largura das trilhas, distâncias de cobre, seda, máscara e contorno, anel anular e furos. Cada violação pode ser localizada no plot.
# ToolDescriptions.java
ui.9d6b8e3e33d1=Encontra a menor distância entre os elementos de cobre de um Gerber, quantos pares estão nela e onde; ao escolher um local, o plot vai até lá.
# ToolDescriptions.java
ui.d01ce8ad1f9e=Calculadoras de unidades, de ferramenta em V e de galvanoplastia.
# ToolDescriptions.java
ui.f6a98d435659=Gira, inclina, escala, espelha ou desloca os objetos selecionados, em relação à origem, à seleção ou a um ponto.
# ToolDescriptions.java
ui.f751f02d6d3b=Cria um QR Code de cobre num Gerber, no ponto em que você clicar.
# ToolDescriptions.java
ui.089547945e41=Preenche as áreas vazias do cobre (sólido, pontos, quadrados ou linhas) para equilibrar a corrosão; também cria a robber bar e a máscara de galvanoplastia.
# ToolDescriptions.java
ui.6c088f823ca7=Adiciona marcas de alinhamento ao cobre (circulares, cruz ou xadrez) e aberturas na máscara de solda.
# ToolDescriptions.java
ui.8dcee48184eb=Quatro pontos de referência geram um G-code de verificação; os desvios medidos na máquina viram fatores de escala e inclinação que calibram os objetos.
# ToolDescriptions.java
ui.1652539bc971=Fura os pads de um Gerber a partir de um Excellon ou de um tamanho (fixo, proporcional ou por anel).
# ToolDescriptions.java
ui.971d9064a759=Troca cobre e vazio dentro de uma caixa ao redor do Gerber, com margem e cantos escolhidos.
# ToolDescriptions.java
ui.b1d3c100731a=Compensa a corrosão lateral aumentando o cobre pela espessura da folha e pelo fator de corrosão.
