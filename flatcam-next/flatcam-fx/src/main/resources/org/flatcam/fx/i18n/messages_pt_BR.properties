ui.98574eca7142=Gera Geometry acompanhando o contorno da origem; Convex Shape usa seu contorno convexo. O caminho já compensa o raio da ferramenta.\n\nThin gera outra Geometry com Thin Depth; M-Bites gera Excellon. Gaps manuais substituem o padrão automático. Confira as saídas e gere/configure seus CNC Jobs depois.
