# CncExclusionEditor.java
ui.c75681fd3399=Around contorna as áreas em XY. Over sobe antes de entrar e desce depois de sair da região ampliada pelo raio e margem. Onde áreas se sobrepoem, usa o maior Over Z exigido naquele trecho. Ambas recusam cortes dentro da área.\n\nO FX acrescenta raio da ferramenta e margem de 0.1 mm (ou equivalente em in). Troca, retorno entre passes e estacionamento também são verificados.
