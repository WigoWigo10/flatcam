ui.5040372c7260=Fresa esférica
# ToolProfilePicker.java
ui.38340108c894=Escolha o tipo de fresa.
# ToolProfilePicker.java
ui.aac477b68304=Ponta em V. Configure V-Tip Dia e Angle no CNC Job. Desenho esquemático, sem escala.
# ToolProfilePicker.java
ui.1ce6bb3cc42c=Tipo informativo neste painel. C1–C4: a vista da ponta indica o número de dentes. Desenho esquemático, sem escala; o perfil não altera o cálculo de isolamento.
# ToolsDatabaseDescriptions.java
ui.b4fb9d56dff1=Nome para identificar a ferramenta na biblioteca. Não altera o diâmetro nem a geometria do trabalho.
# ToolsDatabaseDescriptions.java
ui.007d3b5c4131=Diâmetro de corte da ferramenta, maior que zero. Para Shape V, é calculado ao aplicar alterações em V-Dia, V-Angle ou Cut Z.
# ToolsDatabaseDescriptions.java
ui.2c29980b6896=Limite inferior absoluto do intervalo de diâmetros aceito na busca de brocas. Não é uma tolerância ±. Exemplo: Min = 0,78 e Max = 0,82 aceita brocas nesse intervalo. O diâmetro exato tem prioridade.
# ToolsDatabaseDescriptions.java
ui.f83d09957f60=Limite superior do intervalo de diâmetros aceito na busca de brocas; deve ser maior ou igual a Min. O intervalo só é usado quando Max > Min; resultados ambíguos são recusados.
# ToolsDatabaseDescriptions.java
ui.3e44b0e6143e=Define a operação: General, Milling, Drilling, Isolation, Paint, NCC ou Cutout. General participa de todas as buscas integradas; opções incompatíveis são recusadas. A seleção também determina as seções exibidas.
# ToolsDatabaseDescriptions.java
ui.5a2216e5f95d=Formato da ferramenta:\nC1 a C4 = fresa circular com 1 a 4 cortes.\nB = ponta esférica.\nV = ponta em V.\n\nAo escolher V, V-Dia, V-Angle e Cut Z determinam o diâmetro efetivo.
# ToolsDatabaseDescriptions.java
ui.9c4a7913fa01=Diâmetro da ponta da ferramenta em V, não negativo. Disponível para Shape V; participa do cálculo do diâmetro de corte.
# ToolsDatabaseDescriptions.java
ui.ce4c5153c754=Ângulo total da ponta da ferramenta em V, em graus, entre 0 e 180 (sem incluir os extremos). Participa do cálculo do diâmetro na profundidade Cut Z.
# ToolsDatabaseDescriptions.java
ui.41ab10f67dd9=Classificação da usinagem: Iso = isolamento; Rough = desbaste; Finish = acabamento. É uma descrição da ferramenta, não um ajuste automático de velocidade.
# ToolsDatabaseDescriptions.java
ui.aacaddc8971f=Posição do caminho: Path = sem compensação; In/Out = para dentro/fora por meio diâmetro; Custom = usa Custom Offset.\n\nIntegração FX: transferido para Milling/Geometry CNC. Cutout já compensa seus caminhos e não reaplica este Offset.
# ToolsDatabaseDescriptions.java
ui.f75bc6543a18=Custom Offset: positivo expande; negativo contrai o caminho. Só é aplicado com Tool Offset Custom; zero exige Path no CNC do FX.\n\nIntegração FX: transferido para Milling/Geometry CNC, não para Cutout.\n\nAtenção: Isolation/NCC já geram centros de ferramenta; normalmente mantenha Path para evitar compensação duplicada.
# ToolsDatabaseDescriptions.java
ui.5ea9e2fac451=Coordenada Z de corte em relação à superfície. Deve ser negativa ao transferir para Milling ou Cutout no FX. Em Shape V, também determina o diâmetro efetivo de corte.\n\nIntegração FX: Cutout recebe este Cut Z e os ajustes gerais de Multi-Depth/Depth / Pass na Geometry gerada.
# ToolsDatabaseDescriptions.java
ui.4df34f0ac8aa=Profundidade de furação abaixo da superfície, normalmente escrita como Z negativo. O FX utiliza sua magnitude e aplica a compensação Offset Z ao gerar.
# ToolsDatabaseDescriptions.java
ui.1dcd647d56b9=Divide o corte em passes de profundidade limitada até atingir Cut Z. Habilita Depth / Pass; na furação, há retração entre os passes.
# ToolsDatabaseDescriptions.java
ui.456a8ebadd8c=Profundidade máxima adicionada em cada passe, como valor positivo. Só fica habilitada quando Multi-Depth está marcado.
# ToolsDatabaseDescriptions.java
ui.f91d4c8f5ad8=Altura livre para deslocar a ferramenta entre cortes ou furos. Deve ficar acima da superfície e das fixações do trabalho.
# ToolsDatabaseDescriptions.java
ui.cc211002f83a=Velocidade de avanço no plano X-Y enquanto a ferramenta está cortando. Informe um valor positivo em unidades do trabalho por minuto (mm/min ou in/min).
# ToolsDatabaseDescriptions.java
ui.c5ecfce43470=Velocidade de mergulho no eixo Z durante o corte ou a furação. Informe um valor positivo em unidades do trabalho por minuto (mm/min ou in/min).
# ToolsDatabaseDescriptions.java
ui.5ac9157749c6=Velocidade dos deslocamentos rápidos, em mm/min ou in/min, conforme a unidade do trabalho. Seu uso depende do pós-processador; alguns perfis de impressoras usam avanço explícito nos rápidos.
# ToolsDatabaseDescriptions.java
ui.780bbcbf8bf0=Rotação do spindle em RPM. Zero não comanda a rotação nos perfis que permitem isso; a sequência de troca ainda pode emitir M5 para parar antes da pausa. Perfis como Mach3 com sonda exigem RPM positivo ao gerar.
# ToolsDatabaseDescriptions.java
ui.51c14e84cf54=Habilita uma pausa após ligar o spindle, para permitir que o motor alcance a rotação definida. Habilita o campo Dwell Time.
# ToolsDatabaseDescriptions.java
ui.a469ddecc553=Duração da pausa após ligar o spindle, em segundos. Disponível quando Dwell está marcado; deve ser não negativa.
# ToolsDatabaseDescriptions.java
ui.a55f6af44e1e=Acrescenta um trecho de corte no encontro entre o início e o fim de um caminho fechado, para ajudar a completar o isolamento. Habilita Extra Cut Length.
# ToolsDatabaseDescriptions.java
ui.d317fdcd23ad=Comprimento do trecho adicional no fechamento do caminho. Disponível somente quando Extra Cut está marcado.
# ToolsDatabaseDescriptions.java
ui.e55b167f74ed=Compensação da ponta da broca. No FX, um valor positivo aumenta a profundidade de Cut Z; um negativo a reduz. A profundidade resultante deve continuar abaixo da superfície.
# ToolsDatabaseDescriptions.java
ui.54e4cfa8263b=Permite tratar os slots da ferramenta como uma sequência de furos. Habilita Overlap e Last Drill para configurar essa sequência.
# ToolsDatabaseDescriptions.java
ui.0fa4dc89274a=Sobreposição entre furos consecutivos ao perfurar slots, em porcentagem do diâmetro da broca. Só fica habilitada com Drill Slots; maior sobreposição cria mais furos.
# ToolsDatabaseDescriptions.java
ui.47cd96e13b62=Adiciona um furo na extremidade do slot quando a sequência regular não cobre todo o seu comprimento. Só fica habilitado com Drill Slots.
# ToolsDatabaseDescriptions.java
ui.a97ad6ed9408=Quantidade inteira de passes de isolamento ao redor do cobre. Mais passes aumentam a largura isolada, em conjunto com o diâmetro e Overlap.
# ToolsDatabaseDescriptions.java
ui.e683b36ba450=Sobreposição entre passes de isolamento, em porcentagem da largura da ferramenta. O valor deve ficar entre 0 e menos de 100%.
# ToolsDatabaseDescriptions.java
ui.98144a76b336=Escolhe o sentido de fresagem: Climb (concordante) ou Conventional (discordante). Considere as características mecânicas da máquina ao configurar o trabalho.
# ToolsDatabaseDescriptions.java
ui.61ef052ba553=Gera um caminho que segue o centro das trilhas Gerber, em vez de isolar suas bordas. Esse modo corta sobre a trilha.
# ToolsDatabaseDescriptions.java
ui.c6f69ce7028f=Região a isolar: Both = bordas externas e internas; Exterior = apenas externas; Interior = apenas contornos de aberturas internas do polígono.
# ToolsDatabaseDescriptions.java
ui.2f6693817b9b=Sobreposição entre caminhos, em porcentagem da largura da ferramenta (0 a menos de 100%). Valores maiores criam mais trajetos e podem aumentar o tempo de cálculo e de usinagem.
# ToolsDatabaseDescriptions.java
ui.5ad3e4c20743=Margem individual do Paint: positiva contrai a área a preencher; zero usa a área original; negativa expande.\n\nAtenção: uma margem negativa pode levar caminhos para fora do polígono original. Confira a Geometry gerada antes de usinar.
# ToolsDatabaseDescriptions.java
ui.1e3c0b1a3d6b=Método de preenchimento:\nStandard = passos para dentro.\nSeed = expansão de uma semente.\nLines = linhas paralelas.\nCombo = tenta métodos alternativos.\n\nLaser_lines aparece desabilitado nesta base, como no Python.
# ToolsDatabaseDescriptions.java
ui.a249bfed7735=Liga segmentos resultantes para reduzir levantamentos da ferramenta. A conexão deve permanecer dentro da área permitida para usinagem.
# ToolsDatabaseDescriptions.java
ui.cbc8c3307206=Adiciona um caminho ao redor do perímetro do polígono para completar o acabamento das bordas.
# ToolsDatabaseDescriptions.java
ui.5ab0ef4a4657=Clear remove o cobre livre. Isolation cria passes de isolamento antes da limpeza; ferramentas V são tratadas como Isolation pelo adaptador NCC do FX.
# ToolsDatabaseDescriptions.java
ui.d37eabcd9bfb=Margem ao redor da caixa delimitadora usada para limitar a limpeza de cobre. Não é o mesmo parâmetro que Offset das trilhas.
# ToolsDatabaseDescriptions.java
ui.d09474e58c9a=Método de limpeza:\nStandard = passos para dentro.\nSeed = expansão de uma semente.\nLines = linhas paralelas.\nCombo = tenta alternativas para cobrir a área.
# ToolsDatabaseDescriptions.java
ui.5325f315fe81=Ativa um afastamento das trilhas e pads ao limpar o cobre. Habilita Offset Value, que define essa distância.
# ToolsDatabaseDescriptions.java
ui.4707e070d1b3=Afastamento das regiões de cobre ao executar a limpeza. Só é aplicado quando Offset está marcado.
# ToolsDatabaseDescriptions.java
ui.6f87fa37b6d6=Margem em relação ao limite da placa. Um valor positivo afasta o contorno de corte da borda original.
# ToolsDatabaseDescriptions.java
ui.0e76d814e99b=Largura das pontes que mantêm a placa presa ao material durante o corte. O tipo de ponte é escolhido em Gap Type.
# ToolsDatabaseDescriptions.java
ui.fecbff00731c=Distribuição das pontes:\nNone = nenhuma.\nLR = esquerda/direita.\nTB = superior/inferior.\n4 = uma por lado.\n2LR e 2TB = duas em cada lado indicado.\n8 = duas por lado.
# ToolsDatabaseDescriptions.java
ui.156747d498e6=Cria um contorno convexo que envolve toda a placa, sem acompanhar suas reentrâncias. No Python, essa opção se destina a objetos Gerber.
# ToolsDatabaseDescriptions.java
ui.b6e79f64013d=Tipo de ponte: Bridge = interrupção do corte; Thin = ponte parcialmente fresada para ficar mais fina; M-Bites = ponte perfurada com furos para facilitar a separação.
# ToolsDatabaseDescriptions.java
ui.60649971e444=Thin Depth: Z negativo e mais raso que Cut Z. Exemplo: recorte -1,7 e ponte -0,5. Só fica habilitado com Gap Type Thin.\n\nIntegração FX: transfere a profundidade para a Geometry separada das pontes; gere seu CNC Job separadamente. O recorte principal conserva Cut Z.\n\nAtenção: a ponte precisa conservar material suficiente para prender a placa.
# ToolsDatabaseDescriptions.java
ui.f6561f253beb=Diâmetro dos furos que perfuram as pontes Mouse Bites. Só fica habilitado com Gap Type M-Bites.
# ToolsDatabaseDescriptions.java
ui.d383d48d875a=Espaço entre as bordas dos furos Mouse Bites. No Python, o passo entre centros é o diâmetro mais esse valor. Só fica habilitado com Gap Type M-Bites.
# ToolsDatabaseDescriptions.java
ui.45d311781d98=Sem tooltip para\u0020
# ToolsDatabaseDescriptions.java
ui.7feedc0c4379=\n\nIntegração FX: transfere Standard, Seed, Lines e Combo; Laser Lines continua não suportado.
# ToolsDatabaseDescriptions.java
ui.f73eec9b0794=\n\nUnidades: valor na unidade do trabalho (mm ou in); a base não converte unidades automaticamente.
# ToolsDatabaseDescriptions.java
ui.12eb679d5413=\n\nIntegração FX: este parâmetro é salvo na base, mas sua transferência para o CAM ainda não está implementada.
# ToolsDatabaseDescriptions.java
ui.f217a4cb925d=Adiciona uma ferramenta à base em memória com parâmetros iniciais editáveis. Use Salvar base para gravá-la no arquivo.
# ToolsDatabaseDescriptions.java
ui.a8dee3b4c25c=Duplica uma ou várias ferramentas selecionadas, incluindo seus parâmetros e campos desconhecidos. As cópias recebem novos IDs e podem ser editadas separadamente.
# ToolsDatabaseDescriptions.java
ui.63c41b6f1b62=Remove as ferramentas selecionadas após confirmação. O arquivo no disco só é alterado quando a base é salva.
# ToolsDatabaseDescriptions.java
ui.7454aeb3a9f1=Valida os campos editados e aplica as alterações à ferramenta em memória. Não grava no disco; Salvar base persiste a base. Valores inválidos mantêm o rascunho para correção.
# ToolsDatabaseDescriptions.java
ui.50eeae2a66f3=Inicia uma biblioteca vazia sem apagar o arquivo atual. Se houver alterações não salvas, pede confirmação antes de descartá-las.
# ToolsDatabaseDescriptions.java
ui.841aa9d512f7=Abre uma base .FlatDB ou JSON do FlatCAM Python e substitui a biblioteca em memória após leitura válida. Pede confirmação para descartar alterações; em caso de erro, mantém a base atual.
# ToolsDatabaseDescriptions.java
ui.88d2c76ce9e0=Grava uma cópia .FlatDB/JSON em outro arquivo. Mantém a associação e as alterações pendentes da base atual; exportar para seu próprio arquivo equivale a salvar. Cria backup ao sobrescrever.
# ToolsDatabaseDescriptions.java
ui.0a04515a75ba=Valida e salva a biblioteca no arquivo associado, ou pede um destino na primeira gravação. Cria backup antes de sobrescrever e limpa o indicador de alterações. Atalho: Ctrl+S.
# ToolsDatabaseDescriptions.java
ui.2f98070e9466=Identificação, diâmetro, tolerância e operação da ferramenta. Selecione apenas uma ferramenta para editar; seleção múltipla permite copiar ou excluir.
# ToolsDatabaseDescriptions.java
ui.953c8825f4d0=Formato, ponta V e parâmetros CNC transferidos para Geometry/Milling, incluindo Tool Offset/Custom Offset. Cutout recebe parâmetros de corte, mas não reaplica Offset aos caminhos já compensados. A ajuda de cada campo indica os limites do suporte.
