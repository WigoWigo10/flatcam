# PanelTooltips.java
ui.f9bdd0393884=Profundidade abaixo da superfície. O FX aceita a magnitude positiva ou Z negativo e gera o corte em Z negativo. Para ferramentas V, a Geometry calcula a profundidade pela largura e pela ponta.
