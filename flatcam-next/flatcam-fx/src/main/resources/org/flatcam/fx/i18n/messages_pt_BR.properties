# GeometryCncToolPanel.java
ui.95bd9c5e9b98=Retrair mantém a direção e retorna ao início acima da peça. Contínuo alternado inverte o caminho entre passes, inclusive LineStrings fechados. Contínuo na mesma direção repete contornos fechados sem levantar, como os anéis do Python; recusa caminhos abertos.\n\nAtenção: alternar troca Climb/Conventional e não aceita Preservar direção. Ambos os modos contínuos recusam Extra Cut/sonda e usam somente a profundidade final em pontos isolados. Valide material, fresa e remoção de cavacos.
# GeometryCncToolPanel.java
ui.fdfb85fe5fa3=Extra Cut acrescenta um trecho após completar um caminho fechado. Não tem efeito em caminhos abertos e não está disponível para laser/HPGL.\n\nO ajuste é individual por ferramenta; Aplicar parâmetros a todas copia a configuração explicitamente.
# GeometryCncToolPanel.java
ui.d7fbfcd03f08=Extra Cut Length: comprimento adicional no encontro entre o início e o fim de um caminho fechado. Só é usado com Extra Cut marcado.\n\nUnidades: unidade do objeto (mm ou in). Não é profundidade nem número de passes.
# GeometryCncToolPanel.java
ui.5c2dedd18ed9=Path preserva os caminhos. In/Out aplicam metade do diâmetro para dentro/fora; Custom usa uma distância assinada. O ajuste é individual por ferramenta e não altera a Geometry original.\n\nEm linhas abertas, Out cria o contorno do buffer; In pode eliminar o caminho e é recusado.\n\nDisponível em fresagem sem sonda. Configurações ativas não são descartadas ao mudar para um perfil incompatível: volte à fresagem e limpe-as antes de gerar.
# GeometryCncToolPanel.java
ui.3bc49c9baccd=Custom Offset: positivo expande; negativo contrai. Disponível quando Tool Offset é Custom; zero exige Path.\n\nUnidades: unidade do objeto (mm ou in).\n\nAtenção: Isolation/NCC/Cutout já geram caminhos compensados; normalmente use Path para evitar compensação duplicada.
# GeometryCncToolPanel.java
ui.5f2152bec38d=Troca de ferramenta (conforme perfil)
# GeometryCncToolPanel.java
ui.2bebec796add=Em fresagem comum, RPM positivo comanda a partida na velocidade solicitada. RPM zero deixa o acionamento e a parada sob controle manual: não envia uma partida automática e não garante a parada final. Trocas ativadas podem parar o spindle antes da pausa.\n\nZero não significa desligar o spindle. Confira o G-code e o procedimento da máquina. Em laser/PWM, este campo representa potência e segue as regras do perfil escolhido.
# GeometryCncToolPanel.java
ui.ab6e2746eacf=Perfis de fresagem, laser e plotter. Simule e faca um teste a seco antes de usar.
# GeometryCncToolPanel.java
ui.78d8c77120b9=Altura de foco / Travel Z
# GeometryCncToolPanel.java
ui.266bd35a9573=Nos perfis Z_laser e Marlin laser, cada grupo pode ter seu foco Z. Entre grupos, o laser é desligado e o deslocamento XY usa o maior foco do trabalho; só depois posiciona o próximo foco. Isso não detecta obstáculos nem a altura da peça.\n\nGRBL_laser simples não posiciona foco: mantenha este valor igual em todos os grupos ou use Z_laser. Sem End Z explícito, a altura final é a do último grupo com trajetos.\n\nEm fresagem, este campo é Travel Z. Unidade do objeto (mm ou in). Feed rapids e posições finais são comuns.
# GeometryCncToolPanel.java
ui.1cfa5d669f35=Potência S/PWM:
# GeometryCncToolPanel.java
ui.e69b3a0570e6=Cut Z (não V):
# GeometryCncToolPanel.java
ui.fa4b5b467ada=Estratégia de passes:
# GeometryCncToolPanel.java
ui.4ab89e701ae5=Maior Travel Z do trabalho: padrão conservador, usa a maior altura em todos os trajetos.\n\nTravel Z de cada ferramenta: usa a altura configurada em cada fresa, como no fluxo Geometry Python; vale também entre passes e no estacionamento da última fresa. Confira cada altura e a fixação antes de escolher.\n\nTool change Z continua comum e deve ser pelo menos o maior Travel Z. Exclusões Over nunca baixam da altura efetiva. Não simula haste, cabeçote ou segurança física.
# GeometryCncToolPanel.java
ui.a3e15129b7de=Start Z: movimento Z inicial, antes de ligar o spindle. Vazio/None usa Travel Z exibido ao gerar; aceita zero ou valor positivo.\n\nAntes de deslocar em XY, o FX retrai para a altura de segurança. Start Z não faz referenciamento nem confirma que a ferramenta está livre.\n\nUnidades: unidade do objeto (mm ou in).
# GeometryCncToolPanel.java
ui.6dcc9e5883c7=End Z: altura final depois de desligar o spindle. Vazio/None usa o Travel Z efetivo da última fresa: maior altura do trabalho no padrão, ou sua própria altura no modo por ferramenta.\n\nSe End Z for menor que essa altura, o movimento End X,Y ocorre primeiro em altura segura; só depois desce para End Z. Confirme que o destino está livre.
# GeometryCncToolPanel.java
ui.3cecae9744b0=Posição final X,Y. Vazio/None mantém a posição do último corte. Use 10.5;20.5 ou, com vírgula decimal, 10,5;20,5.\n\nO FX desloca em altura segura antes de descer para End Z. O movimento aparece na prévia.\n\nUnidades: unidade do objeto (mm ou in).
# GeometryCncToolPanel.java
ui.d8ac73a6edc4=Tool change Z: altura usada antes da troca. Vazio/None usa o maior Travel Z.\n\nDeve ser pelo menos o maior Travel Z das ferramentas. Só é aplicada quando a troca está ativa ou o perfil seleciona ferramentas automaticamente.
# GeometryCncToolPanel.java
ui.ab78a163d37e=Tool change X,Y: posição para a troca, inclusive a primeira, quando ativada. Vazio/None troca na posição atual. Use 10.5;20.5 ou 10,5;20,5.\n\nO FX retrai antes de XY e M0/M6.\n\nAtenção: confira grampos e a macro da máquina; a prévia não simula movimentos internos de uma macro M6.\n\nUnidades: unidade do objeto (mm ou in).
# GeometryCncToolPanel.java
ui.1c8ce5fc1687=Política de Travel Z:
# GeometryCncToolPanel.java
ui.b509d268be67=Posições comuns a todas as ferramentas. None = automático. Laser permite somente End Z/XY, com potência desligada e XY na altura livre; Start Z e troca mecanica ficam bloqueados. A sonda usa o painel próprio. Configurações incompatíveis preservadas devem ser limpas na fresagem.
# GeometryCncToolPanel.java
ui.a9f63252899d=Posições e troca de ferramenta
# GeometryCncToolPanel.java
ui.4b4635aad26a=Posições comuns do CNC
# GeometryCncToolPanel.java
ui.5ab5091dc124=Start Z, End Z/XY e Tool change Z/XY valem para todas as ferramentas. Vazio/None mantém os valores automáticos.\n\nLaser aceita apenas End Z/XY: potência desligada, deslocamento XY em altura livre e depois End Z. HPGL, Roland e sonda usam seus próprios ajustes. Campos desabilitados conservam configurações incompatíveis: volte à fresagem para limpá-las.\n\nTroca Z/XY só é aplicada quando a troca está ativa ou o perfil seleciona ferramentas automaticamente.
