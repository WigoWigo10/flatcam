# CutoutToolPanel.java
ui.b9de2c3acb5e=Mostra o contorno externo compensado e uma área quadrada na ponta do cursor. Clique sobre o contorno para abrir uma ponte; continue clicando para adicionar outras. A área aplicada é a mesma da prévia, com lado igual à largura da ponte mais o diâmetro da fresa. Na diagonal ou em cantos, a largura resultante pode variar. O Snap da grade é respeitado.\n\nBotão direito ou Esc conclui e mantém os gaps confirmados. Gerar aplica ao projeto. Gaps manuais substituem o padrão automático. Use o mesmo tipo de contorno ao gerar. Alterar diâmetro, margem, largura, Convex Shape ou Single/Panel limpa os gaps do cursor. A prévia mostra o recorte externo; Thin e furos M-Bites devem ser conferidos após gerar.
