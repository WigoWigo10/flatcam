# PanelTooltips.java
ui.3ef9009da869=Sobreposição entre caminhos em porcentagem do diâmetro da ferramenta, de 0 a menos de 100%. Valores maiores criam mais trajetos e aumentam o tempo de cálculo e usinagem.
