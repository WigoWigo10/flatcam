# CutoutToolPanel.java
ui.cdb654060a78=Trata a origem como uma placa, combinando suas partes para calcular o contorno.\n\nLimitação: recortes internos em várias placas exigem Panel. Prefira uma Geometry de contorno para representar a borda real.
# CutoutToolPanel.java
ui.2cb1fcb9f73a=Recorte de partes separadas — Panel
# CutoutToolPanel.java
ui.804cc12e4532=Calcula o recorte de cada parte separada da origem, como as placas de um painel, com suas próprias pontes.\n\nAtenção: ilhas de cobre não representam necessariamente placas distintas; confira a Geometry de contorno escolhida.
# CutoutToolPanel.java
ui.615fb942b47a=Use uma Geometry de área da placa, criada a partir do Edge_Cuts, e não o cobre: todos os anéis internos da origem serão usinados. Em várias placas, selecione Panel.\n\nDisponível apenas em Free-form, sem Convex Shape e com margem não negativa. O raio da fresa e a margem deslocam o caminho para dentro de cada abertura. A geração é recusada se uma abertura desaparecer ou se dividir.\n\nRecortes internos são fechados, sem pontes, Thin ou M-Bites, mesmo com gaps manuais. Não é desbaste de bolso: revise os cantos, a fixação e as peças soltas antes de gerar CNC.
# CutoutToolPanel.java
ui.b3b282224871=Cut Z negativo e finito, salvo na Geometry do recorte. Exemplo: -1,7.\n\nUnidades: unidade do objeto (mm ou in).\n\nAtenção: confira a espessura da placa e quanto a ferramenta entrará no material de sacrifício antes de gerar CNC.
# CutoutToolPanel.java
ui.42adc98e530c=Thin Depth é Z negativo e mais raso que Cut Z. Exemplo: recorte -1,7 e pontes -0,5. Só é usado no tipo Thin.\n\nO valor vai para a Geometry separada das pontes; o recorte principal conserva Cut Z. Gere os dois CNC Jobs separadamente.\n\nUnidades: unidade do objeto (mm ou in).
# CutoutToolPanel.java, ToolDefaults.java
ui.63b0047e887c=Posição dos gaps
# CutoutToolPanel.java
ui.ca024fd61793=LR/TB criam duas pontes; FOUR cria quatro; TWO_LR/TWO_TB criam quatro; EIGHT cria oito.\n\nNo recorte retangular, o centro da origem é deslocado pela margem, como no Python. Os padrões duplos usam (dimensão da origem + duas margens) / 4; o raio da fresa não altera esse espaçamento.\n\nSe a margem ou largura eliminar uma ponte solicitada, a geração retangular é recusada. Gaps manuais substituem o padrão. Confira a prévia antes de gerar CNC.
# CutoutToolPanel.java
ui.114efec780f5=Largura da ponte
# CutoutToolPanel.java
ui.e1f7a2333650=Largura de material que deve permanecer, em unidades do objeto. O trecho retirado do caminho da fresa inclui também seu diâmetro. Zero desativa os gaps automáticos no FX.\n\nThin usa exatamente os trechos retirados para sua Geometry separada; no retangular, M-Bites usa a mesma posição com uma linha deslocada pelo raio da broca. Confira largura, profundidade e furos na prévia.
# CutoutToolPanel.java
ui.47a3159fcd80=Sem gaps manuais; será usado o padrão automático.
# CutoutToolPanel.java
