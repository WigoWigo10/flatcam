ui.13fdcb98a08d=Posição final X,Y; None mantém o último furo. Use X;Y para duas coordenadas. Mantém pelo menos o Travel Z da última ferramenta durante o deslocamento, mesmo sem exclusões; só depois alcança End move Z no destino. Around/Over também protegem a rota.\n\nAtenção: configure Travel Z acima dos obstáculos e confira o destino antes de escolher uma altura final baixa.\n\nUnidades: unidade do objeto (mm ou in).
