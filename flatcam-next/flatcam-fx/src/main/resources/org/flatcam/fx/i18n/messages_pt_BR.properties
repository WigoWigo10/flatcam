# PanelTooltips.java
ui.436bc30a4940=Selecione as formas, aberturas ou ferramentas a editar. A seleção no desenho e na tabela é sincronizada.\n\nAtalhos: Ctrl+clique alterna itens; Shift+clique seleciona um intervalo.\n\nAs alterações do editor ficam em rascunho até aplicar ao objeto.
# PanelTooltips.java
ui.ad2d9c120fc7=Ferramentas desta operação. Selecione uma linha para revisar seus parâmetros; algumas operações usam somente as linhas selecionadas.\n\nDiâmetro: largura da ferramenta, na unidade do objeto.\nTT: perfil C1–C4 (fresa plana), B (esférica) ou V (ponta em V), quando disponível.\n\nAtalhos: Ctrl+clique alterna itens; Shift+clique seleciona um intervalo.
# PanelTooltips.java
ui.17ff5079da43=Aberturas Gerber: Cód. identifica o D-code; Tipo é o formato; Tam. / Dim são dimensões; M marca a abertura no plot.\n\nUnidades: unidade do Gerber (mm ou in).
# PanelTooltips.java
ui.389187de5ff7=Ferramentas Excellon e seus diâmetros, quantidades de furos e slots. Marcar Plot controla apenas a visualização.\n\nUnidades: unidade do Excellon (mm ou in).
