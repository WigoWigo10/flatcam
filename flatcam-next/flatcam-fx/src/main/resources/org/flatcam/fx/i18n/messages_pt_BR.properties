# ToolDefaultsDescriptions.java
ui.9907fcc7f052=Mínimo permitido para\u0020
# ToolDefaultsDescriptions.java
ui.19da5e1e3c26=. Resultados abaixo desse limite são violações; ausência de violações não certifica fabricação.
# ToolDefaultsDescriptions.java
ui.bf0c2c37e061=Profundidade máxima adicionada em cada passe, como valor positivo. Só é usada com Multi-Depth ativado. Não é a profundidade final do corte.
# ToolDefaultsDescriptions.java
ui.f6bb6c9b346b=Divide a profundidade total em passes até alcançar Cut Z. Configure também a profundidade por passe; o modo de retração depende da operação CNC.
# ToolDefaultsDescriptions.java
ui.b8b816e3fdad=Rotação em RPM ou potência conforme o perfil. Zero não comanda rotação nos perfis que permitem isso; a sequência de troca pode parar o spindle antes da pausa. Sonda e outros perfis têm requisitos próprios.
# ToolDefaultsDescriptions.java
ui.8fdaa06153d7=Duração da espera após ligar o spindle, em segundos, quando Dwell estiver ativado. Zero não espera; não é uma porcentagem.
# ToolDefaultsDescriptions.java
ui.7c2322bb5cc0=Avanço rápido explícito apenas nos perfis que o utilizam. Zero usa o automático do perfil (normalmente 1500 mm/min, Roland 900 mm/min), convertido para a unidade correspondente. Em GRBL, os limites de G0 são definidos pelo controlador.
# ToolDefaultsDescriptions.java
ui.c4302f8429b2=Altura final da furação após desligar o spindle. Se há End XY, mantém pelo menos Travel Z da última ferramenta durante o movimento lateral e só depois alcança End Z no destino, com ou sem exclusões. Atenção: confira a folga de Travel Z e o destino antes de escolher uma altura final baixa.
# ToolDefaultsDescriptions.java
ui.6f92ed8ee28f=Magnitude positiva da profundidade de corte; o CNC escreve Z negativo. Não confundir com o Cut Z negativo dos outros painéis. Ferramentas V podem calcular a profundidade a partir da ponta e largura.
# ToolDefaultsDescriptions.java
ui.1da32985addd=Altura de troca/retorno usada pelo painel de sondagem Mach3. Não ativa a sonda por si só. Ao gerar, confira os parâmetros e as confirmações exigidas pela sequência.
# ToolDefaultsDescriptions.java
ui.5996c8f45ada=Largura da moldura externa do filme negativo. Não altera a Geometry de origem.
# ToolDefaultsDescriptions.java
ui.20fe3652021d=Ajuste da largura do traço no filme exportado. Zero conserva o padrão do exportador; não é o fator de escala X/Y da placa.
# ToolDefaultsDescriptions.java
ui.19b7c74f74b4=Diâmetro dos vazios nos centros dos pads quando a furação por pads do filme positivo estiver ativada. Não cria um Excellon.
# ToolDefaultsDescriptions.java
ui.4a831ece73d0=Fator de escala do filme no eixo indicado. 1 preserva o tamanho; não transforma o objeto do projeto.
# ToolDefaultsDescriptions.java
ui.27feec0deda4=Inclinação do filme no eixo indicado, em graus. Não é uma distância nem transformação do objeto de origem.
# ToolDefaultsDescriptions.java
ui.28b758fbfe43=Resolução da imagem PNG em pontos por polegada. Não controla a geometria vetorial de SVG/PDF nem a precisão da máquina.
# ToolDefaultsDescriptions.java
