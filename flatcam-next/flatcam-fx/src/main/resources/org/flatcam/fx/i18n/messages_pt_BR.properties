ui.70f19487b4bd=Ativado: converte os rasgos desta ferramenta em uma sequência de furos sobrepostos, como Drill slots no Python. Usa o diâmetro real do Excellon.\n\nDesativado: preserva a fresagem lateral ao longo do rasgo. Não altera o arquivo de origem; confira se a ferramenta admite a operação escolhida.
