ui.431de278c0b2=Altura Over Z
# CncExclusionEditor.java
ui.f47cbba69b65=Altura positiva absoluta, na unidade do objeto. Nunca reduz Travel Z. As mudancas de altura ocorrem fora da região protegida pela ferramenta; no intervalo entre áreas, pode voltar a altura segura.\n\nAtenção: deve superar grampos, com folga, sem exceder o curso da máquina. Confira também a haste e o cabeçote: não são simulados.
