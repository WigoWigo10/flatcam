# CutoutToolPanel.java
ui.ee8fd6aaa02c=O Cutout cria Geometry. Em Thin, cria outra Geometry para as pontes, com Thin Depth configurado: gere seu CNC Job separadamente. Áreas manuais removem exatamente os trechos do caminho que cobrem; se houver alguma, substituem o padrão automático de gaps. Revise alturas, avanço e spindle antes de criar cada CNC Job. M-Bites cria Excellon: configure a furação separadamente.
