# GCodeEditorController.java
ui.0812ae6fee63=Edite o texto e clique Aplicar para atualizar o CNC Job em memória. Salvar arquivo grava uma copia do rascunho; não altera o arquivo original automaticamente. Cancelar descarta as alterações. A pré-visualização cobre movimentos G0/G1, arcos G2/G3 em XY e os subconjuntos lineares ISEL ICP, HPGL e Roland RML-1 (^IN/^PA/Z/V/!MC); sondagem G31 e referência G92 deixam a prévia indisponível. Macros e resets de origem não são simulados e não valida a segurança do programa para uma máquina CNC.
