# TclFlatcamCommands.java
ui.09cdace1c4f1=open_project {C:/pasta/projeto.fcnproj}\nAceita .fcnproj e .FlatPrj. Recusa alterações não salvas: use save_project antes, ou open_project {arquivo} -force true para descartar explicitamente. Force não ignora rascunhos, validação, cancelamento ou alterações durante o carregamento. Use / e chaves em caminhos Windows.
# TclFlatcamCommands.java
ui.c48f8b400a29=save_project {C:/pasta/projeto.fcnproj}\nsave_project {C:/pasta/projeto.FlatPrj}\nFormato pela extensao obrigatoria; substitui o destino depois de serializar. Feche os editores antes. .FlatPrj preserva apenas recursos representaveis no Python; mantenha também .fcnproj. Cancelar antes da publicacao preserva o destino; não interrompe a compressão no meio.
# TclFlatcamCommands.java
ui.e9ca66dec3f9=plot_all ?-plot_status True|False? ?-use_thread True|False?\nExibe todos por padrão; False oculta. -use_thread é validado, mas o FX mantém sua política de workers. CNC Job sem prévia compatível é recusado. Não aguarda todos os quadros da GPU.
# TclFlatcamCommands.java
ui.f7967779f04c=plot_objects {placa,furos,rota} ?-plot_status True|False?\nLista separada por virgulas; chaves preservam espaços. Valida todos os nomes antes de alterar o Plot. CNC Job sem prévia compatível é recusado.
# TclFlatcamCommands.java
ui.6f3cc297d5bf=set_active {nome}\nAdiciona o objeto à seleção atual, como no Python; não exibe camadas ocultas nem rouba o foco do Terminal. Feche editores de objetos antes.
# TclFlatcamCommands.java
ui.8866a79121c6=offset {nome} -x 1.2 -y -0.3\nTambém aceita offset {nome} 1.2 -0.3. Eixos omitidos: 0.
# TclFlatcamCommands.java
ui.23128c50315d=scale {nome} 2 -origin center\nscale {nome} -x 2 -y 1 -origin {(3,4)}\nReferência: center (padrão), origin, min_bounds ou x,y. Eixo omitido: 1; fator zero recusado.
# TclFlatcamCommands.java
ui.ea9ac619f27f=mirror {nome} -axis X -origin 0,0\nmirror {nome} -axis Y -box {referência}\nX reflete Y; Y reflete X (padrão). -box usa o centro da referência e prevalece sobre -origin. Sem referência: (0,0).
# TclFlatcamCommands.java
ui.8c3a2a315522=skew {nome} -x 10 -y 0\nÂngulos em graus, entre -90 e 90; referência: canto inferior esquerdo. Eixos omitidos: 0.
# TclFlatcamCommands.java
ui.a0c28cc72e47=rotate {nome} 90 ?-origin center|origin|min_bounds|x,y? ?-box {referência}?\nExtensao do Terminal FX: este checkout Python tem rotação na UI, não um comando Tcl rotate. Graus positivos = horario, como Transformations; negativos = anti-horario. Centro do objeto por padrão; -box prevalece sobre -origin. CNC Jobs recusados.
# TclFlatcamCommands.java
ui.1bb7b5a45dd0=\u0020{saída} {geo 1} {geo 2} ...\nCria Geometry oculta, sem apagar origens; pelo menos duas Geometry distintas, mesmas unidades e tipo single/multi. Mantém ferramentas separadas e remapeia parâmetros; conflitos comuns recusados. Use plot_objects para exibir.
# TclFlatcamCommands.java
ui.d78b4bd570f6=\u0020{saída} {furos 1} {furos 2} ...\nCria Excellon oculto, preservando origens; pelo menos dois Excellon distintos, mesmas unidades. Funde diâmetros a quatro casas; remapeia furos/slots/parâmetros/seleção. Conflitos recusados.
# TclFlatcamCommands.java
ui.941e51dcc2bb=\u0020{furos} {C:/pasta/saída.drl}\nExporta os furos/slots atuais no formato salvo por Arquivo > Exportar > Excellon; sem configuração: IN, decimal 2:4, slots roteados. Conversão/arredondamento podem alterar precisão. FX exige destino explícito (Python permite omitir); substitui arquivo existente. Feche editores. Cancelar antes da publicacao preserva o destino; não muda preferências.
# TclFlatcamCommands.java
ui.3500496d65d6=\u0020{cobre} {C:/pasta/saída.gbr}\nExporta a imagem Gerber atual como regiões resolvidas no formato escolhido por Arquivo > Exportar > Gerber. Sem configuração: IN, 2:4, zeros L. Não preserva macros/identidades de aperturas/comandos originais. Destino explícito obrigatorio; substitui arquivo existente após validação. Feche editores; não muda preferências.
# TclFlatcamCommands.java
ui.bfe1ba9687de=export_svg {nome} {C:/pasta/saída.svg} ?scale_stroke_factor?\nexport_svg {nome} {C:/pasta/saída.svg} ?-scale_stroke_factor valor?\nGerber/Excellon/Geometry e CNC com prévia compatível. Fator positivo = metade da largura do traco; <=0 = automático (0.02 para formas; diâmetro da ferramenta ou 0.02 para CNC). Não escala coordenadas. Unidades da origem, Y para cima, Travel sob Cut. Destino explícito obrigatorio; substitui arquivo existente após validação. Feche editores.
# TclFlatcamCommands.java
ui.59e837ded8f7=drillcncjob {furos} -drillz -1.7 -travelz 2 -feedrate_z 300 ?-drilled_dias 0.8,1.0? ?-diatol pct? ?-dpp passo? ?-spindlespeed rpm? ?-toolchangez z? ?-toolchangexy x,y? ?-startz z? ?-endz z? ?-endxy x,y? ?-dwelltime s? ?-feedrate_rapid f? ?-pp perfil? ?-opt_type B|M|T? ?-outname nome?\n-drillz (negativo), -travelz e -feedrate_z são obrigatorios no FX (o Python usaria Preferências). Ferramentas em ordem crescente de diâmetro. Troca de ferramenta só com -toolchangez. -pp aceita o nome Python (ex.: GRBL_11) ou do FX; padrão FX portable. -opt_type B/M/T usa a ordem por proximidade do FX, não OR-Tools/TSP. -muted e aceito sem efeito.
# TclFlatcamCommands.java
ui.c82380709055=Use either positional scale_stroke_factor or -scale_stroke_factor, not both.
