ui.f432374b5406=Adiciona um furo no ponto final quando a distância até o último centro é pelo menos um décimo do passo, como no Python. Desativado: para no último centro intermediário.\n\nA sequência de círculos não é equivalente a fresar o contorno: pode deixar material entre furos. Confira a prévia 2D e o processo físico.
