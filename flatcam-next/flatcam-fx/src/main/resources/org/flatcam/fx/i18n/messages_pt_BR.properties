ui.c5795d9ddd66=Ativa áreas proibidas para cortes. Desmarcar conserva áreas para edição, mas não as usa no G-code. Apenas fresagem sem sonda; perfis incompatíveis recusam exclusões ativas.\n\nAtenção: configure todas as fixações e confira o G-code; não modela macros, hastes, cabeçote ou limites da máquina.
