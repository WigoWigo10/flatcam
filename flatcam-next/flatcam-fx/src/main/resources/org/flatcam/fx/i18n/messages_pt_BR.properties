ui.d09def098953=\u0020Acima deste total o destaque usa uma caixa; todas as formas continuam selecionadas.
# ToolDefaultsDescriptions.java
ui.62c9fb0f78df=\u0020GRID replica a seleção em uma grade retangular, com passos entre centros; LINEAR/CIRCULAR criam novos elementos e têm prévia.
# ToolDefaultsDescriptions.java
ui.5b4902320e95=\u0020Só usado se não há ferramenta existente selecionada; diâmetros existentes são preservados.
# ToolDefaultsDescriptions.java
ui.665564621f49=\u0020AA define a opacidade: 00 transparente, FF opaco.
# ToolDefaultsDescriptions.java
ui.27ad86d781a0=Formato inicial usado em Exportar, Salvar como e no Terminal. Unidades do arquivo são independentes do objeto; as coordenadas e diâmetros são convertidos. A precisão escolhida arredonda as coordenadas exportadas, sem alterar o objeto. IN usa polegadas; MM usa milímetros.
# ToolDefaultsDescriptions.java
ui.edabd3b0f7d8=\u0020Gerber: L omite zeros à esquerda; T omite zeros à direita.
# ToolDefaultsDescriptions.java
ui.ee4ad1252d96=\u0020Excellon sem ponto: LZ mantém zeros à esquerda; TZ mantém zeros à direita. No modo decimal, esta opção não altera coordenadas.
# ToolDefaultsDescriptions.java
ui.9383c2fb5322=\u0020ROUTED usa G00/M15/G01/M16; G85 usa o ciclo de slot. Escolha o formato aceito pelo destino.
# ToolDefaultsDescriptions.java
ui.947a800882a6=\u0020dec escreve ponto decimal; ndec usa os dígitos e zeros declarados no cabeçalho.
# ToolDefaultsDescriptions.java
ui.dc14d86c8ff9=Sem descrição do padrão\u0020
# ToolDefaultsDescriptions.java
ui.b615ac02add9=. Os valores mm e in são salvos separadamente; alternar não converte o rascunho.
# ToolDefaultsDescriptions.java
ui.52d1c9e00d5e=\n\nOpções:\u0020
# ToolDefaultsDescriptions.java
ui.5fe4883c4d2a=\n\nPadrão de fábrica:\u0020
# ToolDefaultsDescriptions.java
ui.34edd649b134=. Só é persistido ao salvar os padrões; vale para painéis abertos depois. Não altera objetos, CNC Jobs nem painéis já abertos.\u0020
# ToolDefaultsDescriptions.java
ui.116020e7afe3=A validação completa destes padrões ocorre ao salvar.
# ToolDefaultsDescriptions.java
ui.1ba130c2bd84=A validação completa ocorre ao gerar a operação.
# ToolDefaultsDescriptions.java
ui.4a0b50a2b1ce=Espaçamento colunas
# ToolDefaultsDescriptions.java
ui.ce00249f5b21=Espaçamento linhas
# ToolDefaultsDescriptions.java
ui.e9ab82cb192c=V-Tip Angle (graus)
# ToolDefaultsDescriptions.java
ui.fa693d21c4fb=Padrão visual para novos CNC Jobs. Corte e deslocamento têm cores RGBA independentes; ALL mostra ambos, CUT só corte e TRAVEL só deslocamento. Anotações usam tamanho de 1 a 72 pixels lógicos; a cor padrão adapta o contraste ao tema. Não modifica G-code. Cópias e projetos reabertos conservam o estilo salvo. Só vale para novos objetos; controles nas propriedades continuam disponíveis.
# ToolDefaultsDescriptions.java
ui.2cdd1cde7f69=Exibe inicialmente as linhas centrais do Gerber (Follow), em vez do cobre preenchido. A geometria sólida original continua disponível para CAM. Vale para novos objetos; projetos reabertos e cópias conservam seu estado. Pode ser alternado nas propriedades sem perder a cor.
# ToolDefaultsDescriptions.java
ui.7dfb138c6b26=Abre a tabela de aberturas expandida nos próximos painéis Gerber Object. Recolher/expandir na própria seção não modifica a geometria. É um padrão do painel; esse estado de expansão não é salvo por objeto no projeto.
# ToolDefaultsDescriptions.java
ui.baa07e368cdf=Cor inicial de novos objetos desta categoria. O seletor e o hexadecimal são equivalentes. Use #RRGGBB ou #RRGGBBAA: AA vai de 00 (transparente) a FF (opaco), por exemplo #BBF268BF. A opacidade é independente para preenchimento e linhas. Projetos reabertos, cópias e objetos existentes conservam suas cores; não altera CAM nem G-code.
# ToolDefaultsDescriptions.java
ui.5d742879ac65=Visibilidade inicial ao adicionar novos objetos desta categoria. Objetos ocultos continuam no projeto e podem ser ativados pela árvore ou propriedades. Não altera objetos existentes nem o estado salvo em projetos reabertos.
# ToolDefaultsDescriptions.java
ui.49e69952c72a=Preenche inicialmente os polígonos de novos objetos; desmarcado mostra seus contornos. Furos continuam vazados. A opção afeta o desenho, sem modificar a geometria usada no CAM.
# ToolDefaultsDescriptions.java
ui.cc28facb205e=Desenha inicialmente as partes do objeto com cores diferentes. Substitui visualmente a cor única enquanto ativo, preservando a cor escolhida para quando for desativado. Não representa identificação elétrica de redes.
# ToolDefaultsDescriptions.java
ui.f44193ad60df=Número de segmentos por volta completa para novos arcos e círculos do Editor Geometry, de 4 a 4096. Círculos usam o múltiplo de 4 inferior, como no Python: 65 resulta em 64. Mais segmentos aproximam melhor a curva e aumentam memória/custo da prévia. Não modifica formas existentes nem garante precisão física da máquina. O editor permite ajustar o valor localmente antes de desenhar.
# ToolDefaultsDescriptions.java
ui.daa022cb0414=Lista de diâmetros iniciais das ferramentas. Separe os itens com vírgula e use ponto decimal, por exemplo 1.0, 0.5. Não é uma única ferramenta nem uma conversão automática de unidades.
# ToolDefaultsDescriptions.java
ui.6c40ce53a35a=STABLE usa um início determinístico para os anéis Seed do FX. PYTHON usa o ponto representativo do algoritmo Python. Podem gerar percursos diferentes na mesma área; confira o resultado.
# ToolDefaultsDescriptions.java
ui.7d57dc1f9b6c=C1–C4 identificam fresas planas de um a quatro dentes; B é esférica e V tem ponta em V. O perfil não define avanço ou RPM automaticamente. Para V, confira V-Tip Dia e Angle ao gerar CNC.
# ToolDefaultsDescriptions.java
ui.3dd1e46fd590=Margem das posições automáticas dos fiduciais em relação à caixa do Gerber. Não é o tamanho da marca nem a abertura da máscara.
# ToolDefaultsDescriptions.java
ui.01bfc35ea137=Perfil inicial de CNC. Deve ser compatível com o controlador e o tipo de operação. Nem todos os perfis aceitam furação, laser, sonda ou múltiplas ferramentas; a seleção final é validada no painel CNC.
# ToolDefaultsDescriptions.java
ui.7c9bf0cbede2=Unidade de fallback somente quando o Gerber não declara unidades. Uma declaração no arquivo tem prioridade. Não converte projetos já abertos.
# ToolDefaultsDescriptions.java
ui.3bc8bc319d0d=Segmentação usada para aproximar arcos e círculos do Gerber. Mais segmentos aumentam detalhe, memória e custo de cálculo; não aumentam a precisão física da máquina.
# ToolDefaultsDescriptions.java
ui.97a0b59de961=Dígitos inteiros (1–9) usados em coordenadas Excellon sem ponto com LZ, quando o arquivo não declara formato. LZ mantém os zeros à esquerda e pode omitir os finais. Declarações FILE_FORMAT ou INCH/METRIC com máscara têm prioridade. Não afeta números com ponto nem projetos abertos.
# ToolDefaultsDescriptions.java
ui.3ba09f061500=Convenção somente quando o arquivo não declara: TZ mantém zeros à direita e permite omitir os iniciais; LZ mantém zeros à esquerda e permite omitir os finais. Exemplo IN 2:4: 0012 significa 0,12 em LZ, e 0,0012 em TZ. Um ponto explícito ignora esta opção. O cabeçalho LZ/TZ no arquivo sempre tem prioridade.
# ToolDefaultsDescriptions.java
ui.0d0f92c0ca59=RECUSAR impede importar um Excellon sem unidade declarada. IN/MM definem o fallback explícito para esse caso; a unidade declarada no arquivo tem prioridade.
# ToolDefaultsDescriptions.java
ui.e66d66988505=Casas decimais (0–9) para coordenadas Excellon sem ponto em TZ, quando o arquivo não declara formato suficiente. Em LZ, os dígitos inteiros definem a posição do ponto. Um ponto decimal explícito ou formato declarado tem prioridade. Só afeta novas importações na unidade indicada.
# ToolDefaultsDescriptions.java
