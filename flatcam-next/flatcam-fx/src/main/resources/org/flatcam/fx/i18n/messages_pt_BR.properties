ui.5a5bd1cbc177=Visita o próximo furo mais perto dentro de cada ferramenta, partindo da posição real após a troca. Inclui os furos convertidos por Drill slots; não reordena rasgos fresados. Não elimina furos repetidos nem muda profundidades. Não mistura ferramentas, não garante ótimo global e usa distância direta, não custo dos desvios Around/Over.
