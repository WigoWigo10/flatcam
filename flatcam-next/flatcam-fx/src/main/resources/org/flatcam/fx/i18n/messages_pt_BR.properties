ui.58cb9e9da85e=RPM positivo comanda a partida na velocidade solicitada. RPM zero deixa o acionamento e a parada sob controle manual: não envia uma partida automática e não garante a parada final. Trocas ativadas podem parar o spindle antes da pausa.\n\nZero não significa desligar o spindle. Confira o G-code e o procedimento da máquina. Perfis PWM usam sua própria faixa de potência.
