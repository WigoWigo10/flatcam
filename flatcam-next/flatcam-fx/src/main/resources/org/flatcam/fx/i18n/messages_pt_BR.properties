ui.23f45544b87d=Se marcado, compara cada diâmetro com a menor distância entre elementos de\ncobre do Gerber e avisa se alguma ferramenta e grande demais para fazer um\nisolamento completo. Apenas informativo - não impede a geração.
# NccToolPanel.java
ui.f3e1e0c3c5c5=Standard: passes concentricas para dentro.\nSeed: aneis crescentes a partir de um ponto central.\nLines: varredura paralela (raster).\nCombo: tenta Lines, depois Seed, depois Standard.
# NccToolPanel.java
ui.6e34de730a9a=Ponto inicial dos aneis Seed (também usado no fallback Combo).\n\nEstavel (FX): conserva o comportamento atual e reduz mudancas bruscas por pequenas variações da geometria.\nRepresentativo (Python): usa a mesma regra de scan-line do legado, para reproduzir seus aneis. Pequenas diferenças numéricas na entrada ainda podem mudar o ponto e os trajetos.\n\nEsta escolha pertence a cada ferramenta; Standard e Lines não a utilizam.
