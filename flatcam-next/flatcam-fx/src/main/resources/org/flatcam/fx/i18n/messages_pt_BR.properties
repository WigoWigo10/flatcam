ui.ee5e6c23aef0=Cada ferramenta menor trabalha apenas onde as maiores não alcançaram. As ferramentas são usadas da maior para a menor.
# PanelTooltips.java
ui.d22fd9511bb4=No = ordem da tabela.\nForward = diâmetros do menor para o maior.\nReverse = do maior para o menor.\n\nRest Machining usa a ordem do maior para o menor.
# PanelTooltips.java
ui.5a756dcbcbb6=Verifica se os diâmetros escolhidos cabem nos espaços entre regiões de cobre. A verificação não substitui a inspeção dos caminhos gerados.
