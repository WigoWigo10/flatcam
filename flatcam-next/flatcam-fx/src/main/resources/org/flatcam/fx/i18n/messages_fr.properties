# CutoutToolPanel.java
ui.ca024fd61793=LR/TB créent deux ponts ; QUATRE crée quatre ; TWO_LR/TWO_TB en créent quatre ; HUIT crée huit.\n\nPour une découpe rectangulaire, le centre de la source est décalé de la marge, comme dans Python. Utilisation de motifs doubles (dimension source + deux marges) / 4 ; le rayon de l'outil ne modifie pas cet espacement.\n\nSi la marge ou la largeur supprime un pont demandé, la génération rectangulaire est rejetée. Les espaces manuels remplacent le motif. Vérifiez l'aperçu avant de générer CNC.
# CutoutToolPanel.java
