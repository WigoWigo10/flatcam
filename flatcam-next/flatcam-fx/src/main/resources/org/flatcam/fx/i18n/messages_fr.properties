ui.50eeae2a66f3=Démarre une bibliothèque vide sans supprimer le fichier actuel. S'il y a des modifications non enregistrées, demande une confirmation avant de les ignorer.
# ToolsDatabaseDescriptions.java
ui.841aa9d512f7=Ouvre une base de données FlatCAM Python .FlatDB ou JSON et remplace la bibliothèque en mémoire après une lecture valide. Demande une confirmation pour annuler les modifications ; conserve la base de données actuelle en cas d'erreur.
# ToolsDatabaseDescriptions.java
ui.88d2c76ce9e0=Écrit une copie .FlatDB/JSON dans un autre fichier. Conserve l'association de base de données actuelle et les modifications en attente ; exporter vers son propre fichier équivaut à enregistrer. Crée une sauvegarde lors de l'écrasement.
# ToolsDatabaseDescriptions.java
ui.0a04515a75ba=Valide et enregistre la bibliothèque dans son fichier associé, ou demande une destination lors de la première sauvegarde. Crée une sauvegarde avant d'écraser et efface l'indicateur de modifications. Raccourci : Ctrl+S.
# ToolsDatabaseDescriptions.java
ui.2f98070e9466=Identification des outils, diamètre, tolérance et fonctionnement. Sélectionnez un seul outil à modifier ; la sélection multiple permet de copier ou de supprimer.
# ToolsDatabaseDescriptions.java
ui.953c8825f4d0=Paramètres de forme, de pointe en V et CNC transférés vers Geometry/Milling, y compris Tool Offset/Custom Offset. Cutout reçoit les paramètres de coupe mais ne réapplique pas le décalage aux trajectoires déjà compensées. L'aide de chaque champ explique les limites de prise en charge.
