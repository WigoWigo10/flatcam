# GeometryCncToolPanel.java
ui.4ab89e701ae5=Maximum de tâche Travel Z : valeur par défaut prudente, utilisant la hauteur la plus élevée sur chaque chemin.\n\nTravel Z de chaque outil : utilise la hauteur configurée de chaque outil, comme dans le flux de travail Python Geometry ; s'applique également entre les passages et lors du stationnement du dernier outil. Vérifiez chaque hauteur et fixation avant de sélectionner.\n\nLe changement d'outil Z reste partagé et doit être au moins maximum Travel Z. Les exclusions Over ne diminuent jamais la hauteur effective. Ne simule pas la sécurité de la tige, de la tête d'outil ou physique.
# GeometryCncToolPanel.java
ui.a3e15129b7de=**Start Z:** mouvement Z initial avant de démarrer la broche. Vide/Aucun utilise Travel Z lors de la génération. Standard accepte zéro ou positif ; Machinist accepte n'importe quelle coordonnée finie.\n\nAvant le déplacement de XY, FX se déplace vers Travel Z. Start Z n'effectue pas de référencement ni ne confirme le jeu de l'outil.\n\nUnités : unités de l'objet (mm ou pouces).
# GeometryCncToolPanel.java
ui.6dcc9e5883c7=End Z : hauteur finale après arrêt de la broche. Vide/Aucun utilise le Travel Z effectif du dernier outil : le maximum de la tâche par défaut, ou sa propre hauteur en mode par outil.\n\nSi End Z est inférieur, End X,Y se déplace en premier à la hauteur de sécurité ; alors seulement descend à End Z. Confirmez l’autorisation de destination.
# GeometryCncToolPanel.java
ui.3cecae9744b0=Position finale X,Y. Vide/Aucun conserve la dernière position de coupe. Utilisez 10,5 ; 20,5 ou, avec des virgules décimales, 10,5 ; 20,5.\n\nFX se déplace à une hauteur sûre avant de descendre à End Z. Le mouvement apparaît dans l'aperçu.\n\nUnités : unités de l'objet (mm ou in).
# GeometryCncToolPanel.java
ui.d8ac73a6edc4=Changement d'outil Z : hauteur utilisée avant le changement d'outil. Vide/Aucun utilise un maximum de Travel Z.\n\nDoit être au moins le Travel Z le plus élevé de l'outil. Appliqué uniquement lorsque les changements d'outils sont activés ou que le profil sélectionne automatiquement les outils.
# GeometryCncToolPanel.java
ui.ab78a163d37e=Changement d'outil X,Y : changement de position, y compris le premier changement, lorsqu'il est activé. Vide/Aucun change à la position actuelle. Utilisez 10.5;20.5 ou 10,5;20,5.\n\nFX se rétracte avant XY et M0/M6.\n\nAttention : vérifiez les pinces et la macro de la machine ; l'aperçu ne simule pas les mouvements à l'intérieur d'une macro M6.\n\nUnités : unités de l'objet (mm ou pouces).
