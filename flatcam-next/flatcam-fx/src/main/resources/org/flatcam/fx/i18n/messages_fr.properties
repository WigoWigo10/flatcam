# ToolsDatabaseDescriptions.java
ui.7454aeb3a9f1=Valide les champs modifiés et applique les modifications à l'outil en mémoire. N'écrit pas sur le disque ; La base de données enregistrée la conserve. Les valeurs invalides conservent le brouillon pour correction.
