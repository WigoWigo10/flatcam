# CncPreflight.java
ui.c7a394da9f72=Laser : la puissance est la valeur S/PWM demandée au contrôleur, et non la valeur physique RPM. L'aperçu affiche les chemins mais ne simule pas les poutres, les matériaux, les verrouillages ou les paramètres électriques ; ce n'est pas une validation de sécurité.
# CncPreflight.java
ui.e6b011d26eaf=Laser : un passage par trajectoire, sans Multi-Depth, changements d'outils mécaniques, Dwell ou Extra Cut. Les points isolés nécessitent un temps de pose et sont rejetés. End Z/XY est partagé ; l'alimentation/l'alimentation sont individuelles par groupe et Z_laser/Marlin permettent une mise au point individuelle.
# CncPreflight.java
ui.fb3647cef05d=Laser GRBL : confirmer 30 $ (échelle S), 32 $ (mode laser) et le câblage de commande. Commandes FX M5 avant le positionnement ; il ne détecte pas la configuration de la machine et ne suppose pas que S représente un pourcentage.
# CncPreflight.java
ui.bfb39f3cb997=Laser Marlin : confirmez INCH_MODE_SUPPORT pour IN, la configuration de sortie et le mode de contrôle non en ligne par défaut. Correction de G0_FEEDRATE pouvant ignorer les rapides d'alimentation. M400 inclut le stationnement final mais ne confirme pas l'arrêt physique du faisceau.
# CncPreflight.java
ui.5ed498ea494d=Marlin FAN : M106/M107 utilise PWM de 1 à 255 dans ce profil. Confirmez la broche FAN et LASER_SYNCHRONOUS_M106_M107 ; la vitesse du ventilateur n'est pas une puissance optique calibrée.
# CncPreflight.java
ui.833e9f781ddb=Répétiteur : la puissance est FAN PWM de 0 à 255, pas RPM. M106/M107 nécessitent une sortie et des circuits de VENTILATEUR appropriés ; ils ne confirment pas la rotation physique. La puissance nulle n'active pas la sortie et ne garantit pas un arrêt final si elle était déjà activée.
# CncPreflight.java
ui.a963bb6108f4=Repetier : @pause demande un changement d'outil opérateur via Repetier-Host ; il ne sélectionne pas automatiquement un outil. M84 libère les moteurs et peut perdre la référence. Vérifier les luminaires, l'origine et la hauteur avant de reprendre ; l'aperçu ne simule pas cette perte.
# CncPreflight.java
ui.2a98c7ae4ac7=Berta : confirmez la configuration de la commande M110/M111 et l'origine de G54. Leurs effets dépendent de la machine et ne sont pas simulés ; ne sélectionnez pas le profil simplement parce qu’il accepte le G-code générique.
# CncPreflight.java
ui.12993adbfa62=Berta : G64 P0.03 conserve la valeur du profil Python en unités de programme : 0,03 mm dans MM ou 0,762 mm dans IN. Il s'agit d'une tolérance de chemin configurée et non d'une précision garantie. Vérifiez avant d'exporter.
# CncPreflight.java
ui.ad72fab202c4=Dwell : le temps d'interface reste en secondes ; G4 P est émis en millisecondes, y compris dans IN. Le flux natif est par minute, sans G94.
# CncPreflight.java
ui.1a5bfef7cb45=Changement d'outil manuel : trois M0 pauses par outil. Entre eux, un déplacement commandé vers Z0 utilise l'avance Z de l'outil et revient au changement d'outil Z ; G90 est restauré avant les mouvements verticaux. Il ne s’agit pas d’un sondage ou d’une détection automatique des contacts.
# CncPreflight.java
ui.bfa4c6d10df1=Confirmez le zéro de la pièce, la position XY et la hauteur libre avant de poursuivre chaque pause. Les mouvements des opérateurs et les changements d’origine/unité ne sont pas simulés.
# CncPreflight.java
ui.056653f07521=Changement d'outil personnalisé : Tn/M6 lorsque les changements d'outils sont activés, sans M0 supplémentaire. Height et XY sont commandés avant la macro ; ensuite, G90 et Z sont restaurés avant le prochain XY. La macro, la sélection physique de l'outil et les changements d'origine ne sont pas simulés.
# CncPreflight.java
ui.551bc50c7c28=ISEL ICP : mm uniquement ; coordonnées en micromètres, VEL/FASTVEL en micromètres par seconde et WAIT en millisecondes. Les valeurs sont tronquées en nombres entiers sans augmenter la précision du contrôleur.
# CncPreflight.java
ui.c055d19b5676=ISEL ICP : GETTOOL effectue des changements d'outils automatiques même sans pause manuelle. Confirmez la macro, le référencement et les hauteurs ; l'aperçu ne simule ni ce changement ni un timing rapide. Le stationnement préserve l'origine sans WPCLEAR.
# CncPreflight.java
ui.b78eb28ba8ec=line_xyz : augmentation initiale et restauration de Z après M6 conservent le courant X/Y. XYZ sont explicites lorsqu'ils sont connus ; confirmez que le contrôleur accepte le préambule vertical. La macro M6 n'est pas simulée.
# CncPreflight.java
ui.beced43c3234=ISEL CNC : ce profil utilise mm, G71/G94 et T1–T128. Les temps Dwell définis en secondes sont convertis en millisecondes dans G-code.
# CncPreflight.java
ui.47beaa3c3a96=ISEL DIN/ISO à distance : M01 est un arrêt impliquant une interaction de l'opérateur. Sur les autres contrôleurs, vérifiez si l'arrêt est facultatif et activé ; ne présumez pas que M01 se comporte toujours de la même manière.
# CncPreflight.java
ui.61300f9e6d65=ISEL CNC : les hauteurs de changement d'outil/XY sont émises avant M06 et Z est restauré après. La macro de changement d'outil et le référencement physique ne sont pas simulés. M30 se termine après le stationnement final.
# CncPreflight.java
ui.b47b197e04cf=Marlin : confirmez SPINDLE_FEATURE et CUTTER_POWER_UNIT=RPM. S représente RPM uniquement avec cette configuration.
# CncPreflight.java
ui.d39e5a5107c0=Marlin : Tn peut sélectionner des extrudeuses ; Tn/M6 nécessite une configuration compatible CNC ou une macro. M0 dépend de la prise en charge de la pause ; IN nécessite INCH_MODE_SUPPORT.
# CncPreflight.java
ui.942ad8da333b=Marlin : chaque G0 reçoit des rapides d'alimentation, mais le G0_FEEDRATE fixe peut ignorer F. M400 attend les mouvements du planificateur ; cela ne confirme pas l'arrêt physique de la broche.
# CncPreflight.java
ui.0fb95639fea3=L'aperçu du palpage ne simule pas les macros G31, contact, G92 ou de changement d'outil. Il ne valide pas la sécurité des machines.
# CncPreflight.java
