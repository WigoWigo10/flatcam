# ToolDefaultsDescriptions.java
ui.e9ab82cb192c=Angle de la pointe en V (degrés)
# ToolDefaultsDescriptions.java
ui.fa693d21c4fb=Afficher par défaut pour le nouveau CNC Jobs. La découpe et le déplacement ont des couleurs RVBA indépendantes ; ALL affiche les deux, CUT uniquement la coupe et TRAVEL uniquement le déplacement. Les annotations utilisent 1 à 72 pixels logiques ; la couleur par défaut adapte le contraste au thème. Ne modifie pas G-code. Les copies et les projets rouverts conservent le style enregistré. S'applique uniquement aux nouveaux objets ; les contrôles de propriété restent disponibles.
# ToolDefaultsDescriptions.java
ui.2cdd1cde7f69=Affiche initialement les lignes centrales Gerber (Suivre) au lieu du cuivre rempli. La géométrie solide d'origine reste disponible pour CAM. S'applique aux nouveaux objets ; les projets et les copies rouverts conservent leur état. Peut être activé dans les propriétés sans perdre de couleur.
# ToolDefaultsDescriptions.java
ui.7dfb138c6b26=Ouvre la table d'ouverture étendue dans les futurs panneaux d'objets Gerber. Réduire/agrandir la section ne modifie pas la géométrie. Un panneau par défaut ; l'état d'expansion n'est pas enregistré par objet de projet.
# ToolDefaultsDescriptions.java
ui.baa07e368cdf=Couleur initiale des nouveaux objets de cette catégorie. Le sélecteur et la saisie hexadécimale sont équivalents. Utilisez #RRGGBB ou #RRGGBBAA : AA va de 00 (transparent) à FF (opaque), par ex. #BBF268BF. L'opacité du remplissage et de la ligne est indépendante. Les projets rouverts, les copies et les objets existants conservent les couleurs ; ne change pas CAM ou G-code.
# ToolDefaultsDescriptions.java
ui.5d742879ac65=Visibilité initiale lors de l'ajout de nouveaux objets dans cette catégorie. Les objets masqués restent dans le projet et peuvent être activés via l'arborescence ou les propriétés. Ne modifie pas les objets existants ni l'état du projet rouvert.
# ToolDefaultsDescriptions.java
ui.49e69952c72a=Remplit initialement les nouveaux polygones d'objets ; décoché affiche les contours. Les trous restent ouverts. Affecte uniquement le dessin, pas la géométrie utilisée par CAM.
# ToolDefaultsDescriptions.java
ui.cc28facb205e=Dessine initialement des parties d'objet dans différentes couleurs. Remplace visuellement la couleur unique lorsqu'elle est active, en la préservant lorsqu'elle est désactivée. N'identifie pas les réseaux électriques.
# ToolDefaultsDescriptions.java
ui.f44193ad60df=Segments par cercle complet pour les nouveaux arcs/cercles de l'éditeur Geometry, de 4 à 4 096. Les cercles utilisent le multiple inférieur de 4, comme dans Python : 65 devient 64. Plus de segments se rapprochent mieux des courbes et augmentent la mémoire/le coût de l'aperçu. Ne modifie pas les formes existantes et ne garantit pas la précision physique de la machine. L'éditeur permet un ajustement local avant de dessiner.
# ToolDefaultsDescriptions.java
ui.daa022cb0414=Liste initiale des diamètres d'outils. Séparez les éléments par des virgules et utilisez des points décimaux, par ex. 1,0, 0,5. Pas un seul outil ni une conversion automatique d’unité.
# ToolDefaultsDescriptions.java
ui.6c40ce53a35a=STABLE utilise un démarrage déterministe pour les anneaux FX Seed. PYTHON utilise le point représentatif de l'algorithme Python. Peut produire différents chemins dans la même zone ; inspecter le résultat.
# ToolDefaultsDescriptions.java
ui.7d57dc1f9b6c=C1–C4 identifient les fraises plates avec une à quatre cannelures ; B est un nez sphérique et V est à pointe en V. Le profil ne définit pas automatiquement le flux ou RPM. Pour V, vérifiez le diamètre et l'angle de la pointe en V lors de la génération de CNC.
# ToolDefaultsDescriptions.java
ui.3dd1e46fd590=Marge de position de repère automatique par rapport aux limites Gerber. Ne marque pas la taille ou la taille de l'ouverture du masque.
# ToolDefaultsDescriptions.java
ui.01bfc35ea137=Profil CNC initial. Doit correspondre au contrôleur et au type d’opération. Tous les profils ne prennent pas en charge le perçage, le laser, le sondage ou plusieurs outils ; la sélection finale est validée dans le panel CNC.
# ToolDefaultsDescriptions.java
ui.7c9bf0cbede2=Unités de secours uniquement lorsque Gerber n’en déclare aucune. Les déclarations de fichiers sont prioritaires. Ne convertit pas les projets déjà ouverts.
# ToolDefaultsDescriptions.java
ui.3bc8bc319d0d=Segmentation se rapprochant de Gerber arcs/cercles. Plus de segments augmentent les détails, la mémoire et les coûts de calcul ; pas la précision physique de la machine.
# ToolDefaultsDescriptions.java
ui.97a0b59de961=Chiffres entiers (1 à 9) pour les coordonnées implicites Excellon avec LZ lorsqu'aucun format n'est déclaré. LZ conserve les zéros à gauche et peut omettre les zéros à droite. Les déclarations FILE_FORMAT ou INCH/METRIC masquées sont prioritaires. N'affecte pas les numéros de points explicites ou les projets ouverts.
# ToolDefaultsDescriptions.java
ui.3ba09f061500=Convention uniquement lorsqu'elle n'est pas déclarée : TZ conserve les zéros à droite et permet d'omettre les zéros à gauche ; LZ conserve les zéros de gauche et permet d'omettre les zéros de fin. IN Exemple 2:4 : 0012 signifie 0,12 avec LZ et 0,0012 avec TZ. Un point explicite ignore cette option. L'en-tête de fichier LZ/TZ est toujours prioritaire.
# ToolDefaultsDescriptions.java
ui.0d0f92c0ca59=RECUSAR rejette Excellon sans unités déclarées. IN/MM définissent une solution de secours explicite pour ce cas ; les unités de fichiers déclarées sont prioritaires.
# ToolDefaultsDescriptions.java
ui.e66d66988505=Nombre de décimales (0 à 9) pour les coordonnées implicites TZ Excellon lorsqu'un format insuffisant est déclaré. Avec LZ, des chiffres entiers déterminent la position du point. Les points décimaux explicites ou le format déclaré sont prioritaires. N'affecte que les nouvelles importations dans les unités indiquées.
