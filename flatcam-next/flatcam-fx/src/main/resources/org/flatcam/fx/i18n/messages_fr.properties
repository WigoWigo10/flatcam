# PanelTooltips.java
ui.0d20ffdbcfcc=Divise la profondeur totale en passes limitées par la valeur adjacente. Pour le perçage, l'outil se rétracte entre les passes.
# PanelTooltips.java
ui.f9bdd0393884=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.
# PanelTooltips.java
ui.dc3ffee94380=Hauteur de déplacement entre les coupes. Doit dégager la pièce à travailler et les accessoires ; confirmer la référence Z avant l'exécution.
# PanelTooltips.java
ui.c5cedf78c41e=Mise au point et hauteur de finition du profil laser. Pas de profondeur de fraisage.
