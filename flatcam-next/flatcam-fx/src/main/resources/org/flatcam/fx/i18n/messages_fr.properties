ui.0812ae6fee63=Modifiez le texte et utilisez Appliquer à CNC Job pour mettre à jour l'objet en mémoire et l'aperçu. Enregistrez les écritures dans le fichier original affiché ; sans fichier associé, il demande une destination. Enregistrer sous écrit une copie ailleurs et conserve l'original. Annuler supprime le brouillon en mémoire mais n'annule pas les fichiers déjà enregistrés. L'aperçu couvre les mouvements G0/G1, les arcs G2/G3 XY et les sous-ensembles linéaires de ISEL ICP, HPGL et Roland RML-1. Le sondage G31 et le référencement G92 rendent l'aperçu indisponible. Les macros et les réinitialisations d'origine ne sont pas simulées.
