ui.fdfb85fe5fa3=Extra Cut ajoute un segment après avoir terminé un chemin fermé. N'a aucun effet sur les chemins ouverts et n'est pas disponible pour le laser/HPGL.\n\nCe paramètre est individuel par outil ; Appliquez les paramètres à toutes les copies explicitement.
# GeometryCncToolPanel.java
ui.d7fbfcd03f08=Extra Cut Length : longueur supplémentaire à l'endroit où le début d'un chemin fermé rencontre sa fin. Utilisé uniquement avec Extra Cut activé.\n\nUnités : unités de l'objet (mm ou pouces). Pas de profondeur ou de nombre de passes.
# GeometryCncToolPanel.java
ui.5c2dedd18ed9=Le chemin préserve les chemins. In/Out appliquer la moitié du diamètre vers l’intérieur/l’extérieur ; Custom utilise une distance signée. Individuel par outil ; ne modifie pas l'original Geometry.\n\nPour les lignes ouvertes, Out crée le contour du tampon ; Il peut éliminer le chemin et est rejeté.\n\nDisponible pour le fraisage sans palpage. Les paramètres actifs ne sont pas supprimés lors du passage à un profil incompatible : revenez au fraisage et effacez-les avant de générer.
# GeometryCncToolPanel.java
ui.3bc49c9baccd=Custom Offset : une valeur positive agrandit le trajet ; une valeur négative le réduit. Disponible avec Tool Offset sur Custom ; zéro nécessite Path.\n\nUnités : unités de l’objet (mm ou in).\n\nAttention : Isolation/NCC/Cutout génèrent déjà des trajets compensés ; utilisez normalement Path pour éviter une double compensation.
# GeometryCncToolPanel.java
ui.5f2152bec38d=Changement d'outil (en fonction du profil)
# GeometryCncToolPanel.java
ui.2bebec796add=Pour un fraisage normal, commandes positives RPM démarrant à la vitesse demandée. Le zéro RPM laisse le démarrage et l'arrêt sous contrôle manuel : il n'envoie aucun démarrage automatique et ne garantit aucun arrêt final. Les changements d'outils activés peuvent arrêter la broche avant la pause.\n\nZéro ne signifie pas éteindre la broche. Vérifiez G-code et la procédure de la machine. Pour le laser/PWM, ce champ représente la puissance et suit les règles du profil sélectionné.
# GeometryCncToolPanel.java
ui.ab6e2746eacf=Milling, profils laser et traceur. Simulez et effectuez un essai à sec avant utilisation.
# GeometryCncToolPanel.java
ui.78d8c77120b9=Hauteur de mise au point / Travel Z
# GeometryCncToolPanel.java
ui.266bd35a9573=Avec le Z_laser et le laser Marlin, chaque groupe peut avoir son propre focus Z. Entre les groupes, la puissance du laser est coupée et XY se déplace au niveau le plus élevé de la tâche ; ce n'est qu'alors que le prochain focus est positionné. Cela ne détecte pas les obstacles ou la hauteur de la pièce.\n\nBasic GRBL_laser ne positionne pas la mise au point : gardez cette valeur égale entre les groupes ou utilisez Z_laser. Sans End Z explicite, la hauteur finale est le dernier groupe avec des chemins.\n\nPour le fraisage, ce champ est Travel Z. Unités de l'objet (mm ou po). Les rapides d'alimentation et les positions finales sont partagés.
