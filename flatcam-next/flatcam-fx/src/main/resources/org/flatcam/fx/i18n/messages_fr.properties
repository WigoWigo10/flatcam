# CncExclusionEditor.java
ui.c5795d9ddd66=Permet les zones interdites aux coupes. Décocher conserve les zones à modifier mais ne les utilise pas dans G-code. Uniquement fraisage sans palpage ; les profils incompatibles rejettent les exclusions actives.\n\nAttention : configurez tous les appareils et inspectez G-code ; les macros, les queues, les têtes d'outils et les limites de la machine ne sont pas modélisés.
# CncExclusionEditor.java
ui.dc49a4c8a767=Stratégie de voyage
# CncExclusionEditor.java
ui.c75681fd3399=Around fait le tour des zones de XY. Over augmente avant d'entrer et diminue après avoir quitté la région étendue par rayon et marge. Lorsque les zones se chevauchent, il utilise le Over Z le plus élevé requis pour ce segment. Both rejette les coupes à l'intérieur de la zone.\n\nFX ajoute un rayon d'outil et une marge de 0,1 mm (ou équivalent en pouces). Les changements d'outils, les retours entre passages et le stationnement sont également contrôlés.
# CncExclusionEditor.java
ui.431de278c0b2=Over Z hauteur
# CncExclusionEditor.java
ui.f47cbba69b65=Hauteur absolue positive en unités d'objet. Ne réduit jamais Travel Z. Les changements de hauteur se produisent en dehors de la zone protégée par l'outil ; entre les zones, le déplacement peut revenir à la hauteur de sécurité.\n\nAvertissement : il faut dégager les pinces avec la tolérance sans dépasser la course de la machine. Vérifiez également la queue et la tête d'outil : elles ne sont pas simulées.
