ui.2962b8cb0b69=Sélectionnez une ligne pour mettre en surbrillance la zone restante sur le tracé. Le résidu d'un outil est sa cible moins sa propre coupe ; le résidu cumulé utilise tous les outils jusqu'à cette ligne. L'ISO peut contribuer à une couverture cumulée sans objectif de compensation individuel.
