ui.89cfed77b61f=. Orange indique la surface nominale restante et non une simulation de pièce. Après, cet outil inclut les outils précédents ; Cet outil compare uniquement avec sa cible CAM (avec Rest, cette cible peut déjà être un résidu). Les outils ISO n’ont pas de cible de compensation individuelle. Ne valide pas Z, les pinces, le matériel, les exclusions ou la machine.
