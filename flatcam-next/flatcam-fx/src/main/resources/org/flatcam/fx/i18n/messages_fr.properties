ui.19da5e1e3c26=. Les résultats inférieurs à cette limite constituent des violations ; l'absence de violations ne certifie pas la fabrication.
# ToolDefaultsDescriptions.java
ui.bf0c2c37e061=Profondeur maximale ajoutée par passage en tant que valeur positive. Utilisé uniquement avec Multi-Depth activé. Pas de profondeur de coupe finale.
# ToolDefaultsDescriptions.java
ui.f6bb6c9b346b=Divise la profondeur totale en passes jusqu'à atteindre Cut Z. Configurez également la profondeur par passe ; le mode de rétraction dépend de l'opération CNC.
# ToolDefaultsDescriptions.java
ui.b8b816e3fdad=RPM ou puissance selon profil. Zero ne commande pas la rotation pour les profils le permettant ; les séquences de changement d'outil peuvent arrêter la broche avant la pause. Les profils de sondage et autres ont leurs propres exigences.
# ToolDefaultsDescriptions.java
ui.8fdaa06153d7=Attendez après le démarrage de la broche en quelques secondes lorsque Dwell est activé. Zéro signifie pas d’attente ; pas un pourcentage.
# ToolDefaultsDescriptions.java
ui.7c2322bb5cc0=Flux rapide explicite uniquement pour les profils qui l’utilisent. Zero utilise une avance automatique de profil (normalement 1500 mm/min, Roland 900 mm/min), convertie en unités correspondantes. Les limites GRBL G0 sont définies par le contrôleur.
# ToolDefaultsDescriptions.java
ui.c4302f8429b2=Hauteur finale de perçage après arrêt de la broche. Avec End XY, conserve au moins le Travel Z du dernier outil lors du déplacement latéral et n'atteint que End Z à destination, avec ou sans exclusions. Attention : vérifiez le dégagement et la destination Travel Z avant de choisir une hauteur finale basse.
# ToolDefaultsDescriptions.java
ui.6f92ed8ee28f=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.
# ToolDefaultsDescriptions.java
ui.1da32985addd=Hauteur de changement/retour utilisée par le panneau de sondage Mach3. N'active pas le sondage lui-même. Lors de la génération, vérifiez les paramètres de séquence et les confirmations requises.
# ToolDefaultsDescriptions.java
ui.5996c8f45ada=Largeur extérieure du cadre du film négatif. Ne change pas la source Geometry.
# ToolDefaultsDescriptions.java
ui.20fe3652021d=Ajustement de la largeur du trait du film exporté. Zéro maintient le défaut de l'exportateur ; pas le facteur d'échelle X/Y.
# ToolDefaultsDescriptions.java
ui.19b7c74f74b4=Diamètre du trou central du tampon lorsque la perforation du tampon de film positif est activée. Ne crée pas Excellon.
# ToolDefaultsDescriptions.java
ui.4a831ece73d0=Facteur d’échelle du film sur l’axe indiqué. 1 préserve la taille ; ne transforme pas l'objet du projet.
