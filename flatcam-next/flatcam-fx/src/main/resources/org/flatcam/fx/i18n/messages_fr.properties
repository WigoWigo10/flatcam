ui.2280a8fd5af3=Proportion de la taille du tampon utilisée pour calculer le diamètre du trou, en pourcentage. S'applique uniquement à la méthode proportionnelle ; pas une distance.
# ToolDefaultsDescriptions.java
ui.c9fbb66f8e04=Largeur de cuivre à retenir autour du trou pour la forme de tampon indiquée. Utilisé uniquement par la méthode de l'anneau annulaire ; pas le diamètre du trou.
# ToolDefaultsDescriptions.java
ui.8913ed51ad27=Nombre de décimales pour comparer/regrouper les distances de cuivre dans Optimal. Ne définit pas les décimales G-code et n'améliore pas la précision physique de la machine.
