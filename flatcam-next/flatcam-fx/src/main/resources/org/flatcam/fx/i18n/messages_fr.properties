# CncPreflight.java, MachiningZInput.java, ToolDefaults.java
machining.z.help=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.
# CncPreflight.java
machining.z.roland.preview=Roland RML-1 ne stocke pas le mode Machiniste. Lorsqu'il est rouvert ou modifié, son aperçu traite Z=0 comme la surface et peut mal classer les mouvements en utilisant une autre origine Z. Les coordonnées exportées sont conservées.
# ToolDefaultsDescriptions.java
machining.z.preference.scope=. Persisté lorsque les valeurs par défaut sont enregistrées. S'applique sur la prochaine génération, incluant les panneaux ouverts ; ne réécrit pas les objets existants ou CNC Jobs.\u0020
