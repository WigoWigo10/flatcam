# PanelTooltips.java
ui.669b706abacc=Dessinez une région de tracé pour ouvrir un pont manuel à l'endroit où elle croise le chemin de coupe.\n\nAttention : tout espace manuel remplace le motif automatique ; la largeur dépend de la région dessinée. Clear les espaces manuels restaurent le modèle automatique.
