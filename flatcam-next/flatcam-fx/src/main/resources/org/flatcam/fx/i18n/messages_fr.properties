ui.95bd9c5e9b98=La rétraction conserve la direction et revient au départ au-dessus de la pièce. L'alternance continue inverse le chemin entre les passes, y compris les LineStrings fermés. La même direction répète en continu les contours fermés sans les soulever, comme les anneaux Python ; rejette les chemins ouverts.\n\nAttention : modifications alternées Climb/Conventional et n'accepte pas la direction Conserver. Les modes continus Both rejettent Extra Cut/sondage et utilisent la profondeur finale uniquement pour les points isolés. Valider l'enlèvement de matière, d'outil et de copeaux.
