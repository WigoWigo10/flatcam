ui.5f841073c4f0=Sélectionne initialement un film négatif : cadre rempli avec des zones d'objet découpées. N'inverse pas le projet Gerber.
# ToolDefaultsDescriptions.java
ui.05bb3de5bf3c=Superficie minimale de la région pour recevoir du cuivre auxiliaire. Unités : unités d'objet carré (mm² ou in²) ; pas une distance, et le sélecteur d'unité de longueur ne convertit pas cette valeur.
# ToolDefaultsDescriptions.java
ui.f3bf2ad83ec3=Diamètre/taille de la marque d’alignement en cuivre. L'ouverture du masque correspondante utilise deux fois cette taille.
