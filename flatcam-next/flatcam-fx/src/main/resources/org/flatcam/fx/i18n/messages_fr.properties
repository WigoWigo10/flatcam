ui.5d82bb7fdc0d=Vitesse de coupe X-Y. Les avances plongeantes et rapides peuvent avoir des réglages distincts.
# PanelTooltips.java
ui.4a1f713ddacb=Vitesse Spindle en RPM. Zero ne commande pas la rotation avec les profils qui le permettent ; une séquence de changement d'outil peut toujours émettre M5 pour s'arrêter avant de faire une pause. Le sondage Mach3 nécessite une rotation positive.
# PanelTooltips.java
ui.203a95b2695c=Valeur entière S/PWM utilisée par le profil sélectionné ; pas nécessairement RPM. La plage autorisée dépend du postprocesseur.
