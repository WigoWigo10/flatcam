# CutoutToolPanel.java
ui.e1f7a2333650=Largeur du matériau à conserver, en unités d'objet. Le segment de parcours d'outil supprimé inclut également le diamètre de l'outil. Zéro désactive les espaces automatiques dans FX.\n\nThin utilise exactement les segments supprimés pour ses Geometry distincts ; pour une découpe rectangulaire, M-Bites utilise la même position avec une ligne décalée par le rayon de perçage. Vérifiez la largeur, la profondeur et les trous dans l'aperçu.
