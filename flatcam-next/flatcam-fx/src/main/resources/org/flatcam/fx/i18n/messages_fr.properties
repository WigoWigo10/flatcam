ui.b9de2c3acb5e=Affiche le contour extérieur compensé et une zone carrée au niveau du curseur. Cliquez sur le contour pour ouvrir un pont ; continuez à cliquer pour en ajouter d'autres. La zone appliquée correspond à l'aperçu, avec une longueur de côté égale à la largeur du pont plus le diamètre de l'outil. Sur les diagonales ou les coins, la largeur résultante peut varier. Grid Snap est respecté.\n\nUn clic droit ou Esc termine et conserve les espaces confirmés. Générer s'applique au projet. Les espaces manuels remplacent le modèle automatique. Générez avec le même type de plan. La modification du diamètre, de la marge, de la largeur, de la forme convexe ou du simple/panneau efface les espaces du curseur. L'aperçu montre la découpe extérieure ; inspectez les trous Thin et M-Bites après la génération.
