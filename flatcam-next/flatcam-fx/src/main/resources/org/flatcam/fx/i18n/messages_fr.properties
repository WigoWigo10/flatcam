ui.d22fd9511bb4=Non = ordre du tableau.\nForward = diamètre du plus petit au plus grand.\nReverse = du plus grand au plus petit.\n\nRest Machining utilise l'ordre du plus grand au plus petit.
# PanelTooltips.java
