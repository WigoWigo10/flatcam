# CutoutToolPanel.java
ui.cdb654060a78=Traite la source comme une seule carte, combinant ses parties pour calculer le contour.\n\nLimitation : les découpes internes sur plusieurs cartes nécessitent un panneau. Préférez le contour Geometry pour représenter le bord réel.
