# EditableToolDiameterColumn.java
tool.diameter.edit.help=Double-cliquez sur le diamètre ou appuyez sur F2/Enter pour le modifier.\nEnter confirme ; Esc annule. Tab confirme et édite le coupeur suivant ; Shift+Tab va au précédent. À chaque extrémité, Tab quitte le tableau.\n\nÀ l'intérieur de la cellule, Delete supprime le texte ; en dehors de l'édition, il supprime les lignes sélectionnées lorsqu'elles sont prises en charge par le tableau.\nAccepte un point décimal ou une virgule dans les unités de l'objet. Préserve les paramètres de fonctionnement et l'entrée de la base de données d'outils.\nGenerate valide également les modifications non confirmées.
# EditableToolDiameterColumn.java
tool.diameter.invalid=Outil %d : saisir un diamètre numérique fini supérieur à zéro. Corrigez la modification ou appuyez sur Esc pour l'annuler. Cliquez avec le bouton droit sur le tableau pour corriger ou supprimer le brouillon invalide ; la sélection des couteaux est préservée.
# EditableToolDiameterColumn.java
tool.diameter.duplicate=Outil %d : ce diamètre existe déjà dans le tableau. Saisissez une valeur différente ou appuyez sur Esc pour annuler la modification. Cliquez avec le bouton droit sur le tableau pour corriger ou supprimer le brouillon invalide ; la sélection des couteaux est préservée.
