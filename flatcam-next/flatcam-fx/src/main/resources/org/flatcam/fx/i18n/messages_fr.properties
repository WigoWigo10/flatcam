# ToolsDatabaseDescriptions.java
ui.2c29980b6896=Limite inférieure absolue de la plage de diamètres acceptée lors de la recherche de forets. Ce n’est pas une tolérance ±. Exemple : Min = 0,78 et Max = 0,82 accepte les forets dans cette plage. Une correspondance exacte du diamètre est prioritaire.
# ToolsDatabaseDescriptions.java
ui.f83d09957f60=Limite supérieure de la plage de diamètres acceptée lors de la recherche de forets ; doit être supérieur ou égal à Min. La plage n'est utilisée que lorsque Max > Min ; les résultats ambigus sont rejetés.
# ToolsDatabaseDescriptions.java
ui.3e44b0e6143e=Définit l'opération : Général, Milling, Drilling, Isolation, Paint, NCC ou Cutout. Le général participe à toutes les recherches intégrées ; les options incompatibles sont rejetées. La sélection détermine également quelles sections sont affichées.
# ToolsDatabaseDescriptions.java
ui.5a2216e5f95d=Forme de l'outil :\nC1 à C4 = fraise circulaire avec 1 à 4 cannelures.\nB = pointe sphérique.\nV = pointe en V.\n\nLorsque V est sélectionné, V-Dia, V-Angle et Cut Z déterminent le diamètre effectif.
# ToolsDatabaseDescriptions.java
ui.9c4a7913fa01=V diamètre de la pointe de l'outil, non négatif. Disponible pour Shape V ; utilisé pour calculer le diamètre de coupe.
# ToolsDatabaseDescriptions.java
ui.ce4c5153c754=Angle complet inclus de la pointe de l'outil V, en degrés, entre 0 et 180 (exclusif). Utilisé pour calculer le diamètre à la profondeur Cut Z.
# ToolsDatabaseDescriptions.java
ui.41ab10f67dd9=Classification d'usinage : Iso = isolement ; Rugueux = ébauche ; Terminer = finition. Décrit l'outil ; n'ajuste pas automatiquement la vitesse.
# ToolsDatabaseDescriptions.java
ui.aacaddc8971f=Position du chemin : Chemin = aucune compensation ; In/Out = intérieur/extérieur de la moitié du diamètre ; Personnalisé = utilise l'intégration Custom Offset.\n\nFX : transféré vers Milling/Geometry CNC. Cutout compense déjà ses chemins et ne réapplique pas ce décalage.
# ToolsDatabaseDescriptions.java
ui.f75bc6543a18=Custom Offset : expansion positive ; le négatif contracte le chemin. Appliqué uniquement avec Tool Offset Custom ; zéro nécessite un chemin dans FX CNC.\n\nIntégration FX : transféré vers Milling/Geometry CNC, pas vers Cutout.\n\nAttention : Isolation/NCC génère déjà des trajectoires de centre d'outil ; conservez normalement Path pour éviter une compensation en double.
# ToolsDatabaseDescriptions.java
ui.5ea9e2fac451=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.\n\nLa base de données Tools conserve le signe saisi en tant que brouillon. La politique sélectionnée s'applique à la génération. La profondeur de l'outil en V est calculée à partir de la pointe, de l'angle et de la largeur de coupe.
# ToolsDatabaseDescriptions.java
ui.4df34f0ac8aa=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.\n\n**Effectif Cut Z = Cut Z − Offset Z.** Positif Offset Z fore plus profondément ; le négatif le rend moins profond. Le tableau conserve la valeur de tirage saisie ; la politique s’applique à la génération.
# ToolsDatabaseDescriptions.java
ui.1dcd647d56b9=Divise la coupe en passes limitées en profondeur jusqu'à ce que Cut Z soit atteint. Active Depth / Pass ; le perçage se rétracte entre les passes.
# ToolsDatabaseDescriptions.java
ui.456a8ebadd8c=Profondeur maximale ajoutée par passage, en tant que valeur positive. Activé uniquement lorsque Multi-Depth est coché.
# ToolsDatabaseDescriptions.java
ui.f91d4c8f5ad8=**Travel Z :** coordonnée utilisée lors du déplacement entre des coupes ou des trous. Standard convertit les valeurs négatives en valeurs positives avec un avis et rejette zéro. Le machiniste préserve le signe et le zéro. La base de données conserve la valeur d'ébauche jusqu'à la génération.\n\nChoisissez la coordonnée en tenant compte de l'origine Z, du matériau et du serrage.
# ToolsDatabaseDescriptions.java
ui.cc211002f83a=Avance dans le plan X-Y pendant que l'outil coupe. Saisissez une valeur positive en unités de travail par minute (mm/min ou po/min).
# ToolsDatabaseDescriptions.java
ui.c5ecfce43470=Taux de plongée Z pendant la coupe ou le perçage. Saisissez une valeur positive en unités de travail par minute (mm/min ou po/min).
# ToolsDatabaseDescriptions.java
ui.5ac9157749c6=Vitesse de déplacement rapide, en mm/min ou in/min selon les unités de travail. Son utilisation dépend du postprocesseur ; certains profils d'imprimante utilisent des vitesses d'alimentation explicites pour des déplacements rapides.
# ToolsDatabaseDescriptions.java
ui.780bbcbf8bf0=Vitesse Spindle en RPM. Zero omet la commande de vitesse dans les profils qui le permettent ; la séquence de changement d'outil peut toujours émettre M5 pour s'arrêter avant de faire une pause. Les profils tels que Mach3 avec sondage nécessitent un RPM positif lors de la génération.
# ToolsDatabaseDescriptions.java
ui.51c14e84cf54=Permet une pause après le démarrage de la broche pour laisser le moteur atteindre la vitesse spécifiée. Active le champ Heure Dwell.
# ToolsDatabaseDescriptions.java
ui.a469ddecc553=Durée de pause après le démarrage de la broche, en secondes. Disponible lorsque Dwell est coché ; doit être non négatif.
# ToolsDatabaseDescriptions.java
ui.a55f6af44e1e=Ajoute un segment de coupe où le début et la fin d'un chemin fermé se rencontrent pour aider à compléter l'isolation. Active Extra Cut Length.
# ToolsDatabaseDescriptions.java
ui.d317fdcd23ad=Longueur du segment supplémentaire à la fermeture du chemin. Disponible uniquement lorsque Extra Cut est coché.
# ToolsDatabaseDescriptions.java
ui.e55b167f74ed=**Compensation de pointe de foret :** effective Cut Z = Cut Z − Offset Z. Le décalage positif perce plus profondément ; le négatif le rend moins profond. Standard nécessite le résultat inférieur à Z0. Machinist permet une cible positive ou nulle. Vérifiez la cible effective dans le résumé.
# ToolsDatabaseDescriptions.java
ui.54e4cfa8263b=Traite les emplacements de l'outil comme une séquence de trous. Active Overlap et Last Drill pour configurer cette séquence.
# ToolsDatabaseDescriptions.java
ui.0fa4dc89274a=Chevauchement entre des trous consécutifs lors du perçage de fentes, en pourcentage du diamètre du foret. Activé uniquement avec Drill Slots ; plus de chevauchement crée plus de trous.
# ToolsDatabaseDescriptions.java
ui.47cd96e13b62=Ajoute un trou à l'extrémité de la fente lorsque la séquence régulière ne couvre pas toute la longueur. Activé uniquement avec Drill Slots.
# ToolsDatabaseDescriptions.java
ui.a97ad6ed9408=Nombre entier de passages d'isolation autour du cuivre. Plus de passes augmentent la largeur isolée ainsi que le diamètre et le chevauchement.
# ToolsDatabaseDescriptions.java
ui.e683b36ba450=Chevauchement entre les passes d'isolation, en pourcentage de la largeur de l'outil. Doit être compris entre 0 et moins de 100 %.
# ToolsDatabaseDescriptions.java
ui.98144a76b336=Sélectionne la direction de fraisage : Climb ou Conventional. Tenez compte des caractéristiques mécaniques de la machine lors de la configuration du travail.
# ToolsDatabaseDescriptions.java
ui.61ef052ba553=Génère un chemin suivant le centre des pistes Gerber au lieu d'isoler leurs bords. Ce mode coupe le long de la piste.
# ToolsDatabaseDescriptions.java
ui.c6f69ce7028f=Région à isoler : Both = bords extérieurs et intérieurs ; Extérieur = extérieur uniquement ; Intérieur = uniquement les contours des ouvertures internes du polygone.
# ToolsDatabaseDescriptions.java
ui.2f6693817b9b=Chevauchement entre les trajectoires, en pourcentage de la largeur de l'outil (0 à moins de 100 %). Des valeurs plus élevées créent plus de chemins et peuvent augmenter le temps de calcul et d'usinage.
# ToolsDatabaseDescriptions.java
ui.5ad3e4c20743=Marge individuelle de Paint : une valeur positive réduit la surface à remplir ; zéro utilise la surface d’origine ; une valeur négative l’agrandit.\n\nAttention : une marge négative peut déplacer les trajets hors du polygone d’origine. Vérifiez la Geometry générée avant l’usinage.
# ToolsDatabaseDescriptions.java
ui.1e3c0b1a3d6b=Méthode de remplissage :\nStandard = étapes vers l'intérieur.\nSeed = expansion à partir d'une graine.\nLines = lignes parallèles.\nCombo = essaie une alternative méthodes.\n\nLaser_lines est désactivé dans cette base de données, comme dans Python.
# ToolsDatabaseDescriptions.java
ui.a249bfed7735=Connecte les segments résultants pour réduire les soulèvements d’outils. Les connexions doivent rester dans la zone d'usinage autorisée.
# ToolsDatabaseDescriptions.java
ui.cbc8c3307206=Ajoute un chemin autour du périmètre du polygone pour terminer les bords.
# ToolsDatabaseDescriptions.java
ui.5ab0ef4a4657=Clear supprime le cuivre libre. Isolation crée des passes d'isolement avant l'effacement ; Les outils V sont traités comme Isolation par l'adaptateur FX NCC.
# ToolsDatabaseDescriptions.java
ui.d37eabcd9bfb=Marge autour du cadre de délimitation utilisée pour limiter la compensation du cuivre. Il s’agit d’un paramètre différent du décalage de piste.
# ToolsDatabaseDescriptions.java
ui.d09474e58c9a=Méthode de nettoyage :\nStandard = marches vers l'intérieur.\nSeed = expansion à partir d'une graine.\nLines = lignes parallèles.\nCombo = essaie des alternatives pour couvrir la zone.
# ToolsDatabaseDescriptions.java
ui.5325f315fe81=Permet le dégagement des pistes et des plots lors du nettoyage du cuivre. Active la valeur de décalage, qui définit cette distance.
# ToolsDatabaseDescriptions.java
ui.4707e070d1b3=Dégagement des régions de cuivre pendant le nettoyage. Uniquement appliqué lorsque Offset est coché.
# ToolsDatabaseDescriptions.java
ui.6f87fa37b6d6=Marge par rapport à la limite du carte. Une valeur positive éloigne le contour de découpe du bord d'origine.
# ToolsDatabaseDescriptions.java
ui.0e76d814e99b=Largeur des languettes qui maintiennent la carte au matériau lors de la découpe. Sélectionnez le type d'onglet dans Type d'espace.
# ToolsDatabaseDescriptions.java
ui.fecbff00731c=Tab distribution :\nAucun = aucun onglet.\nLR = gauche/droite.\nTB = haut/bas.\n4 = un par côté.\n2LR et 2 To = deux de chaque côté indiqué.\n8 = deux par côté.
# ToolsDatabaseDescriptions.java
ui.156747d498e6=Crée un contour convexe entourant toute la carte sans suivre ses caractéristiques concaves. Dans Python, cette option est destinée aux objets Gerber.
# ToolsDatabaseDescriptions.java
ui.b6e79f64013d=Type Tab : Bridge = espace dans la coupe ; Thin = languette partiellement fraisée pour réduire son épaisseur ; M-Bites = languette perforée pour une séparation plus facile.
# ToolsDatabaseDescriptions.java
ui.60649971e444=**Thin Profondeur :** une coordonnée Z moins profonde (plus haute) que Cut Z. Exemple Standard : coupez −1,7 et tabulation −0,5. Machinist accepte également Z positif ou zéro ; Thin La profondeur doit rester supérieure à Cut Z. Utilisé uniquement avec le type d'espace Thin.\n\nFX transfère cette coordonnée vers un onglet séparé Geometry ; générer son CNC Job séparément. La coupe principale retient Cut Z.\n\nLes languettes doivent retenir suffisamment de matériau pour maintenir la carte.
# ToolsDatabaseDescriptions.java
ui.f6561f253beb=Diamètre des trous perforant les languettes Mouse Bites. Activé uniquement avec le type d'espace M-Bites.
# ToolsDatabaseDescriptions.java
ui.d383d48d875a=Espace entre les bords des trous Mouse Bites. Dans Python, le pas de centre à centre correspond au diamètre plus cette valeur. Activé uniquement avec le type d'espace M-Bites.
