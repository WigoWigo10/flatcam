# GCodeEditorController.java, MainWindow.java
gcode.save.help=**Enregistrer — Ctrl+S**\n\nÉcrit le texte de l'éditeur dans le fichier original indiqué ci-dessus. Sans fichier associé, demande une destination et l'utilise pour les sauvegardes ultérieures.\n\nLe programme est révisé avant l'écriture. Pour mettre également à jour l'objet du projet et l'aperçu, utilisez Appliquer à CNC Job.
# GCodeEditorController.java, MainWindow.java
gcode.saveAs.help=**Enregistrer sous — Ctrl+Shift+S**\n\nChoisit une autre destination et rédige une copie du texte. Conserve le fichier original et son association avec Save.\n\nL'enregistrement d'une copie n'applique pas le brouillon au CNC Job en mémoire.
# GCodeEditorController.java, MainWindow.java
gcode.save.review=Enregistrer écrit le texte de l'éditeur dans le fichier de destination. Il n’applique pas le brouillon au CNC Job en mémoire ; utilisez Appliquer à CNC Job pour mettre à jour l'objet et l'aperçu.
# GCodeEditorController.java, MainWindow.java
gcode.saveAs.review=Enregistrer sous écrit une copie. Il n’applique pas le brouillon au CNC Job en mémoire et ne modifie pas le fichier d’origine associé à l’éditeur.
# GCodeEditorController.java, MainWindow.java
gcode.saveAs.sameFile=Pour enregistrer une copie, choisissez un fichier différent de l'original. Utilisez Enregistrer pour mettre à jour l'original.
# GCodeEditorController.java
gcode.cancel.help=**Annuler la modification**\n\nFerme l'éditeur et ignore le brouillon non encore appliqué à la mémoire CNC Job.\n\n**N'annule pas les fichiers déjà écrits** avec Enregistrer ou Enregistrer sous. Pour modifier un fichier enregistré, modifiez-le à nouveau et enregistrez la correction.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.help=**Modifier le diamètre des trous**\n\nDouble-cliquez ou appuyez sur F2 ou Enter dans la colonne Diamètre. Saisissez une valeur positive avec un point ou une virgule décimale ; Enter confirme et Esc annule. Tab parcourt les outils.\n\nLa modification concerne tous les trous et rainures de cet ID, sans déplacer leurs centres ni fusionner les outils de même diamètre. Le tracé est reconstruit en arrière-plan. Les lignes de totaux ne sont pas modifiables.\n\nLorsque le tableau a le focus, Ctrl+Z/Ctrl+Y annulent/rétablissent. Enregistrez le projet ou exportez Excellon pour conserver la modification ; le fichier source et les CNC Jobs existants ne sont pas réécrits automatiquement.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.history.help=Annule ou rétablit les modifications confirmées du diamètre de cet objet au cours de la session. Ne modifie pas la position des trous. Dans un champ de texte, Ctrl+Z annule toujours uniquement le texte. Une autre modification ou transformation d'objet invalide cet historique.
