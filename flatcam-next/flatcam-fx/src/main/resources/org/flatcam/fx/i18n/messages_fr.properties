preferences.numbers.units.help=Unité de départ pour un projet vide et de nouveaux objets.\n\nRéférence : les fichiers et projets ouverts conservent leurs propres unités. Ce choix ne convertit pas les objets existants et prend effet à la prochaine ouverture de l'application.
