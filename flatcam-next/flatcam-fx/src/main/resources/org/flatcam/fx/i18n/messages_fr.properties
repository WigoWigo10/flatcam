# PanelTooltips.java
ui.d3ca7681ff0d=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.
# PanelTooltips.java
ui.7f1ec33d4658=Z négatif pour le pont Geometry, moins profond que Cut Z. Exemple : découpe -1,7 et Thin Profondeur -0,5. S'applique uniquement à Thin ; générer les deux CNC Jobs séparément.
