# PanelTooltips.java
ui.436bc30a4940=Sélectionnez les formes, les ouvertures ou les outils à modifier. Les sélections de dessins et de tableaux sont synchronisées.\n\nRaccourcis : Ctrl+click bascule les éléments ; Shift+click sélectionne une plage.\n\nLes modifications de l'éditeur restent dans un brouillon jusqu'à ce qu'elles soient appliquées à l'objet.
# PanelTooltips.java
ui.ad2d9c120fc7=Outils pour cette opération. Sélectionnez une ligne pour examiner les paramètres ; certaines opérations utilisent uniquement les lignes sélectionnées.\n\nDiamètre : largeur de l'outil en unités d'objet.\nTT : C1–C4 (couteau plat), profil B (nez sphérique) ou V (pointe en V), lorsque disponible.\n\nRaccourcis : Ctrl+click bascule les éléments ; Shift+click sélectionne une plage.
# PanelTooltips.java
ui.17ff5079da43=Ouvertures Gerber : le code identifie le code D ; Le type est la forme ; Taille / Dim sont des dimensions ; M met en évidence l'ouverture sur le tracé.\n\nUnités : Gerber unités (mm ou pouces).
# PanelTooltips.java
ui.389187de5ff7=Outils Excellon et leurs diamètres, nombre de trous et fentes. Le tracé contrôle uniquement l'affichage.\n\nUnités : Excellon unités (mm ou pouces).
# PanelTooltips.java
