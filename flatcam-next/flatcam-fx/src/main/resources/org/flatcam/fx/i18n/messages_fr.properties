# CutoutToolPanel.java
ui.804cc12e4532=Calcule une découpe pour chaque pièce source distincte, telle que les cartes d'un panneau, avec ses propres ponts.\n\nAttention : les îlots de cuivre ne représentent pas nécessairement des cartes distinctes ; vérifiez le contour choisi Geometry.
# CutoutToolPanel.java
ui.615fb942b47a=Utilisez la zone de la carte Geometry créée à partir de Edge_Cuts, pas de cuivre : tous les anneaux internes de la source seront usinés. Pour plusieurs cartes, sélectionnez Panneau.\n\nDisponible uniquement avec forme libre, sans forme convexe et avec une marge non négative. Le rayon et la marge de l'outil compensent le chemin dans chaque ouverture. La génération est rejetée si une ouverture disparaît ou se divise.\n\nLes découpes internes sont fermées, sans ponts, Thin ou M-Bites, même avec des espaces manuels. Il ne s'agit pas d'une ébauche de poche : examinez les coins, les fixations et les pièces détachées avant de générer CNC.
# CutoutToolPanel.java
ui.b3b282224871=**Mode Standard :** un Cut Z positif est converti en Z négatif avec un avis ; un Travel Z négatif est converti en positif. Zéro est refusé.\n\n**Machinist :** conserve les valeurs positives, négatives et nulles. Activez-le dans Préférences > CNC Job > CNC Job (général) ; il s’applique à la prochaine génération, y compris aux panneaux ouverts. Vérifiez Cut Z effectif et Offset Z dans le récapitulatif.\n\nLe signe est relatif à l’origine Z de la machine. Les paramètres des passes et les limites propres au préprocesseur restent vérifiés.
# CutoutToolPanel.java
ui.42adc98e530c=**Thin Profondeur :** coordonnée Z du pont, au-dessus du Cut Z complet. Exemple de mode Standard : découpe −1,7 et ponts −0,5. Machinist accepte également Z positif ou zéro, en conservant Thin Profondeur > Cut Z.\n\nUtilisé uniquement pour Thin. Cette valeur va dans un pont séparé Geometry ; la découpe principale conserve Cut Z. Générez les deux CNC Jobs séparément.\n\nUnités : unités de l'objet (mm ou in).
