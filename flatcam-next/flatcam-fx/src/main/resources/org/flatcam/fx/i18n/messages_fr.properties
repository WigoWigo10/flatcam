# GeometryEditorDescriptions.java
ui.8e2720da0aa5=Ouvre le brouillon des transformations. La rotation, l'échelle X/Y, les miroirs et l'inclinaison utilisent le pivot choisi et un aperçu avant confirmation. Le décalage X/Y ajoute des coordonnées en unités d'objet indépendamment du pivot.\n\n
# GeometryEditorDescriptions.java
ui.05c2909c2313=Rotation avec aperçu
# GeometryEditorDescriptions.java
ui.8a897f7430ef=Sélectionnez des formes, choisissez un pivot et entrez un angle ou utilisez Rotation en faisant glisser. En faisant glisser, la boîte suit l'angle ; release calcule l'aperçu exact, qui nécessite encore une confirmation. Le positif tourne dans le sens des aiguilles d'une montre, comme dans le panneau Python ; Le négatif tourne dans le sens antihoraire. L'origine, le centre/coins de sélection et le point X/Y sont disponibles. La sélection d'un pivot de tracé respecte Snap.\n\nLa transformation Aperçu calcule le nouveau contour sans modifier le brouillon. Confirmez avec le bouton ou un clic de tracé ; Esc/clic droit sur les rejets. La modification des paramètres ou de la sélection invalide l'aperçu. Pendant le calcul, Esc ignore le résultat en attente et Annuler dans la barre d'état interrompt le travail lorsque cela est possible.\n\nPréserve les identifiants, les outils et la sélection. Ctrl+Z annule toute la rotation ; Ctrl+Y est refait. Enregistrer et quitter applique le brouillon à l'objet. L'échelle, les miroirs et l'inclinaison utilisent également le pivot choisi et le même flux de travail de prévisualisation/confirmation/annulation.
# GeometryEditorDescriptions.java
ui.252d17529360=Arc en trois clics
# GeometryEditorDescriptions.java
ui.f10a004bde0c=C12 : centre, direction de début et de fin ; le rayon vient du début. 12C : référence de début, de fin et de centre ; le centre se trouve sur la médiatrice perpendiculaire en utilisant la distance de la référence au milieu de la corde, comme dans Python. 132 : début, fin et un point sur l'arc ; la direction est automatique.\n\nM change de mode et efface les points précédents ; D bascule dans le sens horaire/antihoraire dans les modes centraux. J ouvre les coordonnées absolues/relatives avec la même référence mémorisée par le saut général : le curseur de position met uniquement à jour l'aperçu ; L'ajout de points utilise X/Y exact sans Snap. Backspace supprime le dernier point. Le troisième point valable se termine ; Esc/clic droit annule sans insérer. L'accrochage s'applique aux clics de souris.\n\nL'aperçu montre l'arc et une croix en son centre. La résolution est configurable dans Arcs et courbes : 4 à 4 096 segments par cercle, 64 par défaut. L'enregistrement de la résolution par défaut s'applique aux nouveaux éditeurs sans modifier les formes existantes. Climb Milling Le type inverse les sommets finaux comme dans Python. Ctrl+Z annule tout l'arc ; Ctrl+Y est refait.
# GeometryEditorDescriptions.java
ui.146acb3956fe=Ajoute des chemins de remplissage aux zones sélectionnées sans supprimer les contours d'origine. Accepte les polygones et les anneaux fermés simples ; rejette les lignes ouvertes.\n\nCalculer l'aperçu en arrière-plan et confirmer avec un clic de tracé ou Confirmer Paint ; Esc annule. Ctrl+Z annule tout le remplissage. Le diamètre doit correspondre à l'outil associé ; sans association, vérifiez-le lors de la génération de CNC.
# GeometryEditorDescriptions.java
ui.b544cf9a2975=Convertit le texte en polygones modifiables, en préservant les trous des lettres. Choisissez la police, la taille et le style dans le panneau.\n\nGénérer et positionner affiche un aperçu : cliquez sur le tracé à insérer à la ligne de base de la première ligne ; Esc/clic droit annule. Ctrl+Z annule toute l'insertion. Le résultat utilise l'outil de nouvelle forme choisi.
# GeometryEditorDescriptions.java
ui.dacea0b19fcf=Sélectionnez une ou plusieurs formes comme pochoir ; cliquez une fois pour l'origine, puis les destinations pour effacer ces régions. Le pochoir et l'origine sont conservés entre les opérations ; l'aperçu montre la zone suivante.\n\nAvertissement : les anneaux fermés et les extérieurs des polygones deviennent des zones remplies, y compris leurs trous. La découpe affecte tous les outils et le pochoir d'origine s'il se trouve à l'intérieur de la région effacée. Le pochoir de la gomme conserve sa forme initiale même si sa source est effacée.\n\nEsc/clic droit ou clic à nouveau sur la gomme termine, en conservant les opérations confirmées. Pendant le calcul, Esc ignore le résultat en attente ; Annuler dans la barre d'état interrompt le travail lorsque cela est possible. Ctrl+Z annule une opération ; Ctrl+Y est refait, en gardant la gomme active. Le changement d'outil ou de sélection termine le geste.
# GeometryEditorDescriptions.java
ui.01674ed7b2fe=Crée de nouvelles zones sans remplacer les formes sélectionnées. Saisissez une distance positive et choisissez un mode.\nFull = bande autour de la ligne ou du polygone extérieur.\nInterior = contracte le polygone.\nExterior = agrandit le polygone.\n\nInterior/Exterior nécessite des polygones ; FX n'accepte pas les distances négatives dans cette commande. Unités de l'objet (mm ou po). Ctrl+Z est annulé.
# GeometryEditorDescriptions.java
ui.411e5fa9926d=La première forme sélectionnée est la cible ; d'autres sont des coupeurs. Une cible polygonale devient son contour avant la découpe.\n\nRemplace uniquement la cible et conserve les couteaux même si la découpe supprime la totalité de la cible. Ctrl+Z est annulé.
# GeometryEditorDescriptions.java
ui.56b56b266b06=Supprime la région couverte par d'autres formes sélectionnées de la première forme sélectionnée. L'ordre de sélection définit la cible.\n\nRemplace les formes sélectionnées par le résultat ; tous doivent appartenir au même outil. Les résultats vides sont rejetés. Pour conserver les couteaux, utilisez Cut Path. Ctrl+Z est annulé.
# GeometryEditorDescriptions.java
ui.9b1a2d946edf=Combine les formes sélectionnées et les remplace par le résultat géométrique. Tous doivent appartenir au même outil. Ne modifie pas le diamètre de coupe. Ctrl+Z est annulé.
# GeometryEditorDescriptions.java, LegacyUiManifest.java
ui.18409a9f56cb=Intersection
# GeometryEditorDescriptions.java
ui.57b36a64d212=Conserve uniquement la région commune à toutes les formes sélectionnées et les remplace par le résultat. Nécessite des formes du même outil ; les résultats vides sont rejetés. Ctrl+Z est annulé.
# GeometryEditorDescriptions.java
ui.d4184c5fcfc8=Remplace les polygones sélectionnés par des segments individuels de contours extérieurs et intérieurs. Chaque segment peut être sélectionné et supprimé. Accepte jusqu'à 10 000 segments et préserve l'association des outils. Ctrl+Z est annulé.
