# PanelTooltips.java
ui.bd769a9b9060=Permet une distance de protection supplémentaire autour des pistes et des pastilles pendant le déblaiement. Active la valeur de décalage.
# PanelTooltips.java
ui.c0dc07fd4dd3=Itself = zone source.\nArea = zone tracée.\nReference = limite fournie par un autre objet.\n\nDéfinit où le nettoyage peut se produire sans changer le cuivre source.
# PanelTooltips.java
ui.be87706fb56a=Clear supprime le cuivre à l'extérieur du circuit.\nIsolation crée des chemins entourant la piste avant de les effacer.\n\nL'opération est configurée par outil.
# PanelTooltips.java
ui.69fd75d1132d=Climb = fraisage en montée.\nConventional = fraisage conventionnel.\n\nPour NCC, ce choix s'applique au fonctionnement Isolation.
# PanelTooltips.java
ui.2860353558e0=Both = bords extérieurs et intérieurs.\nExtérieur = extérieur uniquement.\nIntérieur = bords d'ouverture internes uniquement.
# PanelTooltips.java
ui.1de3b2940ea0=Supprime la zone remplie du Geometry sélectionné des chemins d'isolation. Choisissez Aucun pour omettre un objet d'exception.
# PanelTooltips.java
ui.11cb97544ccc=Suit les centres des pistes au lieu d'isoler les bords ; n'utilise qu'un seul outil.\n\nAttention : ce mode coupe sur la piste.
# PanelTooltips.java
ui.ce5f1f7ee6d6=Dessinez la région où les chemins d'isolement seront supprimés. La zone dessinée est une exception supplémentaire au Geometry choisi.
# PanelTooltips.java
