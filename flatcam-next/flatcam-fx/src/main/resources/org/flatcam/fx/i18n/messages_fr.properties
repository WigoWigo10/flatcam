ui.27ad86d781a0=Format initial utilisé par Exporter, Enregistrer sous et Terminal. Les unités de fichiers sont indépendantes de l'objet ; les coordonnées et les diamètres sont convertis. Les arrondis de précision choisis ont exporté les coordonnées sans changer l'objet. IN utilise les pouces ; MM utilise des millimètres.
