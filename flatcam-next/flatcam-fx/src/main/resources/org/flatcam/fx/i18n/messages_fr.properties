# TclFlatcamCommands.java
ui.09cdace1c4f1=open_project {C:/folder/project.fcnproj}\nAccepte .fcnproj et .FlatPrj. Rejette les modifications non enregistrées : utilisez d'abord save_project, ou open_project {file} -force true pour les supprimer explicitement. Force ne contourne pas les brouillons, la validation, l'annulation ou les modifications pendant le chargement. Utilisez / et des accolades pour les chemins Windows.
# TclFlatcamCommands.java
ui.c48f8b400a29=save_project {C:/folder/project.fcnproj}\nsave_project {C:/folder/project.FlatPrj}\nL'extension requise définit le format ; remplace la destination après la sérialisation. Fermez d’abord les éditeurs. .FlatPrj préserve uniquement les fonctionnalités représentables Python ; conservez également .fcnproj. L'annulation avant la publication préserve la destination ; la compression ne peut pas être interrompue à mi-chemin.
# TclFlatcamCommands.java
ui.e9ca66dec3f9=plot_all ?-plot_status Vrai|Faux ? ?-use_thread True|False?\nAffiche tout par défaut ; Fausses peaux. -use_thread est validé mais FX conserve sa politique de travail. CNC Job sans aperçu compatible est rejeté. N'attend pas chaque image GPU.
# TclFlatcamCommands.java
ui.f7967779f04c=plot_objects {board,holes,route} ?-plot_status True|False?\nListe séparée par des virgules ; les accolades préservent les espaces. Valide chaque nom avant de modifier Plot. CNC Job sans aperçu compatible est rejeté.
# TclFlatcamCommands.java
ui.6f3cc297d5bf=set_active {name}\nAjoute l'objet à la sélection actuelle, comme dans Python ; n'affiche pas les couches cachées et ne vole pas le focus du terminal. Fermez d'abord les éditeurs d'objets.
# TclFlatcamCommands.java
ui.8866a79121c6=offset {name} -x 1.2 -y -0.3\nAccepte également le offset {name} 1.2 -0.3. Axes omis : 0.
# TclFlatcamCommands.java
ui.23128c50315d=scale {name} 2 -origin center\nscale {name} -x 2 -y 1 -origin {(3,4)}\nRéférence : centre (par défaut), origine, min_bounds ou x,y. Axe omis : 1 ; facteur zéro rejeté.
# TclFlatcamCommands.java
ui.ea9ac619f27f=miroir {nom} -axe X -origine 0,0\nmirror {nom} -axe Y -box {référence}\nX reflète Y ; Y reflète X (par défaut). -box utilise le centre de référence et remplace -origin. Sans référence : (0,0).
# TclFlatcamCommands.java
ui.8c3a2a315522=skew {name} -x 10 -y 0\nAngles en degrés entre -90 et 90 ; référence : coin inférieur gauche. Axes omis : 0.
# TclFlatcamCommands.java
ui.a0c28cc72e47=faire pivoter {name} 90 ?-centre d'origine|origine|min_bounds|x,y ? ?-box {référence}?\nFX Extension de terminal : cette caisse Python a une rotation de l'interface utilisateur, pas une commande de rotation Tcl. Degrés positifs = dans le sens des aiguilles d'une montre, comme les Transformations ; négatif = sens inverse des aiguilles d'une montre. La valeur par défaut est le centre de l'objet ; -box remplace -origin. CNC Jobs rejeté.
# TclFlatcamCommands.java
ui.1bb7b5a45dd0=\u0020{output} {geo 1} {geo 2} ...\nCrée Geometry caché sans supprimer les sources ; au moins deux objets Geometry distincts, unités correspondantes et type simple/multi. Maintient les outils séparés et remappe les paramètres ; conflits communs rejetés. Utilisez plot_objects pour afficher.
# TclFlatcamCommands.java
ui.d78b4bd570f6=\u0020{sortie} {trous 1} {trous 2} ...\nCrée Excellon caché, en préservant les sources ; au moins deux Excellons distincts avec des unités correspondantes. Fusionne les diamètres à quatre décimales ; remappe les trous/emplacements/paramètres/sélection. Conflits rejetés.
# TclFlatcamCommands.java
ui.941e51dcc2bb=\u0020{holes} {C:/folder/output.drl}\nExporte les trous/emplacements actuels au format enregistré par Fichier > Exporter > Excellon ; sans paramètres : IN, décimal 2:4, emplacements routés. La conversion/arrondi peut modifier la précision. FX nécessite une destination explicite (facultatif dans Python) ; remplace le fichier existant. Fermer les éditeurs. L'annulation avant la publication préserve la destination ; les préférences restent inchangées.
# TclFlatcamCommands.java
ui.3500496d65d6=\u0020{copper} {C:/folder/output.gbr}\nExporte l'image Gerber actuelle en tant que régions résolues à l'aide du format Fichier > Exporter > Gerber. Sans paramètres : IN, 2:4, L zéros. Ne préserve pas les macros/identités/commandes d'ouverture d'origine. Destination explicite requise ; remplace le fichier existant après validation. Fermer les éditeurs ; les préférences restent inchangées.
# TclFlatcamCommands.java
ui.bfe1ba9687de=export_svg {nom} {C:/folder/output.svg} ?scale_stroke_factor?\nexport_svg {nom} {C:/folder/output.svg} ?-scale_stroke_factor valeur ?\nGerber/Excellon/Geometry et CNC avec aperçu compatible. Facteur positif = demi-largeur de course ; <=0 = automatique (0,02 pour les formes ; diamètre de l'outil ou 0,02 pour CNC). Ne met pas à l'échelle les coordonnées. Unités sources, Y vers le haut, Voyage sous Cut. Destination explicite requise ; remplace le fichier existant après validation. Fermer les éditeurs.
# TclFlatcamCommands.java
ui.59e837ded8f7=drillcncjob {trous} -drillz -1.7 -travelz 2 -feedrate_z 300 ?-drilled_dias 0.8,1.0? ?-diatol PCT? ?-étape dpp ? ?-vitesse de rotation de la broche ? ?-changez d'outil z? ?-changement d'outilxy x,y? ?-startz z? ?-endz z? ?-endxy x,y? ?-dwelltime s? ?-feedrate_rapid f? ?-profil pp? ?-opt_type B|M|T? ?-outname name?\n-drillz (négatif), -travelz et -feedrate_z sont requis dans FX (Python utiliserait les préférences). Outils exécutés en augmentant le diamètre. L'outil change uniquement avec -toolchangez. -pp accepte les noms Python (par exemple GRBL_11) ou les noms FX ; par défaut, FX portable. -opt_type B/M/T utilise l'ordre de proximité FX, pas OR-Tools/TSP. -muted est accepté sans effet.
# TclFlatcamCommands.java
ui.c82380709055=Utilisez soit la position scale_Stroke_factor, soit -scale_Stroke_factor, pas les deux.
