ui.7feedc0c4379=\n\nIntégration FX : transferts Standard, Seed, Lines et Combo ; Le laser Lines n'est toujours pas pris en charge.
# ToolsDatabaseDescriptions.java
ui.f73eec9b0794=\n\nUnités : valeur en unités de travail (mm ou po) ; la base de données ne convertit pas automatiquement les unités.
