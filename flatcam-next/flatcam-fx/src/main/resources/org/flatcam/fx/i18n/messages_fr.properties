table.delete.help=Supprime les lignes sélectionnées de ce tableau. Avec le tableau sélectionné, appuyez sur Delete ou utilisez le menu contextuel.\n\nDans une cellule d'édition ou un champ de saisie, Delete supprime uniquement le texte. Les règles de fonctionnement et la confirmation de la base de données d'outils s'appliquent toujours.
