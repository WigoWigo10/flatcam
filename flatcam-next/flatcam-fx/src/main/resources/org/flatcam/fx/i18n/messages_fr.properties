preferences.fonts.interface.help=Taille de 8 à 40 pour les contrôles de l'interface, y compris l'arborescence, les panneaux et les préférences. La valeur par défaut de FX est 12.\n\nRéférence : des valeurs plus élevées nécessitent plus d'espace ; les pages restent défilables. Prend effet après la réouverture de l'application.
# PreferencesPane.java
preferences.fonts.text.help=Taille de 8 à 40 pour les zones de texte, la sortie du terminal et les éditeurs de code. La valeur par défaut de FX est 13.\n\nRésultat : les numéros de code et de ligne utilisent la même taille. Les polices et le contenu à espacement fixe sont préservés.
# PreferencesPane.java
preferences.fonts.axis.help=Taille de 0 à 40 pour les numéros de règle de tracé. La valeur par défaut de FX est 13. Zéro masque uniquement les chiffres.\n\nRésultat : les polices plus grandes agrandissent les bandes des règles et espacent leurs étiquettes. Les coordonnées de la grille et du dessin sont conservées.
# PreferencesPane.java
preferences.fonts.hud.help=Taille de 8 à 40 pour les coordonnées X, Y, Dx et Dy HUD sur le Plot. La valeur par défaut de FX est 11.\n\nRéférence : les annotations CNC ont leur propre paramètre de police et ne sont pas affectées.
