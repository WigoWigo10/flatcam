ui.32c69353fa94=Origine : point (0, 0).\nSélection : centre de la boîte englobante combinée des objets sélectionnés.\nPoint : coordonnée saisie en dessous.\nObjet : centre de la boîte de l'objet choisi, sans le modifier sauf s'il est sélectionné.
# TransformToolPanel.java
ui.514fbb789a51=Utilise le centre de la boîte de cet objet comme point de transformation fixe lorsque la référence est Object.\n\nRéférence : choisir un objet ici ne le sélectionne pas pour la transformation ; les cibles restent les objets sélectionnés dans l'arborescence.
# TransformToolPanel.java
ui.a814ce1942ff=Point de référence X
# TransformToolPanel.java
ui.7cd7c75dae58=Coordonnée X absolue du point fixe utilisée pour faire pivoter, incliner, mettre à l'échelle ou refléter avec la référence de point.\n\nUnités : unités des objets sélectionnés (mm ou po). Il ne s'agit pas d'une compensation.
# TransformToolPanel.java
ui.3db8111cfcf2=Point de référence Y
# TransformToolPanel.java
ui.ce3bfaaf9be8=Coordonnée Y absolue du point fixe utilisé avec la référence de point.\n\nUnités : unités des objets sélectionnés (mm ou in). Il ne s'agit pas d'une compensation.
# TransformToolPanel.java
ui.c31319d105e2=Choisissez un objet de référence avec une géométrie.
# TransformToolPanel.java
ui.81b775038e07=Positif = dans le sens des aiguilles d'une montre. Négatif = dans le sens inverse des aiguilles d'une montre.
# TransformToolPanel.java
ui.58c488f2d50d=Tampon par distance
# TransformToolPanel.java
ui.9b65181e62d6=Agrandit avec une distance positive et réduit avec une distance négative. Unités de l’objet (mm ou in). Coins arrondis adoucit les sommets ; si l’option est décochée, les raccords sont en onglet.\n\nExcellon : modifie les diamètres de la valeur saisie, en conservant les centres et les rainures, comme dans Python. Geometry/Gerber : modifie les surfaces ou trajets ; ce n’est pas une compensation CNC. Les résultats vides sont refusés. Utilisez des objets ayant les mêmes unités.
# TransformToolPanel.java
ui.542124ea4ea2=Utilise un facteur de 1 + pourcentage/100 ; nécessite un pourcentage supérieur à -100 et différent de zéro. Échelle les formes autour de leurs centres locaux, et non de la référence globale. Excellon modifie uniquement les diamètres ; les emplacements conservent leurs points de terminaison. Ne modifie pas les diamètres des outils Geometry.\n\nGerber : les contours sont approximatifs ; les métadonnées d’ouverture restent inchangées. Vérifiez le résultat et exportez.
# TransformToolPanel.java
ui.0bfc9548bef6=Chaque bouton s'applique immédiatement aux objets sélectionnés dans le projet.
