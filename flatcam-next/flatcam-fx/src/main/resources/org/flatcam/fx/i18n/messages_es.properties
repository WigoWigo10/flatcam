ui.efa5c73902d5=\u0020debe ser un entero positivo
# PanelizeToolPanel.java
ui.c8145c54dfeb=Los objetos, la referencia y el esquema deben usar unidades coincidentes (MM o IN). Convierta primero.
# PanelTooltips.java, ToolDefaultsDescriptions.java
ui.d35139417031=\n\nUnidades: unidades de objeto por minuto (mm/min o in/min).
# PanelTooltips.java
ui.436bc30a4940=Seleccione formas, aperturas o herramientas para editar. Las selecciones de dibujo y tabla están sincronizadas.\n\nAtajos: Ctrl+click alterna elementos; Shift+click selecciona un rango.\n\nLos cambios del editor permanecen en un borrador hasta que se aplican al objeto.
# PanelTooltips.java
ui.ad2d9c120fc7=Herramientas para esta operación. Seleccione una fila para revisar los parámetros; algunas operaciones utilizan filas seleccionadas únicamente.\n\nDiámetro: ancho de herramienta en unidades de objeto.\nTT: C1–C4 (cortador plano), perfil B (punta esférica) o V (punta en V), cuando disponible.\n\nAtajos: Ctrl+click alterna elementos; Shift+click selecciona un rango.
# PanelTooltips.java
ui.17ff5079da43=Gerber aperturas: El código identifica el código D; El tipo es forma; Tamaño / Dim son dimensiones; M resalta la apertura en el gráfico.\n\nUnidades: Gerber unidades (mm o pulgadas).
# PanelTooltips.java
ui.389187de5ff7=Excellon herramientas y sus diámetros, número de agujeros y ranuras. Visualización de controles de trazado únicamente.\n\nUnidades: Excellon unidades (mm o pulgadas).
# PanelTooltips.java
ui.e166946231ba=Herramientas y estadísticas del programa. Los tiempos son estimaciones, no mediciones físicas de la máquina.
# PanelTooltips.java
ui.b539b0ae3d10=Profundidad máxima añadida por pasada, como valor positivo. Disponible con Multi-Depth habilitado.
# PanelTooltips.java
ui.44e779231dad=Espere después de iniciar el eje en segundos. Disponible con Dwell habilitado.
# PanelTooltips.java
ui.07f2028856a4=Distancia adicional entre herramienta y cobre. Disponible con Desplazamiento habilitado.
# PanelTooltips.java
ui.f5dc232a0e84=Diámetro de corte, mayor que cero. Define el ancho de la trayectoria mecanizada, no la profundidad de corte.
# PanelTooltips.java
ui.cb319b057e03=Diámetro del punto láser utilizado para calcular el ancho del camino.
# PanelTooltips.java
ui.16197e80938e=Número entero Isolation recuento de pases. Más pasadas aumentan el ancho del aislamiento junto con el diámetro y la superposición.
# PanelTooltips.java
ui.3ef9009da869=Superposición de trayectoria como porcentaje del diámetro de la herramienta, de 0 a menos del 100 %. Los valores más grandes crean más rutas y aumentan el tiempo de cálculo y mecanizado.
# PanelTooltips.java
ui.e118b0da1cdf=Une segmentos para reducir los levantamientos de herramientas, manteniendo los conectores dentro del área permitida.
# PanelTooltips.java
ui.dd089b7e79e7=Agrega un camino alrededor del perímetro para terminar los bordes.
# PanelTooltips.java
ui.ee5e6c23aef0=Cada herramienta más pequeña funciona sólo donde las herramientas más grandes no pueden llegar. Las herramientas van de mayor a menor.
# PanelTooltips.java
ui.d22fd9511bb4=No = orden de la tabla.\nAdelante = diámetro de menor a mayor.\nReversa = de mayor a menor.\n\nRest Machining utiliza el orden de mayor a menor.
# PanelTooltips.java
ui.5a756dcbcbb6=Comprueba si los diámetros elegidos se ajustan a los espacios entre las regiones de cobre. No reemplaza la inspección de caminos generados.
# PanelTooltips.java
ui.51eec4336df5=Combina pases y herramientas en un Geometry. Desmarque para salidas separadas e inspección de resultados individuales.
# PanelTooltips.java
ui.0d20ffdbcfcc=Divide la profundidad total en pasadas limitadas por el valor adyacente. Para taladrar, la herramienta se retrae entre pasadas.
# PanelTooltips.java
ui.f9bdd0393884=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.
# PanelTooltips.java
ui.dc3ffee94380=Altura de recorrido entre cortes. Debe limpiar la pieza de trabajo y los accesorios; Confirme la referencia Z antes de la ejecución.
# PanelTooltips.java
ui.c5cedf78c41e=Enfoque y altura de acabado del perfil láser. Sin profundidad de fresado.
# PanelTooltips.java
ui.f6e1cad50dcc=Velocidad de inmersión del eje Z. Introduzca un valor positivo apropiado para la herramienta y el material.
# PanelTooltips.java
ui.5d82bb7fdc0d=Velocidad de corte X-Y. Los avances por inmersión y rápidos pueden tener configuraciones separadas.
# PanelTooltips.java
ui.4a1f713ddacb=Spindle velocidad en RPM. Zero no ordena la rotación con perfiles que lo permitan; una secuencia de cambio de herramienta aún puede emitir M5 para detenerse antes de hacer una pausa. El sondeo Mach3 requiere rotación positiva.
# PanelTooltips.java
ui.203a95b2695c=Valor entero S/PWM utilizado por el perfil seleccionado; no necesariamente RPM. El rango permitido depende del postprocesador.
# PanelTooltips.java
ui.4dc0ad534d81=Permite esperar después de arrancar el husillo para alcanzar la velocidad configurada. El valor adyacente es el tiempo en segundos.
# PanelTooltips.java
ui.03ee6b58a9e1=Compensación de la punta de la broca: positiva aumenta la profundidad; negativo lo reduce. El corte resultante debe permanecer debajo de la superficie.
# PanelTooltips.java
ui.785425641416=Habilita la secuencia de cambio de herramienta compatible con el posprocesador. Los cambios manuales pausan el programa; Los perfiles de palpación tienen su propia secuencia.
# PanelTooltips.java
ui.91ccd63a71eb=Altura de cambio de herramienta relativa a la referencia Z. En Drilling y Geometry CNC sin sondeo, debe ser al menos el Travel Z más alto de las herramientas seleccionadas, incluso sin cambio XY. Verifique la pieza de trabajo y los accesorios.
# PanelTooltips.java
ui.01e9b9ebc3e1=Programa final altura Z. El movimiento final X-Y, cuando se especifica, tiene lugar a esta altura: confirme la franqueación de obstáculos.
# PanelTooltips.java
ui.d7b5370b513a=Enter Ninguno si no hay recorrido X-Y o dos coordenadas separadas por punto y coma, p. 10;20. Confirmar autorización de ruta.
# PanelTooltips.java
ui.d90372d2a658=Límite Z negativo para buscar contacto con G31.\n\nAdvertencia: confirmar sensor, origen y recorrido disponible antes de la ejecución.
# PanelTooltips.java
ui.b813f6af443f=Alimentación positiva utilizada para buscar contacto con la sonda. Utilice un valor compatible con el sensor y la máquina.
# PanelTooltips.java
ui.7ac40cf21a38=Coordenada Z conocida de la superficie de contacto, incluido el espesor de la placa sonda según la referencia elegida.
# PanelTooltips.java
ui.041770004fa0=Cambio de herramienta y posición de palpado. Ninguno mantiene X-Y; ingrese X;Y para moverse. Revisar ruta y máquina macro M6.
# PanelTooltips.java
ui.8960a1f464af=Diámetro de la punta de la herramienta en V, no ancho de corte a la profundidad elegida.
# PanelTooltips.java
ui.7d107a31029d=Ángulo completo de la punta en V en grados, mayor que 0 y menor que 180. Junto con la punta y la profundidad, determina el ancho de corte.
# PanelTooltips.java
ui.d00ced7068bd=Busca en la Base de Datos de Herramientas por diámetro y operación. Una única coincidencia compatible transfiere los parámetros admitidos; sin coincidencia, usa valores predeterminados.
# PanelTooltips.java
ui.003dcc4efcc7=Elige explícitamente una herramienta en la base de datos de herramientas. Verifique el diámetro, tipo y parámetros transferidos antes de generar.
# PanelTooltips.java
ui.c63d5e901969=Calcula la distancia mínima entre la región de cobre en el fondo para sugerir un diámetro de ajuste. No establece el avance o la profundidad automáticamente.
# PanelTooltips.java
ui.263308029a5e=Copia los parámetros de la herramienta seleccionada a cada herramienta en la tabla. Revise los valores por herramienta antes de generarlos.
# PanelTooltips.java
ui.c494dda8fb44=Restaura los parámetros iniciales del panel; no elimina los objetos de proyecto generados previamente.
# PanelTooltips.java
ui.f4d2e8d05a99=Rellena formas de dibujo; desmarque para mostrar solo los contornos. No cambia los datos CAM.
# PanelTooltips.java
ui.689e677b09ba=Distingue aberturas o herramientas dibujando colores. No cambia el objeto o G-code.
# PanelTooltips.java
ui.e249cee220d4=Muestra CNC Job números de movimiento en el dibujo para ubicar segmentos del programa.
# PanelTooltips.java
ui.92d9b4392453=Muestra la dirección del movimiento CNC Job. Sólo una ayuda visual; no invierte caminos.
# PanelTooltips.java
ui.bb59dff2e0f8=Margen agregado al cuadro circundante del objeto para generar un área auxiliar.
# PanelTooltips.java
ui.abf69650ee82=Multiplica todas las coordenadas y dimensiones por el factor ingresado. 1 mantiene el tamaño; 2 lo duplica.
# PanelTooltips.java
ui.ff163904e0e7=Traduce el objeto según el desplazamiento X ingresado; no compensación del radio de la herramienta.
# PanelTooltips.java
ui.4b26bfb73b97=Divide la profundidad total en pasadas limitadas por el valor adyacente. Elija una estrategia: retracción en la misma dirección o alternancia continua. Continuo invierte la orientación, incluidas las LineStrings cerradas; no es automáticamente apropiado para cada herramienta/material.
# PanelTooltips.java
ui.f1e1a3617f23=Método de relleno:\nStandard = pases hacia adentro.\nSeed = expansión desde una semilla.\nLines = líneas paralelas.\nCombo = prueba métodos alternativos.
# PanelTooltips.java
ui.b9c15c9a9358=Margen del claro delimitador del cuadro. Sin compensación: el espacio libre entre vías se configura por separado.
# PanelTooltips.java
ui.fab7aa889bcb=Margen individual entre el relleno y el borde del polígono. Un valor positivo reduce el área; uno negativo la amplía.\n\nAdvertencia: los valores negativos pueden crear trayectos fuera del contorno original.
# PanelTooltips.java
ui.bd769a9b9060=Permite una distancia de protección adicional alrededor de pistas y plataformas durante la limpieza. Habilita el valor de Compensación.
# PanelTooltips.java
ui.c0dc07fd4dd3=Itself = cuadro de origen.\nÁrea = área dibujada.\nReferencia = límite proporcionado por otro objeto.\n\nDefine dónde puede ocurrir la limpieza sin cambiar el cobre de origen.
# PanelTooltips.java
ui.be87706fb56a=Clear elimina el cobre fuera del circuito.\nIsolation crea rutas alrededor de la pista antes de limpiarlas.\n\nLa operación se configura por herramienta.
# PanelTooltips.java
ui.69fd75d1132d=Climb = fresado ascendente.\nConventional = fresado convencional.\n\nPara NCC, esta elección se aplica a la operación Isolation.
# PanelTooltips.java
ui.2860353558e0=Both = bordes exteriores e interiores.\nExterior = solo exterior.\nInterior = solo bordes de apertura internos.
# PanelTooltips.java
ui.1de3b2940ea0=Elimina el área rellena del Geometry seleccionado de las rutas de aislamiento. Elija Ninguno para omitir un objeto de excepción.
# PanelTooltips.java
ui.11cb97544ccc=Sigue los centros de las vías en lugar de aislar los bordes; utiliza sólo una herramienta.\n\nAdvertencia: este modo corta en la pista.
# PanelTooltips.java
ui.ce5f1f7ee6d6=Dibuje la región donde se suprimirán las rutas de aislamiento. El área dibujada es una excepción adicional al Geometry elegido.
# PanelTooltips.java
ui.cf2d82536de7=Un solo procesa una placa.\nEl panel procesa los componentes de origen como placas separadas, reteniendo puentes en cada una.
# PanelTooltips.java
ui.1aa0f032c351=Utiliza un contorno convexo que encierra la placa sin seguir sus huecos.
# PanelTooltips.java
ui.a784fc5e1345=Margen relativo al límite de la placa. Positivo aleja la trayectoria de corte del borde original.
# PanelTooltips.java
ui.e153bbf0f21e=Bridge ancho sujetando la tabla al material mientras se corta.
# PanelTooltips.java
ui.2002c78dd5d8=Ninguno = sin puentes.\nLR/TB = izquierda-derecha/arriba-abajo.\n4 = uno por lado.\n2LR/2TB = dos en los lados indicados.\n8 = dos por lado.
# PanelTooltips.java
ui.b857c52a46ea=Bridge interrumpe el corte.\nThin crea Geometry adicional con Thin Profundidad para adelgazar puentes; genera su CNC Job por separado.\nM-Bites crea Excellon agujeros en puentes; configurar la perforación posteriormente.
# PanelTooltips.java
ui.d3ca7681ff0d=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.
# PanelTooltips.java
ui.7f1ec33d4658=Z negativa para el puente Geometry, menos profundo que Cut Z. Ejemplo: recorte -1,7 y Thin Profundidad -0,5. Sólo aplica a Thin; generar ambos CNC Jobs por separado.
# PanelTooltips.java
ui.f71d028c7cb5=Mouse Bites diámetro del agujero. Se aplica únicamente a M-Bites.
# PanelTooltips.java
ui.2e649de459f4=Clear espacio entre Mouse Bites bordes del agujero. El paso central es el diámetro más este valor.
# PanelTooltips.java
ui.669b706abacc=Dibuje una región de trazado para abrir un puente manual donde cruza la ruta de corte.\n\nAdvertencia: cualquier espacio manual reemplaza el patrón automático; El ancho depende de la región dibujada. Limpiar espacios manuales restaura el patrón automático.
# PanelTooltips.java
ui.137105ed53a8=Ángulo de rotación en grados. Positivo = en el sentido de las agujas del reloj; negativo = en sentido antihorario. Utiliza la referencia seleccionada.
# PanelTooltips.java
ui.a8ecb31dff59=Ángulo de inclinación en el eje indicado en grados respecto a la referencia elegida.
# PanelTooltips.java
ui.00c9ede8c4ac=Factor de escala en el eje indicado. 1 mantiene el tamaño. Link aplica el mismo factor a ambos ejes.
# PanelTooltips.java
ui.26cd317f9e31=Desplazamiento de coordenadas en el eje indicado. Lo positivo y lo negativo se mueven en direcciones opuestas.
# PanelTooltips.java
ui.269a72f32deb=Utiliza el mismo valor en ambos ejes para la transformación de esta sección.
# PanelTooltips.java
ui.20f84da739ba=Selecciona Blanco puro, Negro puro, Blanco hielo o Negro hielo. Blanco puro es el tema inicial. Aplicar guarda la elección; no cambia el proyecto ni los datos CAM.
# PanelTooltips.java
ui.4c021678cad6=Distancia positiva entre posiciones de ajuste en este eje. El paso Y se ignora cuando los ejes están vinculados.
# PanelTooltips.java
ui.9bc5c6ee8750=Ajusta clics y dibujos a puntos de la cuadrícula. Puede permanecer activo con la cuadrícula visual oculta.
# PanelTooltips.java
ui.910a65ecc56d=Vincula ambos ejes al paso X; Y está deshabilitado mientras está activo.
# PanelTooltips.java
ui.9442e92cf350=Muestra las coordenadas absolutas del trazado y el desplazamiento del cursor. No cambia el origen de la pieza de trabajo.
# PanelTooltips.java
ui.3ea733c6ed68=Muestra una referencia visual del tamaño de hoja A4. No limita el mecanizado ni cambia la escala del objeto.
# PanelTooltips.java
ui.57f8e10d16ad=Convierte las coordenadas del archivo exportado a MM (milímetros) o IN (pulgadas). No cambia el objeto del proyecto.
# PanelTooltips.java
ui.0215460711ca=Dígitos antes del punto implícito. Debe acomodar la coordenada más grande del trabajo. No se utiliza para el decimal Excellon.
# PanelTooltips.java
ui.41be4ff42d58=Lugares decimales en coordenadas exportadas. Más lugares aumentan la precisión numérica, no la precisión física de la máquina.
# PanelTooltips.java
ui.6b1165b1804d=L omite los ceros a la izquierda; T omite los ceros finales. El formato Gerber declarado permite reconstruir el punto decimal.
# PanelTooltips.java
ui.ba98fc666b44=LZ sigue con ceros a la izquierda; TZ sigue con ceros finales. Se aplica solo sin un punto decimal explícito.\n\nAdvertencia: las convenciones Excellon difieren de Gerber L/T.
# PanelTooltips.java
ui.896aea2964e5=Decimal escribe el punto explícitamente. Sin punto decimal, se requieren configuraciones de dígitos y cero para interpretar las coordenadas.
# PanelTooltips.java
ui.8185359a4e03=Enrutado representa ranuras con G00/M15/G01/M16. Perforado utiliza el ciclo G85. Elija un formato compatible con el software de lectura.
# PanelTooltips.java
ui.7dab125ea378=Color de relleno del trazado del objeto; el esquema se deriva de él. No cambia Gerber, Geometry o G-code.
# PanelTooltips.java
ui.ae3b269ff29d=0% = totalmente transparente; 100% = opaco. Configuración de visualización únicamente.
# PanelTooltips.java
ui.988650ae48d4=Recuento de copias enteras positivas en este eje. El total es columnas × filas.
# PanelTooltips.java
ui.6fe0c601e0f2=Espacio entre cuadros de copia, no la distancia entre sus orígenes.
# PanelTooltips.java
ui.2ff9d207571f=Tamaño máximo de panel. Cuando está habilitado, reduce el número de filas/columnas para ajustarlas.
# PanelTooltips.java
ui.686da55c093e=Resolución PNG en puntos por pulgada. Un DPI más alto crea una imagen más grande; SVG y PDF conservan la geometría vectorial.
# PanelTooltips.java
ui.a4a28c7edd4b=Margen del marco exterior de película negativa en unidades de objeto.
# PanelTooltips.java
ui.5058f29a20d3=Grosor utilizado para representar caminos en películas exportadas. No cambia el ancho del cobre del proyecto.
# PanelTooltips.java
ui.8b6df7eabd30=Define el tamaño del papel PDF. Revise la orientación y la escala en el programa de impresión para preservar las dimensiones de la placa.
# PanelTooltips.java
ui.a61b5c516a4a=Punto de referencia para la inclinación de la película. Afecta la posición transformada, no sólo el ángulo.
# PanelTooltips.java
ui.f8c09afdaa53=Tamaño entero de cada módulo en décimas de unidades de objeto. Ejemplo: 10 significa un módulo de 1 mm en un objeto MM. Las dimensiones totales también dependen de la versión y el borde.
# PanelTooltips.java
ui.13ca79a66b25=Versión mínima del Código QR. Las versiones más grandes contienen más módulos; el código puede crecer automáticamente para adaptarse a los datos.
# PanelTooltips.java
ui.0fdf2fbd0630=Módulos de margen silencioso alrededor del código, separándolo de los elementos cercanos para facilitar la lectura.
# PanelTooltips.java
ui.f70dc3a27ddc=L, M, Q y H permiten aumentar la recuperación de datos dañados. Una mayor corrección puede aumentar el tamaño del código.
# PanelTooltips.java
ui.817a406a2107=Positivo añade módulos QR de cobre. Negativo elimina módulos de una región llena.
# PanelTooltips.java
ui.e26c7731342b=Diámetro común para agujeros creados en pads seleccionados. Compruebe que se ajuste a la almohadilla más pequeña.
# PanelTooltips.java
ui.22b14867f83e=Diámetro del orificio como porcentaje de la dimensión de la almohadilla. Se aplica al modo proporcional.
# PanelTooltips.java
ui.28dfcb56ff82=Ancho del anillo de cobre para preservar alrededor del orificio para este tipo de almohadilla. Se aplica al modo de anillo anular.
# PanelTooltips.java
ui.438e6e0f7cbe=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.
# PanelTooltips.java
ui.6908e296c590=Ancho de corte efectivo de la herramienta en V en Cut Z, calculado a partir de la punta y el ángulo.
# PanelTooltips.java
ui.6d7dbdadbbfa=Dimensión de la placa en centímetros utilizada para calcular el área. No utiliza unidades de proyecto actuales.
# PanelTooltips.java
ui.63d63819cdf1=Área de la calculadora de galvanoplastia en cm².
# PanelTooltips.java
ui.0596138aeb7d=Densidad de corriente en amperios por pie cuadrado (ASF), utilizada para estimar la corriente y el tiempo.
# PanelTooltips.java
ui.319f48939af2=Espesor del cobre a depositar en micrómetros, utilizado para estimar el tiempo.
# PanelTooltips.java
ui.c4737c34a069=Corriente calculada en amperios del área y densidad seleccionadas.
# PanelTooltips.java
ui.9710a4b7e7cd=Tiempo estimado de deposición en minutos. Una estimación de modelo, no una medición de proceso.
# PanelTooltips.java
ui.85339b5bcafb=Valor en micrómetros, no en unidades de proyecto. Define espesor o compensación lateral según el método seleccionado.
# PanelTooltips.java
ui.ce5dd3bb5a57=Factor de grabado utilizado con espesor de cobre para calcular la compensación lateral. No es un factor de escala de dibujo.
# PanelTooltips.java
ui.dc10d84e88fe=Lugares decimales utilizados para agrupar distancias de informes iguales. No mejora la precisión original Gerber.
# PanelTooltips.java
ui.f5047733c3e6=Ignora las regiones vacías más pequeñas que esta área.\n\nUnidades: unidades de objeto al cuadrado (mm² o in²).
# PanelHelpCatalog.java, PanelTooltips.java
