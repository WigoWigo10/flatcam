ui.615fb942b47a=Utilice el área de la placa Geometry creada a partir de Edge_Cuts, no cobre: todos los anillos internos de origen se mecanizarán. Para placas múltiples, seleccione Panel.\n\nDisponible solo con forma libre, sin forma convexa y con un margen no negativo. El radio y el margen de la herramienta compensan el camino hacia cada abertura. Se rechaza la generación si una abertura desaparece o se parte.\n\nLos recortes internos están cerrados, sin puentes, Thin o M-Bites, incluso con huecos manuales. Esto no es un desbaste de bolsillo: revise las esquinas, los accesorios y las piezas sueltas antes de generar CNC.
# CutoutToolPanel.java
ui.b3b282224871=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.
# CutoutToolPanel.java
ui.42adc98e530c=**Thin Profundidad:** coordenada Z del puente, por encima del Cut Z completo. Ejemplo de modo Standard: recorte −1,7 y puentes −0,5. El maquinista también acepta Z positivo o cero, conservando Thin Profundidad > Cut Z.\n\nSe usa solo para Thin. Este valor va a un puente separado Geometry; el recorte principal conserva Cut Z. Genere los dos CNC Jobs por separado.\n\nUnidades: unidades de objeto (mm o pulgadas).
# CutoutToolPanel.java, ToolDefaults.java
ui.63b0047e887c=Posiciones de brecha
# CutoutToolPanel.java
ui.ca024fd61793=LR/TB crean dos puentes; CUATRO crea cuatro; TWO_LR/TWO_TB crean cuatro; OCHO crea ocho.\n\nPara el recorte rectangular, el centro de origen está desplazado por el margen, como en Python. Uso de patrones dobles (dimensión fuente + dos márgenes) / 4; el radio de la herramienta no cambia este espaciado.\n\nSi el margen o el ancho eliminan un puente solicitado, se rechaza la generación rectangular. Los espacios manuales reemplazan el patrón. Verifique la vista previa antes de generar CNC.
