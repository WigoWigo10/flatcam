ui.2962b8cb0b69=Seleccione una fila para resaltar el área restante en el Gráfico. El residual de una herramienta es su objetivo menos su propio corte; el residual acumulativo utiliza todas las herramientas hasta esa fila. ISO puede contribuir a la cobertura acumulativa sin un objetivo de compensación individual.
