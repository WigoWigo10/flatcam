cutout.internal.frame_help=Vista previa: encuadra las aberturas seleccionadas sin mover ni modificar la placa.\n\nÚselo para comprobar la compensación de la fresa. Después puede ajustar el zoom libremente.
# InternalCutoutToolPanel.java
cutout.internal.legend_opening=Abertura deseada
# InternalCutoutToolPanel.java
cutout.internal.legend_path=Centro de la fresa
# InternalCutoutToolPanel.java
cutout.internal.legend_swept=Franja eliminada
# InternalCutoutToolPanel.java
cutout.internal.legend_invalid=! Revisar
# InternalCutoutToolPanel.java
cutout.internal.legend_help=Vista previa: contorno discontinuo = abertura deseada; línea continua = centro de la fresa; franja rellena = material eliminado al recorrer el contorno.\n\nAtención: el interior restante no se vacía. No hay puentes internos; compruebe la sujeción de la pieza sobrante. La vista es plana y no simula profundidad ni colisiones.
# InternalCutoutToolPanel.java
cutout.internal.diameter_help=Diámetro real de la fresa en las unidades del origen. El cálculo conserva la precisión introducida, como 0,198 mm.\n\nVista previa: la línea representa el centro de la fresa; la franja muestra el ancho eliminado. La fresa debe caber en toda la abertura.
# InternalCutoutToolPanel.java
cutout.internal.margin_help=Material dejado junto al borde de la abertura. El centro de la fresa se desplaza hacia dentro por el margen más el radio de la fresa.\n\nEjemplo: una abertura de 10 mm con margen de 0,2 mm deja aproximadamente 9,6 mm entre los bordes opuestos mecanizados. Margen cero corta hasta el contorno deseado, respetando el radio en las esquinas.\n\nLimitación: este modo no acepta margen negativo.
