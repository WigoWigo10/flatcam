cutout.internal.generate_help=Crea una Geometry independiente solo con los contornos internos seleccionados, compensados por el radio de la fresa y el margen. No genera perímetro exterior, puentes, Thin ni M-Bites. Después abra Geometry para revisar y generar el CNC Job. El archivo original no se modifica.
