# CncPreflight.java
ui.c7a394da9f72=Láser: la potencia es el valor S/PWM solicitado al controlador, no el RPM físico. La vista previa muestra rutas pero no simula vigas, materiales, enclavamientos o configuraciones eléctricas; no es una validación de seguridad.
# CncPreflight.java
ui.e6b011d26eaf=Láser: una pasada por trayecto, sin Multi-Depth, cambios de herramienta mecánicos, Dwell o Extra Cut. Los puntos aislados requieren tiempo de exposición y son rechazados. End Z/XY se comparte; la alimentación/potencia son individuales por grupo y Z_laser/Marlin permiten el enfoque individual.
# CncPreflight.java
ui.fb3647cef05d=Láser GRBL: confirmar $30 (escala S), $32 (modo láser) y cableado de control. Comandos FX M5 antes del posicionamiento; no detecta la configuración de la máquina ni asume que S representa un porcentaje.
# CncPreflight.java
ui.bfb39f3cb997=Láser Marlin: confirme INCH_MODE_SUPPORT para IN, la configuración de salida y el modo de control no en línea predeterminado. Se corrigió que G0_FEEDRATE pudiera ignorar los rápidos de alimentación. M400 incluye el estacionamiento final pero no confirma el apagado físico del haz.
# CncPreflight.java
ui.5ed498ea494d=Marlin VENTILADOR: M106/M107 usa PWM de 1 a 255 en este perfil. Confirme el pin FAN y LASER_SYNCHRONOUS_M106_M107; La velocidad del ventilador no está calibrada. La potencia óptica.
# CncPreflight.java
ui.833e9f781ddb=Repetidor: la potencia es FAN PWM de 0 a 255, no RPM. M106/M107 requieren circuitos y salida de VENTILADOR adecuados; no confirman la rotación física. La potencia cero no enciende la salida ni garantiza una parada definitiva si ya estaba encendida.
# CncPreflight.java
ui.a963bb6108f4=Repetier: @pause solicita un cambio de herramienta del operador a través de Repetier-Host; no selecciona una herramienta automáticamente. M84 libera motores y puede perder la referencia. Verifique los accesorios, el origen y la altura antes de continuar; la vista previa no simula esta pérdida.
# CncPreflight.java
ui.2a98c7ae4ac7=Berta: confirma la configuración del comando M110/M111 y el origen de G54. Sus efectos dependen de la máquina y no son simulados; no seleccione el perfil simplemente porque acepta G-code genérico.
# CncPreflight.java
ui.12993adbfa62=Berta: G64 P0.03 conserva el valor del perfil Python en unidades de programa: 0,03 mm en MM o 0,762 mm en IN. Esta es una tolerancia de ruta configurada, no una precisión garantizada. Verifique antes de exportar.
# CncPreflight.java
ui.ad72fab202c4=Dwell: el tiempo de interfaz permanece en segundos; G4 P se emite en milisegundos, incluso en IN. El feed nativo es por minuto, sin G94.
# CncPreflight.java
ui.1a5bfef7cb45=Cambio manual de herramienta: tres M0 pausas por herramienta. Entre ellos, un movimiento ordenado a Z0 utiliza el avance Z de la herramienta y regresa al cambio de herramienta Z; G90 se restaura antes de los movimientos verticales. Esto no es un sondeo ni una detección automática de contactos.
# CncPreflight.java
ui.bfa4c6d10df1=Confirme el cero de la pieza de trabajo, la posición XY y la altura libre antes de continuar con cada pausa. Los movimientos de los operadores y los cambios de origen/unidad no se simulan.
# CncPreflight.java
ui.056653f07521=Cambio de herramienta personalizado: Tn/M6 cuando los cambios de herramienta están habilitados, sin M0 adicional. La altura y XY se ordenan antes de la macro; posteriormente, G90 y Z se restauran antes del siguiente XY. La macro, la selección de herramientas físicas y los cambios de origen no se simulan.
# CncPreflight.java
ui.551bc50c7c28=ISEL PIC: solo mm; coordenadas en micrómetros, VEL/FASTVEL en micrómetros por segundo y ESPERA en milisegundos. Los valores se truncan a números enteros sin aumentar la precisión del controlador.
# CncPreflight.java
ui.c055d19b5676=ISEL ICP: GETTOOL realiza cambios automáticos de herramienta incluso sin pausa manual. Confirmar la macro, referencias y alturas; la vista previa no simula ese cambio ni la sincronización rápida. El estacionamiento conserva el origen sin WPCLEAR.
# CncPreflight.java
ui.b78eb28ba8ec=line_xyz: elevación inicial y restauración de Z después de que M6 conserve el X/Y actual. XYZ son explícitos cuando se conocen; Confirme que el controlador acepta el preámbulo vertical. La macro M6 no está simulada.
# CncPreflight.java
ui.beced43c3234=ISEL CNC: este perfil utiliza mm, G71/G94 y T1–T128. Los tiempos Dwell establecidos en segundos se convierten a milisegundos en G-code.
# CncPreflight.java
ui.47beaa3c3a96=ISEL DIN/ISO remoto: M01 es una parada que implica la interacción del operador. En otros controladores, verifique si la parada es opcional y está habilitada; no asuma que M01 siempre se comporta de manera idéntica.
# CncPreflight.java
ui.61300f9e6d65=ISEL CNC: las alturas de cambio de herramienta/XY se emiten antes de M06 y Z se restaura después. La macro de cambio de herramienta y la referencia física no se simulan. M30 finaliza después del estacionamiento final.
# CncPreflight.java
ui.b47b197e04cf=Marlin: confirme SPINDLE_FEATURE y CUTTER_POWER_UNIT=RPM. S representa RPM solo con esa configuración.
# CncPreflight.java
ui.d39e5a5107c0=Marlin: Tn puede seleccionar extrusores; Tn/M6 requiere una configuración compatible con CNC o una macro. M0 depende del soporte de pausa; IN requiere INCH_MODE_SUPPORT.
# CncPreflight.java
ui.942ad8da333b=Marlin: cada G0 recibe rápidos de alimentación, pero el G0_FEEDRATE fijo puede ignorar F. M400 espera los movimientos del planificador; no confirma la parada física del husillo.
# CncPreflight.java
ui.0fb95639fea3=La vista previa de sondeo no simula G31, contacto, G92 ni macros de cambio de herramienta. No valida la seguridad de la máquina.
# CncPreflight.java
ui.651add8c8080=La vista previa es 2D: no simula remoción de material, abrazaderas, límites de la máquina ni macromovimientos M6.
