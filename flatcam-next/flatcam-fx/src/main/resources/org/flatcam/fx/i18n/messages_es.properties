ui.5ab5091dc124=Start Z, End Z/XY y Cambio de herramienta Z/XY se aplican a todas las herramientas. Vacío/Ninguno mantiene los valores automáticos.\n\nEl láser acepta solo End Z/XY: apagado, XY viaja a una altura libre, luego End Z. HPGL, Roland y el sondeo utilizan sus propios ajustes. Los campos deshabilitados conservan configuraciones incompatibles: regrese a fresado para borrarlos.\n\nEl cambio Z/XY se aplica solo cuando los cambios de herramientas están habilitados o el perfil selecciona herramientas automáticamente.
