# ToolDefaultsDescriptions.java
ui.fa693d21c4fb=Mostrar valor predeterminado para el nuevo CNC Jobs. El corte y el recorrido tienen colores RGBA independientes; TODO muestra ambos, CORTE solo corte y RECORRIDO solo recorrido. Las anotaciones utilizan entre 1 y 72 píxeles lógicos; El color predeterminado adapta el contraste al tema. No cambia G-code. Las copias y los proyectos reabiertos conservan el estilo guardado. Se aplica únicamente a objetos nuevos; Los controles de propiedad permanecen disponibles.
# ToolDefaultsDescriptions.java
ui.2cdd1cde7f69=Inicialmente muestra Gerber líneas centrales (Seguir) en lugar de cobre relleno. La geometría sólida original permanece disponible para CAM. Se aplica a nuevos objetos; Los proyectos reabiertos y las copias conservan el estado. Se puede alternar en propiedades sin perder color.
# ToolDefaultsDescriptions.java
ui.7dfb138c6b26=Abre la tabla de apertura ampliada en el futuro Gerber Paneles de objetos. Contraer/expandir la sección no cambia la geometría. Un panel predeterminado; El estado de expansión no se guarda por objeto de proyecto.
# ToolDefaultsDescriptions.java
ui.baa07e368cdf=Color inicial para nuevos objetos en esta categoría. El selector y la entrada hexadecimal son equivalentes. Utilice #RRGGBB o #RRGGBBAA: AA varía de 00 (transparente) a FF (opaco), p. #BBF268BF. La opacidad del relleno y de la línea son independientes. Los proyectos, copias y objetos existentes reabiertos conservan los colores; no cambia CAM o G-code.
# ToolDefaultsDescriptions.java
ui.5d742879ac65=Visibilidad inicial al agregar nuevos objetos en esta categoría. Los objetos ocultos permanecen en el proyecto y se pueden habilitar a través del árbol o de las propiedades. No cambia los objetos existentes ni el estado del proyecto reabierto.
# ToolDefaultsDescriptions.java
ui.49e69952c72a=Inicialmente rellena nuevos polígonos de objetos; sin marcar muestra contornos. Los agujeros siguen abiertos. Afecta sólo al dibujo, no a la geometría utilizada por CAM.
# ToolDefaultsDescriptions.java
ui.cc28facb205e=Inicialmente dibuja partes del objeto en diferentes colores. Reemplaza visualmente el color único mientras está activo, conservándolo para cuando esté deshabilitado. No identifica redes eléctricas.
# ToolDefaultsDescriptions.java
ui.f44193ad60df=Segmentos por círculo completo para los nuevos arcos/círculos del Geometry Editor, de 4 a 4096. Los círculos utilizan el múltiplo inferior de 4, como en Python: 65 se convierte en 64. Más segmentos aproximan mejor las curvas y aumentan la memoria/el costo de la vista previa. No cambia las formas existentes ni garantiza la precisión física de la máquina. El editor permite ajustes locales antes de dibujar.
# ToolDefaultsDescriptions.java
ui.daa022cb0414=Lista inicial de diámetros de herramienta. Separe los elementos con comas y utilice puntos decimales, p. 1,0, 0,5. Ni una sola herramienta ni conversión automática de unidades.
# ToolDefaultsDescriptions.java
ui.6c40ce53a35a=STABLE utiliza un inicio determinista para los anillos FX Seed. PYTHON utiliza el punto representativo del algoritmo Python. Puede producir diferentes caminos en la misma zona; inspeccionar el resultado.
# ToolDefaultsDescriptions.java
ui.7d57dc1f9b6c=C1–C4 identifica cortadores planos con una a cuatro flautas; B es punta esférica y V tiene punta en V. El perfil no configura automáticamente el feed o RPM. Para V, verifique el diámetro y el ángulo de la punta en V al generar CNC.
# ToolDefaultsDescriptions.java
ui.3dd1e46fd590=Margen de posición fiducial automático relativo a los límites Gerber. No marcar el tamaño ni el tamaño de apertura de la máscara.
# ToolDefaultsDescriptions.java
ui.01bfc35ea137=Perfil inicial CNC. Debe coincidir con el controlador y el tipo de operación. No todos los perfiles admiten perforación, láser, sondeo o herramientas múltiples; La selección final se valida en el panel CNC.
# ToolDefaultsDescriptions.java
ui.7c9bf0cbede2=Unidades de reserva solo cuando Gerber no declara ninguna. Las declaraciones de expediente tienen prioridad. No convierte proyectos ya abiertos.
# ToolDefaultsDescriptions.java
ui.3bc8bc319d0d=Segmentación que se aproxima a Gerber arcos/círculos. Más segmentos aumentan los costos de detalle, memoria y cálculo; no precisión física de la máquina.
# ToolDefaultsDescriptions.java
ui.97a0b59de961=Dígitos enteros (1–9) para las coordenadas de punto implícito Excellon con LZ cuando no se declara ningún formato. LZ mantiene ceros a la izquierda y puede omitir ceros a la derecha. Las declaraciones FILE_FORMAT o INCH/METRIC enmascaradas tienen prioridad. No afecta a los números de puntos explícitos ni a los proyectos abiertos.
# ToolDefaultsDescriptions.java
ui.3ba09f061500=Convención solo cuando no se declara: TZ mantiene ceros a la derecha y permite omitir ceros a la izquierda; LZ mantiene ceros a la izquierda y permite omitir ceros a la derecha. IN Ejemplo 2:4: 0012 significa 0,12 con LZ y 0,0012 con TZ. Un punto explícito ignora esta opción. El encabezado del archivo LZ/TZ siempre tiene prioridad.
# ToolDefaultsDescriptions.java
ui.0d0f92c0ca59=RECUSAR rechaza Excellon sin unidades declaradas. IN/MM definen un respaldo explícito para ese caso; las unidades de fichero declaradas tienen prioridad.
# ToolDefaultsDescriptions.java
ui.e66d66988505=Lugares decimales (0–9) para coordenadas TZ Excellon de punto implícito cuando se declara un formato insuficiente. Con LZ, los dígitos enteros determinan la posición del punto. Los puntos decimales explícitos o el formato declarado tienen prioridad. Sólo afecta a nuevas importaciones en las unidades indicadas.
