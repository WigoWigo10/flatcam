# RasterAngleInput.java
cam.lines.angle.help=Ángulo de barrido en grados: 0° horizontal, 90° vertical y 45° diagonal. La rotación positiva es antihoraria.\n\nAutomático conserva la orientación anterior elegida según la caja de cada región. Desactívelo para fijar un ángulo de 0° a menos de 180°. Se aplica a Lines y al primer método de Combo.\n\nAtención: las líneas deben detenerse en los obstáculos. Connect solo une tramos seguros; Contour añade una pasada de acabado alrededor de los pads. Cambiar el ángulo no modifica el origen ni elimina las elevaciones de la fresa.
# RasterAngleInput.java
cam.lines.angle.invalid=El ángulo Lines debe ser finito, de 0° a menos de 180°.
