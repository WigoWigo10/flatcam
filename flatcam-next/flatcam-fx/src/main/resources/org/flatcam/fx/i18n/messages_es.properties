ui.2c29980b6896=Límite inferior absoluto del rango de diámetro aceptado al buscar brocas. Esto no es una tolerancia ±. Ejemplo: Min = 0,78 y Max = 0,82 aceptan taladros dentro de ese rango. Tiene prioridad una coincidencia exacta del diámetro.
