ui.5a2216e5f95d=Forma de la herramienta:\nC1 a C4 = fresa circular con 1 a 4 flautas.\nB = punta de bola.\nV = punta en V.\n\nCuando se selecciona V, V-Dia, V-Angle y Cut Z determinan el diámetro efectivo.
