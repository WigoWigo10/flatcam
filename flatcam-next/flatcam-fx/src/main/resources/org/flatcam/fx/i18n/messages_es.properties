# GeometryCncToolPanel.java
ui.95bd9c5e9b98=La retracción mantiene la dirección y regresa al inicio por encima de la pieza de trabajo. La alternancia continua invierte la ruta entre pasadas, incluidas las LineStrings cerradas. Repeticiones continuas en la misma dirección de contornos cerrados sin levantar, como anillos Python; rechaza caminos abiertos.\n\nAdvertencia: cambios alternos Climb/Conventional y no acepta Preservar dirección. Ambos modos continuos rechazan Extra Cut/sondeo y usan la profundidad final solo para puntos aislados. Validar material, herramienta y arranque de viruta.
# GeometryCncToolPanel.java
ui.fdfb85fe5fa3=Extra Cut agrega un segmento después de completar una ruta cerrada. No tiene efecto en caminos abiertos y no está disponible para láser/HPGL.\n\nEsta configuración es individual por herramienta; Aplicar parámetros a todos lo copia explícitamente.
# GeometryCncToolPanel.java
ui.d7fbfcd03f08=Extra Cut Length: longitud adicional donde el inicio de un camino cerrado llega a su fin. Se usa solo con Extra Cut habilitado.\n\nUnidades: unidades de objeto (mm o pulgadas). No es una profundidad ni un conteo de pases.
# GeometryCncToolPanel.java
ui.5c2dedd18ed9=El camino preserva los caminos. Dentro/fuera aplique la mitad del diámetro hacia adentro/hacia afuera; La costumbre utiliza una distancia firmada. Individual por herramienta; no cambia el Geometry.\n\noriginal. Para líneas abiertas, Out crea el contorno del búfer; Se puede eliminar el camino y se rechaza.\n\nDisponible para fresar sin sondeo. Las configuraciones activas no se descartan al cambiar a un perfil incompatible: regrese al fresado y borrelas antes de generar.
# GeometryCncToolPanel.java
ui.3bc49c9baccd=Custom Offset: un valor positivo expande el trayecto; uno negativo lo contrae. Disponible con Tool Offset en Custom; cero requiere Path.\n\nUnidades: unidades del objeto (mm o in).\n\nAdvertencia: Isolation/NCC/Cutout ya generan trayectos compensados; normalmente use Path para evitar una compensación doble.
# GeometryCncToolPanel.java
ui.5f2152bec38d=Cambio de herramienta (según el perfil)
# GeometryCncToolPanel.java
ui.2bebec796add=Para fresado normal, comandos positivos RPM comenzando a la velocidad solicitada. El cero RPM deja el arranque y la parada bajo control manual: no envía ningún arranque automático y no garantiza ninguna parada final. Los cambios de herramienta habilitados pueden detener el husillo antes de hacer una pausa.\n\nCero no significa apagar el husillo. Verifique G-code y el procedimiento de la máquina. Para láser/PWM, este campo representa potencia y sigue las reglas del perfil seleccionado.
# GeometryCncToolPanel.java
