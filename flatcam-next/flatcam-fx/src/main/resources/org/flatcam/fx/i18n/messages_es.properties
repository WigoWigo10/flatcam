# GCodeEditorController.java, MainWindow.java
gcode.save.help=**Guardar — Ctrl+S**\n\nEscribe el texto del editor en el archivo original que se muestra arriba. Sin un archivo asociado, solicita un destino y lo utiliza para guardados posteriores.\n\nEl programa se revisa antes de escribir. Para actualizar también el objeto del proyecto y la vista previa, use Aplicar a CNC Job.
# GCodeEditorController.java, MainWindow.java
gcode.saveAs.help=**Guardar como — Ctrl+Shift+S**\n\nElige otro destino y escribe una copia del texto. Mantiene el archivo original y su asociación con Guardar.\n\nGuardar una copia no aplica el borrador al CNC Job en memoria.
# GCodeEditorController.java, MainWindow.java
gcode.save.review=Guardar escribe el texto del editor en el archivo de destino. No aplica el borrador al CNC Job en memoria; use Aplicar a CNC Job para actualizar el objeto y obtener una vista previa.
# GCodeEditorController.java, MainWindow.java
gcode.saveAs.review=Guardar mientras escribe una copia. No aplica el borrador al CNC Job en memoria ni cambia el archivo original asociado con el editor.
# GCodeEditorController.java, MainWindow.java
gcode.saveAs.sameFile=Para guardar una copia, elija un archivo diferente al original. Utilice Guardar para actualizar el original.
# GCodeEditorController.java
gcode.cancel.help=**Cancelar edición**\n\nCierra el editor y descarta el borrador aún no aplicado a la memoria CNC Job.\n\n**No deshace archivos ya escrito** con Guardar o Guardar como. Para cambiar un archivo guardado, edítelo nuevamente y guarde la corrección.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.help=**Editar el diámetro de los agujeros**\n\nDé doble clic o pulse F2 o Enter en la columna Diámetro. Introduzca un valor positivo con punto o coma decimal; Enter confirma y Esc cancela. Tab recorre las herramientas.\n\nEl cambio afecta a todos los agujeros y ranuras de ese ID, sin mover sus centros ni fusionar herramientas de igual diámetro. El trazado se reconstruye en segundo plano. Las filas de totales no son editables.\n\nCon el foco en la tabla, Ctrl+Z/Ctrl+Y deshacen/rehacen. Guarde el proyecto o exporte Excellon para conservar el cambio; el archivo de origen y los CNC Jobs existentes no se reescriben automáticamente.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.history.help=Deshace o rehace los cambios de diámetro confirmados para este objeto durante la sesión. No altera las posiciones de los agujeros. Dentro de un campo de texto, Ctrl+Z todavía deshace solo texto. Otra edición o transformación de objeto invalida este historial.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.updating=Actualizando el diámetro del agujero y el dibujo...
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.unavailable=No se pudo iniciar el cambio. Espere la operación actual o cierre el editor e inténtelo de nuevo.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.failed=Diámetro no aplicado. El objeto fue preservado; verifique el mensaje de la Terminal.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.stale=La fuente o proyecto cambió; se descartó la actualización del diámetro.
# ExcellonObjectToolsTable.java, MainWindow.java
excellon.diameter.applied=Diámetro actualizado. Guarde el proyecto o exporte Excellon para conservar el cambio.
