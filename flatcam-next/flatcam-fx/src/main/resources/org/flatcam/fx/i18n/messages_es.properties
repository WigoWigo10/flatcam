# CncCoveragePanel.java
ui.89cfed77b61f=. El naranja muestra el área restante nominal, no una simulación de pieza de trabajo. Después de esta herramienta se incluyen las herramientas anteriores; Esta herramienta solo se compara con su objetivo CAM (con Rest, es posible que ese objetivo ya sea un residual). Las herramientas ISO no tienen un objetivo de compensación individual. No valida Z, mordazas, material, exclusiones ni la máquina.
