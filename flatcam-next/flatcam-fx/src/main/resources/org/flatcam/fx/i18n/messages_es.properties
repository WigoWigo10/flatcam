# ToolDefaultsDescriptions.java
ui.c4302f8429b2=Altura final de perforación después de la parada del husillo. Con End XY, mantiene al menos el Travel Z de la última herramienta durante el recorrido lateral y solo llega a End Z en el destino, con o sin exclusiones. Advertencia: verifique Travel Z espacio libre y destino antes de elegir una altura final baja.
# ToolDefaultsDescriptions.java
ui.6f92ed8ee28f=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.
