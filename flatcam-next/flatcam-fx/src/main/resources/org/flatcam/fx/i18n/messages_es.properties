# GCodeEditorController.java
ui.0812ae6fee63=Edite el texto y use Aplicar a CNC Job para actualizar el objeto en memoria y obtener una vista previa. Guardar escribe en el archivo original que se muestra; sin un archivo asociado, solicita un destino. Guardar como escribe una copia en otro lugar y conserva el original. Cancelar descarta el borrador en memoria pero no deshace los archivos ya guardados. La vista previa cubre G0/G1 movimientos, G2/G3 XY arcos y subconjuntos lineales de ISEL ICP, HPGL y Roland RML-1. El sondeo G31 y la referencia G92 hacen que la vista previa no esté disponible. Las macros y los restablecimientos de origen no se simulan.
