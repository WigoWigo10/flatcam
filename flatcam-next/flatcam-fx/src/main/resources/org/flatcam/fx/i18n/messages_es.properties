ui.c5795d9ddd66=Habilita zonas prohibidas para cortes. Desmarcar mantiene áreas para editar pero no las usa en G-code. Sólo fresar sin sondear; los perfiles incompatibles rechazan las exclusiones activas.\n\nAdvertencia: configure todos los dispositivos e inspeccione G-code; No se modelan macros, mangos, cabezales de herramientas ni límites de la máquina.
