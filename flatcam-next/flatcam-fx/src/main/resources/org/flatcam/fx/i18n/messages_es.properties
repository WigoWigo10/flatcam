ui.35d29b8dde80=Parámetros de limpieza y aislamiento de cobre. La ayuda de cada campo indica los parámetros ya transferidos a FX NCC.
# ToolsDatabaseDescriptions.java
ui.5bab1dddc1c3=Diámetro, margen, espacios y Thin Profundidad transferidos a Cutout. Cut Z, Multi-Depth y Depth / Pass provienen de la sección Milling. Los objetos Geometry generados reciben las profundidades; Se conservan los huecos manuales. Thin genera un Geometry separado y M-Bites genera un Excellon para la configuración de perforación más adelante.
