# CutoutToolPanel.java
ui.e1f7a2333650=Ancho de material a retener, en unidades de objeto. El segmento de trayectoria eliminado también incluye el diámetro de la herramienta. Zero desactiva los espacios automáticos en FX.\n\nThin utiliza exactamente los segmentos eliminados para su Geometry separado; para corte rectangular, M-Bites usa la misma posición con una línea desplazada por el radio de perforación. Verifique el ancho, la profundidad y los agujeros en la vista previa.
