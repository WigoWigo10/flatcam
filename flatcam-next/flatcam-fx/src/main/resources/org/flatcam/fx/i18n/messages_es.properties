ui.12eb679d5413=\n\nIntegración FX: este parámetro está guardado en la base de datos, pero aún no está implementada su transferencia a CAM.
# ToolsDatabaseDescriptions.java
ui.f217a4cb925d=Agrega una herramienta a la base de datos en memoria con parámetros iniciales editables. Utilice Guardar base de datos para escribirla en el archivo.
# ToolsDatabaseDescriptions.java
ui.a8dee3b4c25c=Duplica una o más herramientas seleccionadas, incluidos sus parámetros y campos desconocidos. Las copias reciben nuevas identificaciones y se pueden editar por separado.
# ToolsDatabaseDescriptions.java
ui.63c41b6f1b62=Elimina las herramientas seleccionadas después de la confirmación. El archivo en el disco cambia solo cuando se guarda la base de datos.
# ToolsDatabaseDescriptions.java
ui.7454aeb3a9f1=Valida los campos editados y aplica cambios a la herramienta en la memoria. No escribe en el disco; Guardar la base de datos persiste. Los valores no válidos conservan el borrador para su corrección.
# ToolsDatabaseDescriptions.java
ui.50eeae2a66f3=Inicia una biblioteca vacía sin eliminar el archivo actual. Si hay cambios no guardados, pide confirmación antes de descartarlos.
# ToolsDatabaseDescriptions.java
ui.841aa9d512f7=Abre una base de datos FlatCAM Python .FlatDB o JSON y reemplaza la biblioteca en memoria después de una lectura válida. Pide confirmación para descartar cambios; mantiene la base de datos actual en caso de error.
# ToolsDatabaseDescriptions.java
ui.88d2c76ce9e0=Escribe una copia .FlatDB/JSON en otro archivo. Mantiene la asociación de la base de datos actual y los cambios pendientes; exportar a su propio archivo equivale a guardar. Crea una copia de seguridad al sobrescribir.
# ToolsDatabaseDescriptions.java
ui.0a04515a75ba=Valida y guarda la biblioteca en su archivo asociado o solicita un destino al guardarla por primera vez. Crea una copia de seguridad antes de sobrescribir y borra el indicador de cambios. Acceso directo: Ctrl+S.
# ToolsDatabaseDescriptions.java
ui.2f98070e9466=Identificación de herramientas, diámetro, tolerancia y funcionamiento. Seleccione solo una herramienta para editar; La selección múltiple permite copiar o eliminar.
# ToolsDatabaseDescriptions.java
ui.953c8825f4d0=Parámetros de forma, punta en V y CNC transferidos a Geometry/Milling, incluidos Tool Offset/Custom Offset. Cutout recibe parámetros de corte pero no vuelve a aplicar Compensación a rutas ya compensadas. La ayuda de cada campo explica los límites de soporte.
# ToolsDatabaseDescriptions.java
ui.ef816d0f3ef1=Parámetros Drilling, profundidad por pasada, avance, husillo y compensación Z. La ayuda de cada campo indica si ya está transferido a FX Drilling.
# ToolsDatabaseDescriptions.java
ui.7ce686d0ec4a=Isolation opciones de pasadas, superposición, región y fresado. La ayuda de cada campo indica los parámetros ya transferidos a FX Isolation.
# ToolsDatabaseDescriptions.java
ui.10022c39b858=Aplicar agrega una herramienta a Paint o actualiza la fila con el mismo diámetro. La superposición, el margen, el método, Connect y el contorno son individuales; se conservan otras filas, selección, orden y Rest. El láser Lines, las puntas en V y la transferencia de parámetros CNC no se admiten en este flujo.
