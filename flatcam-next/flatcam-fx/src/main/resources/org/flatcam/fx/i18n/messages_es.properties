ui.7feedc0c4379=\n\nIntegración FX: transferencias Standard, Seed, Lines y Combo; El láser Lines sigue sin ser compatible.
# ToolsDatabaseDescriptions.java
ui.f73eec9b0794=\n\nUnidades: valor en unidades de trabajo (mm o in); la base de datos no convierte unidades automáticamente.
