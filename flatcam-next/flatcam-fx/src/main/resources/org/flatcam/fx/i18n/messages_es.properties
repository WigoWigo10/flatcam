# InternalCutoutToolPanel.java
cutout.internal.summary_help=Resultado: se crea una Geometry independiente con los recortes seleccionados y los ajustes mostrados aquí.\n\nLa longitud es por pasada y no incluye movimientos rápidos, penetraciones ni tiempo de mecanizado. Cut Z muestra el valor tras aplicar la política Standard/Machinist.\n\nSiguiente paso: abra Geometry, revise los demás parámetros CNC y genere el CNC Job.
