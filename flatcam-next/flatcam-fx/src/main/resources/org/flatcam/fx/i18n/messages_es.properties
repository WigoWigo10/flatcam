# CncPreflight.java, MachiningZInput.java, ToolDefaults.java
machining.z.help=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.
# CncPreflight.java
machining.z.roland.preview=Roland RML-1 no almacena el modo Maquinista. Cuando se vuelve a abrir o editar, su vista previa trata a Z=0 como la superficie y puede clasificar erróneamente los movimientos utilizando otro origen Z. Se conservan las coordenadas exportadas.
# ToolDefaultsDescriptions.java
machining.z.preference.scope=. Persiste cuando se guardan los valores predeterminados. Se aplica a la próxima generación, incluidos los paneles abiertos; no reescribe objetos existentes o CNC Jobs.\u0020
