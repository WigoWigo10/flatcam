cutout.internal.remove_help=Elimina solo las formas dibujadas seleccionadas de este borrador. Delete en la tabla hace lo mismo. Las aberturas detectadas no se borran de la placa; desmárquelas con Limpiar selección. El objeto de origen permanece intacto.
