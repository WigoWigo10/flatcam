tool.diameter.edit.help=Haga doble clic en el diámetro o presione F2/Enter para editar.\nEnter confirma; Esc cancela. Tab confirma y edita el siguiente cortador; Shift+Tab pasa al anterior. En cualquier extremo, Tab abandona la tabla.\n\nDentro de la celda, Delete elimina texto; fuera de la edición, elimina las filas seleccionadas cuando la tabla lo admite.\nAcepta un punto decimal o una coma en las unidades del objeto. Conserva la configuración de operación y la entrada de la base de datos de herramientas.\nGenerate también valida las ediciones no confirmadas.
# EditableToolDiameterColumn.java
tool.diameter.invalid=Herramienta %d: ingresa un diámetro numérico finito mayor que cero. Corrija la edición o presione Esc para cancelarla. Haga clic derecho en la tabla para corregir o descartar el borrador no válido; Se conserva la selección del cortador.
