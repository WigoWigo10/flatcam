ui.b509d268be67=Posiciones compartidas por todas las herramientas. Ninguno = automático. El láser solo permite End Z/XY con energía apagada y XY en altura libre; Start Z y los cambios de herramientas mecánicas están bloqueados. El sondeo utiliza su propio panel. Las configuraciones incompatibles conservadas deben borrarse en el modo de fresado.
