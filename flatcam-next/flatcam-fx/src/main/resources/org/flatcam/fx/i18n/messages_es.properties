ui.32c69353fa94=Origen: punto (0, 0).\nSelección: centro del cuadro delimitador combinado de los objetos seleccionados.\nPunto: coordenada ingresada a continuación.\nObjeto: centro del cuadro del objeto elegido, sin cambiarlo a menos que esté seleccionado.
# TransformToolPanel.java
ui.514fbb789a51=Utiliza el centro del cuadro de este objeto como punto de transformación fijo cuando la referencia es Objeto.\n\nReferencia: elegir un objeto aquí no lo selecciona para la transformación; Los objetivos siguen siendo los objetos seleccionados en el árbol.
