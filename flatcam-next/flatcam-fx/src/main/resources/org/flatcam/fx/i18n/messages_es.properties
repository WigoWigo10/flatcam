paint.units.help=El origen, las referencias, los diámetros y los márgenes usan la **misma unidad**.\nPara cambiar de unidad, cierre Paint y ábralo desde el objeto deseado.\nLos valores introducidos no se reinterpretan en otra unidad.
# MainWindow.java, PaintToolPanel.java
paint.units.invalid=Elija un objeto con las unidades de este panel. Para cambiar de unidad, cierre Paint y vuelva a abrirlo desde el objeto deseado.
