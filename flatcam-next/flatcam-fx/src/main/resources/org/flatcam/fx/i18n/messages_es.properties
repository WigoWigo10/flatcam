ui.dc49a4c8a767=Estrategia de viaje
# CncExclusionEditor.java
ui.c75681fd3399=Around recorre áreas en XY. Over sube antes de entrar y baja después de salir de la región expandida por radio y margen. Cuando las áreas se superponen, utiliza el Over Z más alto requerido para ese segmento. Both rechaza cortes dentro del área.\n\nFX agrega un radio de herramienta y un margen de 0,1 mm (o equivalente en pulgadas). También se controlan cambios de herramientas, devoluciones entre pasadas y aparcamientos.
# CncExclusionEditor.java
ui.431de278c0b2=Over Z altura
# CncExclusionEditor.java
ui.f47cbba69b65=Altura absoluta positiva en unidades de objeto. Nunca reduce Travel Z. Los cambios de altura ocurren fuera de la región protegida por herramientas; entre áreas, el recorrido puede regresar a la altura segura.\n\nAdvertencia: debe liberar las abrazaderas con margen sin exceder el recorrido de la máquina. Compruebe también el mango y el cabezal de la herramienta: no son simulados.
