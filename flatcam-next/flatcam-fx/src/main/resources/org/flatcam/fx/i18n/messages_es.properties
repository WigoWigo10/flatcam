ui.58c488f2d50d=Amortiguador por distancia
# TransformToolPanel.java
ui.9b65181e62d6=Expande con una distancia positiva y contrae con una distancia negativa. Unidades del objeto (mm o in). Esquinas redondeadas suaviza los vértices; si se desmarca, usa uniones en inglete.\n\nExcellon: cambia los diámetros en el valor introducido, manteniendo los centros y las ranuras, como en Python. Geometry/Gerber: cambia áreas o trayectos; no es una compensación CNC. Se rechazan los resultados vacíos. Use objetos con las mismas unidades.
# TransformToolPanel.java
ui.542124ea4ea2=Utiliza un factor de 1 + porcentaje/100; requiere un porcentaje mayor que -100 y diferente de cero. Escala las formas alrededor de sus centros locales, no de la referencia global. Excellon cambia solo diámetros; las ranuras conservan sus puntos finales. No cambia Geometry diámetros de herramientas.\n\nGerber: los contornos son aproximados; Los metadatos de apertura permanecen sin cambios. Comprueba el resultado y exporta.
