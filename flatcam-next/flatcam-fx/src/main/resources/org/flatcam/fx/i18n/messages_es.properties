ui.9c4a7913fa01=V diámetro de la punta de la herramienta, no negativo. Disponible para Shape V; Se utiliza para calcular el diámetro de corte.
# ToolsDatabaseDescriptions.java
ui.ce4c5153c754=Ángulo incluido completo de la punta de la herramienta en V, en grados, entre 0 y 180 (exclusivo). Se utiliza para calcular el diámetro en la profundidad Cut Z.
# ToolsDatabaseDescriptions.java
ui.41ab10f67dd9=Clasificación de mecanizado: Iso = aislamiento; Áspero = desbaste; Terminar = terminar. Describe la herramienta; no ajusta automáticamente la velocidad.
# ToolsDatabaseDescriptions.java
ui.aacaddc8971f=Posición del camino: Camino = sin compensación; In/Out = adentro/afuera por la mitad del diámetro; Personalizado = usa Custom Offset.\n\nIntegración FX: transferido a Milling/Geometry CNC. Cutout ya compensa sus rutas y no vuelve a aplicar este Offset.
# ToolsDatabaseDescriptions.java
ui.f75bc6543a18=Custom Offset: positivo se expande; Contrae negativamente el camino. Sólo se aplica con Tool Offset Personalizado; cero requiere Ruta en FX CNC.\n\nIntegración FX: transferida a Milling/Geometry CNC, no a Cutout.\n\nAdvertencia: Isolation/NCC ya generan rutas del centro de la herramienta; Normalmente mantenga Path para evitar compensaciones duplicadas.
# ToolsDatabaseDescriptions.java
ui.5ea9e2fac451=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.\n\nLa base de datos de herramientas conserva el signo ingresado como borrador. La política seleccionada se aplica en la generación. La profundidad de la herramienta en V se calcula a partir de la punta, el ángulo y el ancho de corte.
# ToolsDatabaseDescriptions.java
ui.4df34f0ac8aa=**Modo Standard:** Cut Z positivo se convierte en Z negativo con un aviso; Travel Z negativo se convierte en positivo. Se rechaza el cero.\n\n**Machinist:** conserva los valores positivos, negativos y cero. Actívelo en Preferencias > CNC Job > CNC Job (general); se aplica a la siguiente generación, incluidos los paneles abiertos. Compruebe Cut Z efectivo y Offset Z en el resumen.\n\nEl signo es relativo al origen Z de la máquina. Se siguen comprobando los parámetros de las pasadas y los límites específicos del preprocesador.\n\n**Efectivo Cut Z = Cut Z − Offset Z.** Positivo Offset Z perfora más profundamente; negativo lo hace menos profundo. La tabla conserva el valor borrador ingresado; la política se aplica en la generación.
# ToolsDatabaseDescriptions.java
ui.1dcd647d56b9=Divide el corte en pasadas de profundidad limitada hasta alcanzar Cut Z. Habilita Depth / Pass; la perforación se retrae entre pasadas.
# ToolsDatabaseDescriptions.java
ui.456a8ebadd8c=Profundidad máxima añadida por pasada, como valor positivo. Solo se habilita cuando se marca Multi-Depth.
# ToolsDatabaseDescriptions.java
ui.f91d4c8f5ad8=**Travel Z:** coordenada utilizada al desplazarse entre cortes u agujeros. Standard convierte valores negativos en positivos con un aviso y rechaza cero. El maquinista conserva el signo y el cero. La base de datos mantiene el valor del borrador hasta su generación.\n\nElija la coordenada considerando el origen Z, el material y el sujeción.
# ToolsDatabaseDescriptions.java
ui.cc211002f83a=Velocidad de avance en el plano X-Y mientras la herramienta está cortando. Introduzca un valor positivo en unidades de trabajo por minuto (mm/min o in/min).
# ToolsDatabaseDescriptions.java
ui.c5ecfce43470=Tasa de inmersión en Z durante el corte o la perforación. Introduzca un valor positivo en unidades de trabajo por minuto (mm/min o in/min).
# ToolsDatabaseDescriptions.java
ui.5ac9157749c6=Velocidad de desplazamiento rápido, en mm/min o in/min según las unidades de trabajo. Su uso depende del postprocesador; Algunos perfiles de impresora utilizan velocidades de alimentación explícitas para movimientos rápidos.
# ToolsDatabaseDescriptions.java
ui.780bbcbf8bf0=Spindle velocidad en RPM. Zero omite el comando de velocidad en perfiles que lo permiten; Es posible que la secuencia de cambio de herramienta aún emita M5 para detenerse antes de hacer una pausa. Los perfiles como Mach3 con sondeo requieren RPM positivo al generar.
# ToolsDatabaseDescriptions.java
ui.51c14e84cf54=Permite una pausa después de arrancar el husillo para permitir que el motor alcance la velocidad especificada. Habilita el campo Hora Dwell.
# ToolsDatabaseDescriptions.java
ui.a469ddecc553=Duración de la pausa después de iniciar el husillo, en segundos. Disponible cuando se marca Dwell; debe ser no negativo.
# ToolsDatabaseDescriptions.java
ui.a55f6af44e1e=Agrega un segmento de corte donde se unen el inicio y el final de un camino cerrado para ayudar a completar el aislamiento. Habilita Extra Cut Length.
# ToolsDatabaseDescriptions.java
ui.d317fdcd23ad=Longitud del segmento adicional al cierre del camino. Solo disponible cuando se marca Extra Cut.
# ToolsDatabaseDescriptions.java
ui.e55b167f74ed=**Compensación de la punta de perforación:** efectiva Cut Z = Cut Z − Offset Z. La compensación positiva perfora más profundamente; negativo lo hace menos profundo. Standard requiere el resultado por debajo de Z0. El maquinista permite un objetivo positivo o cero. Verifique el objetivo efectivo en el resumen.
# ToolsDatabaseDescriptions.java
ui.54e4cfa8263b=Trata las ranuras de la herramienta como una secuencia de agujeros. Habilita Overlap y Last Drill para configurar esa secuencia.
# ToolsDatabaseDescriptions.java
ui.0fa4dc89274a=Superposición entre orificios consecutivos al perforar ranuras, como porcentaje del diámetro de la broca. Sólo habilitado con Drill Slots; más superposición crea más agujeros.
# ToolsDatabaseDescriptions.java
ui.47cd96e13b62=Agrega un orificio en el extremo de la ranura cuando la secuencia regular no cubre toda la longitud. Solo habilitado con Drill Slots.
# ToolsDatabaseDescriptions.java
ui.a97ad6ed9408=Número entero de aislamiento que pasa alrededor del cobre. Más pasadas aumentan el ancho aislado junto con el diámetro y la superposición.
# ToolsDatabaseDescriptions.java
ui.e683b36ba450=Superposición entre pasadas de aislamiento, como porcentaje del ancho de la herramienta. Debe estar entre 0 y menos del 100%.
# ToolsDatabaseDescriptions.java
ui.98144a76b336=Selecciona la dirección de fresado: Climb o Conventional. Considere las características mecánicas de la máquina al configurar el trabajo.
# ToolsDatabaseDescriptions.java
ui.61ef052ba553=Genera un camino siguiendo el centro de Gerber pistas en lugar de aislar sus bordes. Este modo corta a lo largo de la pista.
# ToolsDatabaseDescriptions.java
ui.c6f69ce7028f=Región a aislar: Both = bordes exteriores e interiores; Exterior = sólo exterior; Interior = solo los contornos de las aberturas poligonales internas.
# ToolsDatabaseDescriptions.java
ui.2f6693817b9b=Superposición entre trazados, como porcentaje del ancho de la herramienta (0 a menos del 100%). Los valores más grandes crean más rutas y pueden aumentar el tiempo de cálculo y mecanizado.
# ToolsDatabaseDescriptions.java
ui.5ad3e4c20743=Margen individual de Paint: un valor positivo reduce el área de relleno; cero usa el área original; un valor negativo la amplía.\n\nAdvertencia: un margen negativo puede desplazar los trayectos fuera del polígono original. Compruebe la Geometry generada antes de mecanizar.
# ToolsDatabaseDescriptions.java
ui.1e3c0b1a3d6b=Método de relleno:\nStandard = pasos hacia adentro.\nSeed = expansión desde una semilla.\nLines = líneas paralelas.\nCombo = prueba alternativa métodos.\n\nLaser_lines está deshabilitado en esta base de datos, como en Python.
# ToolsDatabaseDescriptions.java
ui.a249bfed7735=Conecta los segmentos resultantes para reducir los levantamientos de herramientas. Las conexiones deben permanecer dentro del área de mecanizado permitida.
# ToolsDatabaseDescriptions.java
ui.cbc8c3307206=Agrega un camino alrededor del perímetro del polígono para terminar los bordes.
# ToolsDatabaseDescriptions.java
ui.5ab0ef4a4657=Clear elimina el cobre libre. Isolation crea pases de aislamiento antes de la limpieza; Las herramientas V son tratadas como Isolation por el adaptador FX NCC.
# ToolsDatabaseDescriptions.java
ui.d37eabcd9bfb=Margen alrededor del cuadro delimitador utilizado para limitar la limpieza del cobre. Este es un parámetro diferente del desplazamiento de pista.
# ToolsDatabaseDescriptions.java
ui.d09474e58c9a=Método de limpieza:\nStandard = pasos hacia adentro.\nSeed = expansión a partir de una semilla.\nLines = líneas paralelas.\nCombo = intenta alternativas para cubrir el área.
# ToolsDatabaseDescriptions.java
ui.5325f315fe81=Permite la separación de pistas y plataformas al limpiar cobre. Habilita el valor de compensación, que establece esa distancia.
# ToolsDatabaseDescriptions.java
ui.4707e070d1b3=Limpieza de regiones cupríferas durante la limpieza. Solo se aplica cuando se marca Compensación.
# ToolsDatabaseDescriptions.java
ui.6f87fa37b6d6=Margen relativo al límite de la placa. Un valor positivo aleja el contorno de corte del borde original.
# ToolsDatabaseDescriptions.java
ui.0e76d814e99b=Ancho de las pestañas que sujetan la placa al material durante el corte. Seleccione el tipo de pestaña en Tipo de espacio.
# ToolsDatabaseDescriptions.java
ui.fecbff00731c=Tab distribución:\nNinguna = sin pestañas.\nLR = izquierda/derecha.\nTB = arriba/abajo.\n4 = uno por lado.\n2LR y 2TB = dos en cada lado indicado.\n8 = dos por lado.
# ToolsDatabaseDescriptions.java
ui.156747d498e6=Crea un contorno convexo que encierra todo la placa sin seguir sus características cóncavas. En Python, esta opción está destinada a objetos Gerber.
# ToolsDatabaseDescriptions.java
ui.b6e79f64013d=Tab tipo: Bridge = espacio en el corte; Thin = pestaña parcialmente fresada para reducir su espesor; M-Bites = pestaña perforada para facilitar la separación.
# ToolsDatabaseDescriptions.java
ui.60649971e444=**Thin Profundidad:** una coordenada Z menos profunda (más alta) que Cut Z. Standard ejemplo: corte −1,7 y pestaña −0,5. El maquinista también acepta Z positiva o cero; Thin La profundidad debe permanecer por encima de Cut Z. Se usa solo con el tipo de espacio Thin.\n\nFX transfiere esta coordenada a una pestaña separada Geometry; generar su CNC Job por separado. El corte principal retiene Cut Z.\n\nLas pestañas deben retener suficiente material para sostener la placa.
# ToolsDatabaseDescriptions.java
ui.f6561f253beb=Diámetro de los agujeros que perforan las pestañas Mouse Bites. Solo habilitado con tipo de espacio M-Bites.
# ToolsDatabaseDescriptions.java
ui.d383d48d875a=Espacio entre los bordes del agujero Mouse Bites. En Python, el paso de centro a centro es el diámetro más este valor. Solo habilitado con tipo de espacio M-Bites.
# ToolsDatabaseDescriptions.java
ui.45d311781d98=No hay información sobre herramientas para\u0020
