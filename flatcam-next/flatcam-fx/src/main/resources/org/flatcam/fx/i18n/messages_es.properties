cutout.internal.tool_help=Diámetro real de la fresa y margen en unidades del objeto. El centro de la fresa se desplaza hacia dentro de la abertura por radio + margen. Un margen positivo deja material adicional. Se rechazan aberturas estrechas o divididas; las esquinas interiores conservan el radio de la fresa.
# CutoutToolPanel.java, InternalCutoutController.java, InternalCutoutMessages.java, InternalCutoutToolPanel.java
cutout.internal.depth_help=Cut Z y Multi-Depth se transfieren a Geometry para generar el CNC Job. La profundidad por pasada debe ser positiva cuando Multi-Depth está activo. Compruebe el espesor de la placa, las alturas y los avances en el panel CNC antes de exportar.
