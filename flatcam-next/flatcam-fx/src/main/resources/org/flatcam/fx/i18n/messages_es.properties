# GeometryCncToolPanel.java
ui.4ab89e701ae5=Máximo de trabajo Travel Z: valor predeterminado conservador, utilizando la altura más alta en cada ruta.\n\nTravel Z de cada herramienta: utiliza la altura configurada de cada herramienta, como en el flujo de trabajo Python Geometry; También se aplica entre pasadas y al estacionar la última herramienta. Verifique cada altura y accesorio antes de seleccionar.\n\nEl cambio de herramienta Z permanece compartido y debe ser al menos como máximo Travel Z. Las exclusiones Over nunca reducen la altura efectiva. No simula el mango, el cabezal de la herramienta ni la seguridad física.
# GeometryCncToolPanel.java
ui.a3e15129b7de=**Start Z:** movimiento Z inicial antes de arrancar el husillo. Vacío/Ninguno usa Travel Z en la generación. Standard acepta cero o positivo; El maquinista acepta cualquier coordenada finita.\n\nAntes de viajar XY, FX se mueve a Travel Z. Start Z no realiza referencias ni confirma la holgura de la herramienta.\n\nUnidades: unidades de objeto (mm o pulgadas).
# GeometryCncToolPanel.java
ui.6dcc9e5883c7=End Z: altura final después de detener el husillo. Vacío/Ninguno utiliza el Travel Z efectivo de la última herramienta: el máximo de trabajo de forma predeterminada, o su propia altura en el modo por herramienta.\n\nSi End Z es más bajo, End X,Y se mueve primero a una altura segura; sólo entonces baja a End Z. Confirmar autorización de destino.
# GeometryCncToolPanel.java
ui.3cecae9744b0=Posición final X,Y. Vacío/Ninguno mantiene la última posición de corte. Utilice 10.5;20.5 o, con comas decimales, 10,5;20,5.\n\nFX viaja a una altura segura antes de descender a End Z. El movimiento aparece en la vista previa.\n\nUnidades: unidades de objeto (mm o pulgadas).
# GeometryCncToolPanel.java
ui.d8ac73a6edc4=Cambio de herramienta Z: altura utilizada antes del cambio de herramienta. Vacío/Ninguno usa el máximo Travel Z.\n\nDebe ser al menos el Travel Z más alto de las herramientas. Se aplica solo cuando los cambios de herramientas están habilitados o el perfil selecciona herramientas automáticamente.
# GeometryCncToolPanel.java
ui.ab78a163d37e=Cambio de herramienta X,Y: cambia de posición, incluido el primer cambio, cuando está habilitado. Vacío/Ninguno cambia en la posición actual. Utilice 10.5;20.5 o 10,5;20,5.\n\nFX se retrae antes de XY y M0/M6.\n\nAtención: comprobar las pinzas y la macro de la máquina; La vista previa no simula movimientos dentro de una macro M6.\n\nUnidades: unidades de objeto (mm o pulgadas).
