# TclFlatcamCommands.java
ui.09cdace1c4f1=open_project {C:/carpeta/proyecto.fcnproj}\nAcepta .fcnproj y .FlatPrj. Rechaza los cambios no guardados: use save_project primero o open_project {file} -force true para descartar explícitamente. Force no pasa por alto borradores, validaciones, cancelaciones o cambios durante la carga. Utilice / y llaves para las rutas Windows.
# TclFlatcamCommands.java
ui.c48f8b400a29=save_project {C:/carpeta/proyecto.fcnproj}\nsave_project {C:/carpeta/proyecto.FlatPrj}\nLa extensión requerida define el formato; reemplaza el destino después de la serialización. Primero cierre los editores. .FlatPrj conserva sólo las características representables Python; también mantenga .fcnproj. La cancelación antes de publicar conserva el destino; la compresión no se puede interrumpir a mitad de camino.
# TclFlatcamCommands.java
ui.e9ca66dec3f9=plot_all ?-plot_status ¿Verdadero|Falso? ?-use_thread Verdadero|Falso?\nMuestra todo de forma predeterminada; Pieles falsas. -use_thread está validado pero FX conserva su política de trabajadores. CNC Job sin vista previa compatible se rechaza. No espera cada cuadro GPU.
# TclFlatcamCommands.java
ui.f7967779f04c=plot_objects {placa,agujeros,ruta} ?-plot_status Verdadero|Falso?\nLista separada por comas; Los tirantes preservan los espacios. Valida cada nombre antes de cambiar la trazado. CNC Job sin vista previa compatible se rechaza.
# TclFlatcamCommands.java
ui.6f3cc297d5bf=set_active {nombre}\nAgrega el objeto a la selección actual, como en Python; no muestra capas ocultas ni roba el foco de Terminal. Primero cierre los editores de objetos.
# TclFlatcamCommands.java
ui.8866a79121c6=offset {nombre} -x 1.2 -y -0.3\nTambién acepta el desplazamiento {nombre} 1.2 -0.3. Ejes omitidos: 0.
# TclFlatcamCommands.java
ui.23128c50315d=escala {nombre} 2 -centro de origen\nescala {nombre} -x 2 -y 1 -origen {(3,4)}\nReferencia: centro (predeterminado), origen, límites_min o x,y. Eje omitido: 1; factor cero rechazado.
# TclFlatcamCommands.java
ui.ea9ac619f27f=espejo {nombre} -eje X -origen 0,0\nespejo {nombre} -eje Y -box {referencia}\nX refleja Y; Y refleja X (predeterminado). -box usa el centro de referencia y anula -origin. Sin referencia: (0,0).
# TclFlatcamCommands.java
ui.8c3a2a315522=sesgar {nombre} -x 10 -y 0\nÁngulos en grados entre -90 y 90; referencia: esquina inferior izquierda. Ejes omitidos: 0.
# TclFlatcamCommands.java
ui.a0c28cc72e47=rotar {nombre} 90 ?-centro de origen|origen|límites_min|x,y? ?-box {referencia}?\nExtensión de terminal FX: este pago Python tiene rotación de interfaz de usuario, no un comando de rotación Tcl. Grados positivos = en el sentido de las agujas del reloj, como Transformaciones; negativo = en sentido antihorario. El valor predeterminado es el centro de objetos; -box anula -origin. CNC Jobs rechazado.
# TclFlatcamCommands.java
ui.1bb7b5a45dd0=\u0020{salida} {geo 1} {geo 2} ...\nCrea Geometry oculto sin eliminar fuentes; al menos dos objetos Geometry distintos, unidades coincidentes y tipo simple/múltiple. Mantiene las herramientas separadas y reasigna los parámetros; Se rechazan los conflictos comunes. Utilice plot_objects para mostrar.
# TclFlatcamCommands.java
ui.d78b4bd570f6=\u0020{salida} {agujeros 1} {agujeros 2} ...\nCrea Excellon oculto, preservando las fuentes; al menos dos Excellons distintos con unidades coincidentes. Fusiona diámetros con cuatro decimales; reasigna agujeros/ranuras/parámetros/selección. Conflictos rechazados.
# TclFlatcamCommands.java
ui.941e51dcc2bb=\u0020{holes} {C:/folder/output.drl}\nExporta los agujeros/ranuras actuales en el formato guardado en Archivo > Exportar > Excellon; sin configuración: IN, decimal 2:4, ranuras enrutadas. La conversión/redondeo puede cambiar la precisión. FX requiere un destino explícito (opcional en Python); reemplaza el archivo existente. Cerrar editores. La cancelación antes de publicar conserva el destino; las preferencias permanecen sin cambios.
# TclFlatcamCommands.java
ui.3500496d65d6=\u0020{copper} {C:/folder/output.gbr}\nExporta la imagen actual Gerber como regiones resueltas usando el formato Archivo > Exportar > Gerber. Sin ajustes: IN, 2:4, L ceros. No conserva macros/identidades de apertura/comandos originales. Se requiere destino explícito; reemplaza el archivo existente después de la validación. Cerrar editores; las preferencias permanecen sin cambios.
# TclFlatcamCommands.java
ui.bfe1ba9687de=export_svg {nombre} {C:/carpeta/salida.svg} ?scale_stroke_factor?\nexport_svg {nombre} {C:/carpeta/salida.svg} ?-scale_stroke_factor valor?\nGerber/Excellon/Geometry y CNC con vista previa compatible. Factor positivo = ancho de medio trazo; <=0 = automático (0,02 para formas; diámetro de herramienta o 0,02 para CNC). No escala coordenadas. Unidades de origen, Y hacia arriba, Viaje bajo Corte. Se requiere destino explícito; reemplaza el archivo existente después de la validación. Cerrar editores.
# TclFlatcamCommands.java
ui.59e837ded8f7=Drillcncjob {agujeros} -drillz -1.7 -travelz 2 -feedrate_z 300 ?-drilled_dias 0.8,1.0? ?-diatol pct? ?-paso dpp? ?-rpm de velocidad del husillo? ?-cambio de herramientas z? ?-cambio de herramientaxy x,y? ?-startz z? ?-endzz? ?-endxy x,y? ?-tiempo de permanencia s? ?-feedrate_rapid f? ?-perfil de pp? ?-opt_type B|M|T? ?-outname nombre?\n-drillz (negativo), -travelz y -feedrate_z son necesarios en FX (Python usaría Preferencias). Las herramientas funcionan aumentando el diámetro. La herramienta cambia solo con -toolchangez. -pp acepta Python nombres (por ejemplo, GRBL_11) o nombres FX; El valor predeterminado es FX portátil. -opt_type B/M/T usa orden de proximidad FX, no OR-Tools/TSP. -muted se acepta sin efecto.
# TclFlatcamCommands.java
ui.c82380709055=Utilice scale_stroke_factor posicional o -scale_stroke_factor, no ambos.
