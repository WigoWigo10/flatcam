cutout.internal.draw_help=Dibuja una abertura en el borrador sin editar Outline. Rectángulo: dos esquinas opuestas. Círculo: centro y radio. Polígono: vértices, Enter o botón derecho para cerrar. Esc cancela el dibujo actual. La abertura debe quedar completamente dentro de una placa y no superponerse a otras aberturas.
