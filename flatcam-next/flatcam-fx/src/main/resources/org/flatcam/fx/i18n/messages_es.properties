# GeometryEditorDescriptions.java
ui.8e2720da0aa5=Abre borradores de transformaciones. La rotación, la escala X/Y, los espejos y la inclinación utilizan el pivote elegido y una vista previa antes de la confirmación. El desplazamiento X/Y agrega coordenadas en unidades de objeto independientemente del pivote.\n\n
# GeometryEditorDescriptions.java
ui.05c2909c2313=Rotación con vista previa
# GeometryEditorDescriptions.java
ui.8a897f7430ef=Seleccione formas, elija un pivote e ingrese un ángulo o use Girar arrastrando. Mientras arrastra, el cuadro sigue el ángulo; Release calcula la vista previa exacta, que aún requiere confirmación. El positivo gira en el sentido de las agujas del reloj, como en el panel Python; El negativo gira en sentido antihorario. Origen, centro/esquinas de selección y punto X/Y están disponibles. La elección de un pivote de trazado respeta Snap.\n\nLa transformación de vista previa calcula el nuevo esquema sin cambiar el borrador. Confirme con el botón o clic en el gráfico; Esc/descartes con clic derecho. Cambiar los parámetros o la selección invalida la vista previa. Durante el cálculo, Esc descarta el resultado pendiente y Cancelar en la barra de estado interrumpe el trabajo cuando es posible.\n\nConserva ID, herramientas y selección. Ctrl+Z deshace toda la rotación; Ctrl+Y rehace. Guardar y salir aplica el borrador al objeto. La escala, los reflejos y la inclinación también utilizan el pivote elegido y el mismo flujo de trabajo de vista previa/confirmación/cancelación.
# GeometryEditorDescriptions.java
ui.252d17529360=Arco por tres clics.
# GeometryEditorDescriptions.java
ui.f10a004bde0c=C12: centro, dirección inicial y final; El radio viene desde el principio. 12C: referencia inicial, final y central; El centro se encuentra en la bisectriz perpendicular utilizando la distancia de la referencia al punto medio de la cuerda, como en Python. 132: inicio, fin y un punto del arco; la dirección es automática.\n\nM cambia el modo y borra los puntos anteriores; D alterna en sentido horario/antihorario en los modos centrales. J abre coordenadas absolutas/relativas con la misma referencia recordada por el Salto general: la posición del cursor solo actualiza la vista previa; El punto de adición utiliza X/Y exacto sin ajuste. Backspace elimina el último punto. Finaliza el tercer punto válido; Esc/clic derecho cancela sin insertar. El ajuste se aplica a los clics del mouse.\n\nLa vista previa muestra el arco y una cruz en su centro. La resolución se puede configurar en Arcos y curvas: 4–4096 segmentos por círculo, valor predeterminado 64. Guardar la resolución predeterminada se aplica a los nuevos editores sin cambiar las formas existentes. Climb Milling El tipo invierte los vértices finales como en Python. Ctrl+Z deshace todo el arco; Ctrl+Y rehace.
# GeometryEditorDescriptions.java
ui.146acb3956fe=Agrega trazados de relleno a áreas seleccionadas sin eliminar los contornos originales. Acepta polígonos y anillos cerrados simples; rechaza líneas abiertas.\n\nCalcule la vista previa en segundo plano y confirme con un clic en el trazado o Confirme Paint; Esc cancela. Ctrl+Z deshace todo el relleno. El diámetro debe coincidir con la herramienta asociada; sin asociación, verifíquelo al generar CNC.
# GeometryEditorDescriptions.java
ui.b544cf9a2975=Convierte texto en polígonos editables, conservando los huecos de las letras. Elija fuente, tamaño y estilo en el panel.\n\nGenerar y posicionar muestra una vista previa: haga clic en el trazado para insertar en la línea base de la primera línea; Esc/clic derecho cancela. Ctrl+Z deshace toda la inserción. El resultado utiliza la herramienta de nueva forma elegida.
# GeometryEditorDescriptions.java
ui.dacea0b19fcf=Seleccione una o más formas como plantilla; haga clic una vez para el origen y luego los destinos para borrar esas regiones. La plantilla y el origen se conservan entre operaciones; La vista previa muestra la siguiente área.\n\nAdvertencia: los anillos cerrados y los exteriores de polígonos se convierten en áreas rellenas, incluidos sus agujeros. El corte afecta a todas las herramientas y a la plantilla original si se encuentra dentro de la región borrada. La plantilla del borrador mantiene su forma inicial incluso si se borra su fuente.\n\nEsc/haga clic con el botón derecho o haga clic nuevamente en Borrador para finalizar, conservando las operaciones confirmadas. Durante el cálculo, Esc descarta el resultado pendiente; Cancelar en la barra de estado interrumpe el trabajo cuando es posible. Ctrl+Z deshace una operación; Ctrl+Y rehace, manteniendo activo el borrador. Cambiar de herramienta o selección finaliza el gesto.
# GeometryEditorDescriptions.java
ui.01674ed7b2fe=Crea nuevas áreas sin reemplazar las formas seleccionadas. Introduzca una distancia positiva y elige un modo.\nCompleto = banda alrededor de la línea o polígono exterior.\nInterior = contrae el polígono.\nExterior = expande el polígono.\n\nInterior/Exterior requiere polígonos; FX no acepta distancias negativas en este comando. Unidades de objeto (mm o pulgadas). Ctrl+Z deshace.
# GeometryEditorDescriptions.java
ui.411e5fa9926d=La primera forma seleccionada es el objetivo; otros son cortadores. Un objetivo poligonal se convierte en su contorno antes de cortar.\n\nReemplaza solo el objetivo y mantiene los cortadores incluso si el corte elimina todo el objetivo. Ctrl+Z deshace.
# GeometryEditorDescriptions.java
ui.56b56b266b06=Elimina la región cubierta por otras formas seleccionadas de la primera forma seleccionada. El orden de selección define el objetivo.\n\nReemplaza las formas seleccionadas con el resultado; todos deben pertenecer a la misma herramienta. Los resultados vacíos se rechazan. Para conservar los cortadores, utilice Cortar ruta. Ctrl+Z deshace.
# GeometryEditorDescriptions.java
ui.9b1a2d946edf=Combina formas seleccionadas y las reemplaza con el resultado de la geometría. Todos deben pertenecer a la misma herramienta. No cambia el diámetro de corte. Ctrl+Z deshace.
# GeometryEditorDescriptions.java, LegacyUiManifest.java
ui.18409a9f56cb=Intersección
# GeometryEditorDescriptions.java
ui.57b36a64d212=Mantiene solo la región común a todas las formas seleccionadas y las reemplaza con el resultado. Requiere formas de la misma herramienta; Los resultados vacíos se rechazan. Ctrl+Z deshace.
# GeometryEditorDescriptions.java
ui.d4184c5fcfc8=Reemplaza los polígonos seleccionados con segmentos individuales de contornos exteriores e interiores. Cada segmento se puede seleccionar y eliminar. Acepta hasta 10.000 segmentos y conserva la asociación de herramientas. Ctrl+Z deshace.
# GeometryEditorDescriptions.java
