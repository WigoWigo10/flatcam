# GeometryCncToolPanel.java
ui.266bd35a9573=Con Z_laser y el láser Marlin, cada grupo puede tener su propio enfoque Z. Entre grupos, la potencia del láser se apaga y XY viaja al foco más alto del trabajo; sólo entonces se posiciona el siguiente foco. Esto no detecta obstáculos ni la altura de la pieza de trabajo.\n\nBasic GRBL_laser no posiciona el enfoque: mantenga este valor igual en todos los grupos o use Z_laser. Sin End Z explícito, la altura final es el último grupo con rutas.\n\nPara fresado, este campo es Travel Z. Unidades de objeto (mm o pulgadas). Se comparten los rápidos de alimentación y las posiciones finales.
