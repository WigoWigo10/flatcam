ui.6e34de730a9a=Punto inicial para los anillos Seed (también utilizado por el respaldo Combo).\n\nEstable (FX): conserva el comportamiento actual y reduce los cambios abruptos de pequeñas variaciones de geometría.\nRepresentante (Python): utiliza la regla de línea de exploración heredada para reproducir sus anillos. Pequeñas diferencias numéricas de entrada aún pueden cambiar el punto y las rutas.\n\nEsta elección pertenece a cada herramienta; Standard y Lines no lo utilizan.
