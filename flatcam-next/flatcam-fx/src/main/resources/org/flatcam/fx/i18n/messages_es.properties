ui.b9de2c3acb5e=Muestra el contorno exterior compensado y un área cuadrada en el cursor. Haga clic en el contorno para abrir un puente; sigue haciendo clic para agregar más. El área aplicada coincide con la vista previa, con la longitud del lado igual al ancho del puente más el diámetro de la herramienta. En diagonales o esquinas, el ancho resultante puede variar. Se respeta el ajuste de cuadrícula.\n\nHaga clic derecho o Esc finaliza y conserva los espacios confirmados. Generar se aplica al proyecto. Los espacios manuales reemplazan el patrón automático. Generar con el mismo tipo de esquema. Cambiar el diámetro, margen, ancho, Forma convexa o Panel/Único borra los espacios del cursor. La vista previa muestra el recorte exterior; inspeccionar los agujeros Thin y M-Bites después de la generación.
