# TclFlatcamCommands.java
ui.09cdace1c4f1=open_project {C:/folder/project.fcnproj}\nAccepts .fcnproj and .FlatPrj. Rejects unsaved changes: use save_project first, or open_project {file} -force true to discard explicitly. Force does not bypass drafts, validation, cancellation or changes during loading. Use / and braces for Windows paths.
# TclFlatcamCommands.java
ui.c48f8b400a29=save_project {C:/folder/project.fcnproj}\nsave_project {C:/folder/project.FlatPrj}\nRequired extension defines format; replaces destination after serialization. Close editors first. .FlatPrj preserves only Python-representable features; also keep .fcnproj. Cancellation before publishing preserves destination; compression cannot be interrupted midway.
# TclFlatcamCommands.java
ui.e9ca66dec3f9=plot_all ?-plot_status True|False? ?-use_thread True|False?\nShows all by default; False hides. -use_thread is validated but FX retains its worker policy. CNC Job without compatible preview is rejected. Does not wait for every GPU frame.
# TclFlatcamCommands.java
ui.f7967779f04c=plot_objects {board,holes,route} ?-plot_status True|False?\nComma-separated list; braces preserve spaces. Validates every name before changing Plot. CNC Job without compatible preview is rejected.
# TclFlatcamCommands.java
ui.6f3cc297d5bf=set_active {name}\nAdds the object to current selection, as in Python; does not show hidden layers or steal Terminal focus. Close object editors first.
# TclFlatcamCommands.java
ui.8866a79121c6=offset {name} -x 1.2 -y -0.3\nAlso accepts offset {name} 1.2 -0.3. Omitted axes: 0.
# TclFlatcamCommands.java
ui.23128c50315d=scale {name} 2 -origin center\nscale {name} -x 2 -y 1 -origin {(3,4)}\nReference: center (default), origin, min_bounds or x,y. Omitted axis: 1; zero factor rejected.
# TclFlatcamCommands.java
ui.ea9ac619f27f=mirror {name} -axis X -origin 0,0\nmirror {name} -axis Y -box {reference}\nX reflects Y; Y reflects X (default). -box uses reference center and overrides -origin. Without reference: (0,0).
# TclFlatcamCommands.java
ui.8c3a2a315522=skew {name} -x 10 -y 0\nAngles in degrees between -90 and 90; reference: bottom-left corner. Omitted axes: 0.
# TclFlatcamCommands.java
ui.a0c28cc72e47=rotate {name} 90 ?-origin center|origin|min_bounds|x,y? ?-box {reference}?\nFX Terminal extension: this Python checkout has UI rotation, not a Tcl rotate command. Positive degrees = clockwise, like Transformations; negative = counterclockwise. Defaults to object center; -box overrides -origin. CNC Jobs rejected.
# TclFlatcamCommands.java
ui.1bb7b5a45dd0=\u0020{output} {geo 1} {geo 2} ...\nCreates hidden Geometry without deleting sources; at least two distinct Geometry objects, matching units and single/multi type. Keeps tools separate and remaps parameters; common conflicts rejected. Use plot_objects to display.
# TclFlatcamCommands.java
ui.d78b4bd570f6=\u0020{output} {holes 1} {holes 2} ...\nCreates hidden Excellon, preserving sources; at least two distinct Excellons with matching units. Merges diameters to four decimal places; remaps holes/slots/parameters/selection. Conflicts rejected.
# TclFlatcamCommands.java
ui.941e51dcc2bb=\u0020{holes} {C:/folder/output.drl}\nExports current holes/slots in the format saved by File > Export > Excellon; without settings: IN, decimal 2:4, routed slots. Conversion/rounding may change precision. FX requires explicit destination (optional in Python); replaces existing file. Close editors. Cancellation before publishing preserves destination; preferences stay unchanged.
# TclFlatcamCommands.java
ui.3500496d65d6=\u0020{copper} {C:/folder/output.gbr}\nExports the current Gerber image as resolved regions using File > Export > Gerber format. Without settings: IN, 2:4, L zeros. Does not preserve original macros/aperture identities/commands. Explicit destination required; replaces existing file after validation. Close editors; preferences stay unchanged.
# TclFlatcamCommands.java
ui.bfe1ba9687de=export_svg {name} {C:/folder/output.svg} ?scale_stroke_factor?\nexport_svg {name} {C:/folder/output.svg} ?-scale_stroke_factor value?\nGerber/Excellon/Geometry and CNC with compatible preview. Positive factor = half stroke width; <=0 = automatic (0.02 for shapes; tool diameter or 0.02 for CNC). Does not scale coordinates. Source units, Y upward, Travel under Cut. Explicit destination required; replaces existing file after validation. Close editors.
# TclFlatcamCommands.java
ui.59e837ded8f7=drillcncjob {holes} -drillz -1.7 -travelz 2 -feedrate_z 300 ?-drilled_dias 0.8,1.0? ?-diatol pct? ?-dpp step? ?-spindlespeed rpm? ?-toolchangez z? ?-toolchangexy x,y? ?-startz z? ?-endz z? ?-endxy x,y? ?-dwelltime s? ?-feedrate_rapid f? ?-pp profile? ?-opt_type B|M|T? ?-outname name?\n-drillz (negative), -travelz and -feedrate_z are required in FX (Python would use Preferences). Tools run by increasing diameter. Tool changes only with -toolchangez. -pp accepts Python names (e.g. GRBL_11) or FX names; defaults to FX portable. -opt_type B/M/T uses FX proximity order, not OR-Tools/TSP. -muted is accepted without effect.
# TclFlatcamCommands.java
ui.c82380709055=Use either positional scale_stroke_factor or -scale_stroke_factor, not both.
