ui.fa693d21c4fb=Display default for new CNC Jobs. Cutting and travel have independent RGBA colors; ALL shows both, CUT only cutting and TRAVEL only travel. Annotations use 1–72 logical pixels; default color adapts contrast to the theme. Does not change G-code. Copies and reopened projects retain saved style. Applies to new objects only; property controls remain available.
# ToolDefaultsDescriptions.java
ui.2cdd1cde7f69=Initially shows Gerber centerlines (Follow) instead of filled copper. Original solid geometry remains available for CAM. Applies to new objects; reopened projects and copies retain state. Can be toggled in properties without losing color.
# ToolDefaultsDescriptions.java
ui.7dfb138c6b26=Opens aperture table expanded in future Gerber Object panels. Collapsing/expanding the section does not change geometry. A panel default; expansion state is not saved per project object.
# ToolDefaultsDescriptions.java
ui.baa07e368cdf=Initial color for new objects in this category. Picker and hexadecimal input are equivalent. Use #RRGGBB or #RRGGBBAA: AA ranges from 00 (transparent) to FF (opaque), e.g. #BBF268BF. Fill and line opacity are independent. Reopened projects, copies and existing objects retain colors; does not change CAM or G-code.
# ToolDefaultsDescriptions.java
ui.5d742879ac65=Initial visibility when adding new objects in this category. Hidden objects remain in the project and can be enabled through the tree or properties. Does not change existing objects or reopened project state.
# ToolDefaultsDescriptions.java
ui.49e69952c72a=Initially fills new object polygons; unchecked shows outlines. Holes remain open. Affects drawing only, not geometry used by CAM.
# ToolDefaultsDescriptions.java
ui.cc28facb205e=Initially draws object parts in different colors. Visually replaces the single color while active, preserving it for when disabled. Does not identify electrical nets.
# ToolDefaultsDescriptions.java
ui.f44193ad60df=Segments per full circle for new Geometry Editor arcs/circles, from 4 to 4096. Circles use the lower multiple of 4, as in Python: 65 becomes 64. More segments approximate curves better and increase preview memory/cost. Does not change existing shapes or guarantee physical machine accuracy. The editor allows local adjustment before drawing.
# ToolDefaultsDescriptions.java
ui.daa022cb0414=Initial tool diameter list. Separate items with commas and use decimal points, e.g. 1.0, 0.5. Not a single tool or automatic unit conversion.
# ToolDefaultsDescriptions.java
ui.6c40ce53a35a=STABLE uses a deterministic start for FX Seed rings. PYTHON uses the Python algorithm's representative point. May produce different paths in the same area; inspect the result.
# ToolDefaultsDescriptions.java
ui.7d57dc1f9b6c=C1–C4 identify flat cutters with one to four flutes; B is ball nose and V is V-tipped. Profile does not automatically set feed or RPM. For V, check V-Tip Dia and Angle when generating CNC.
# ToolDefaultsDescriptions.java
ui.3dd1e46fd590=Automatic fiducial position margin relative to Gerber bounds. Not mark size or mask opening size.
# ToolDefaultsDescriptions.java
ui.01bfc35ea137=Initial CNC profile. Must match controller and operation type. Not every profile supports drilling, laser, probing or multiple tools; final selection is validated in the CNC panel.
# ToolDefaultsDescriptions.java
ui.7c9bf0cbede2=Fallback units only when Gerber declares none. File declarations take priority. Does not convert already-open projects.
# ToolDefaultsDescriptions.java
ui.3bc8bc319d0d=Segmentation approximating Gerber arcs/circles. More segments increase detail, memory and calculation cost; not physical machine precision.
# ToolDefaultsDescriptions.java
ui.97a0b59de961=Integer digits (1–9) for implicit-point Excellon coordinates with LZ when no format is declared. LZ keeps leading zeros and may omit trailing zeros. FILE_FORMAT or masked INCH/METRIC declarations take priority. Does not affect explicit-point numbers or open projects.
# ToolDefaultsDescriptions.java
ui.3ba09f061500=Convention only when not declared: TZ keeps trailing zeros and allows omitting leading zeros; LZ keeps leading zeros and allows omitting trailing zeros. IN 2:4 example: 0012 means 0.12 with LZ and 0.0012 with TZ. An explicit point ignores this option. File-header LZ/TZ always takes priority.
# ToolDefaultsDescriptions.java
ui.0d0f92c0ca59=RECUSAR rejects Excellon without declared units. IN/MM define an explicit fallback for that case; declared file units take priority.
# ToolDefaultsDescriptions.java
ui.e66d66988505=Decimal places (0–9) for implicit-point TZ Excellon coordinates when insufficient format is declared. With LZ, integer digits determine point position. Explicit decimal points or declared format take priority. Only affects new imports in the indicated units.
