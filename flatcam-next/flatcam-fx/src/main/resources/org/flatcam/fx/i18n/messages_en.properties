# GeometryEditorDescriptions.java
ui.8e2720da0aa5=Opens draft transformations. Rotation, X/Y scale, mirrors and skew use the chosen pivot and a preview before confirmation. X/Y offset adds coordinates in object units independently of pivot.\n\n
# GeometryEditorDescriptions.java
ui.05c2909c2313=Rotation with preview
# GeometryEditorDescriptions.java
ui.8a897f7430ef=Select shapes, choose a pivot and enter an angle or use Rotate by dragging. While dragging, the box follows the angle; release calculates the exact preview, which still requires confirmation. Positive rotates clockwise, as in the Python panel; negative rotates counterclockwise. Origin, selection center/corners and X/Y point are available. Picking a plot pivot respects Snap.\n\nPreview transformation calculates the new outline without changing the draft. Confirm with the button or a plot click; Esc/right-click discards. Changing parameters or selection invalidates preview. During calculation, Esc discards the pending result and Cancel on the status bar interrupts work when possible.\n\nPreserves IDs, tools and selection. Ctrl+Z undoes the entire rotation; Ctrl+Y redoes. Save and exit applies the draft to the object. Scale, mirrors and skew also use the chosen pivot and the same preview/confirm/cancel workflow.
# GeometryEditorDescriptions.java
ui.252d17529360=Arc by three clicks
# GeometryEditorDescriptions.java
ui.f10a004bde0c=C12: center, start and end direction; radius comes from the start. 12C: start, end and center reference; center lies on the perpendicular bisector using the reference's distance to the chord midpoint, as in Python. 132: start, end and a point on the arc; direction is automatic.\n\nM switches mode and clears previous points; D toggles clockwise/counterclockwise in center modes. J opens absolute/relative coordinates with the same reference remembered by general Jump: Position cursor only updates preview; Add point uses exact X/Y without Snap. Backspace removes the last point. The third valid point finishes; Esc/right-click cancels without inserting. Snap applies to mouse clicks.\n\nPreview shows the arc and a cross at its center. Resolution is configurable in Arcs and curves: 4–4096 segments per circle, default 64. Save default resolution applies to new editors without changing existing shapes. Climb Milling Type reverses final vertices as in Python. Ctrl+Z undoes the whole arc; Ctrl+Y redoes.
# GeometryEditorDescriptions.java
ui.146acb3956fe=Adds fill paths to selected areas without deleting original outlines. Accepts polygons and simple closed rings; rejects open lines.\n\nCalculate preview in the background and confirm with a plot click or Confirm Paint; Esc cancels. Ctrl+Z undoes the whole fill. Diameter must match the associated tool; without an association, check it when generating CNC.
# GeometryEditorDescriptions.java
ui.b544cf9a2975=Converts text into editable polygons, preserving letter holes. Choose font, size and style in the panel.\n\nGenerate and position shows a preview: click the plot to insert at the first line's baseline; Esc/right-click cancels. Ctrl+Z undoes the whole insertion. The result uses the chosen new-shape tool.
# GeometryEditorDescriptions.java
ui.dacea0b19fcf=Select one or more shapes as a stencil; click once for the origin, then destinations to erase those regions. Stencil and origin are retained between operations; preview shows the next area.\n\nWarning: closed rings and polygon exteriors become filled areas, including their holes. Cutting affects all tools and the original stencil if inside the erased region. The eraser stencil keeps its initial shape even if its source is erased.\n\nEsc/right-click or clicking Eraser again finishes, retaining confirmed operations. During calculation, Esc discards the pending result; Cancel on the status bar interrupts work when possible. Ctrl+Z undoes one operation; Ctrl+Y redoes, keeping the eraser active. Changing tool or selection ends the gesture.
# GeometryEditorDescriptions.java
ui.01674ed7b2fe=Creates new areas without replacing selected shapes. Enter a positive distance and choose a mode.\nFull = band around the line or polygon exterior.\nInterior = contracts the polygon.\nExterior = expands the polygon.\n\nInterior/Exterior require polygons; FX does not accept negative distances in this command. Object units (mm or in). Ctrl+Z undoes.
# GeometryEditorDescriptions.java
ui.411e5fa9926d=The first selected shape is the target; others are cutters. A polygon target becomes its outline before cutting.\n\nReplaces only the target and keeps cutters even if cutting removes the entire target. Ctrl+Z undoes.
# GeometryEditorDescriptions.java
ui.56b56b266b06=Removes the region covered by other selected shapes from the first selected shape. Selection order defines the target.\n\nReplaces selected shapes with the result; all must belong to the same tool. Empty results are rejected. To keep cutters, use Cut Path. Ctrl+Z undoes.
