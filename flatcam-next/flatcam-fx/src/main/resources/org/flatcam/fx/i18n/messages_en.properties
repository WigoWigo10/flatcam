ui.ca024fd61793=LR/TB create two bridges; FOUR creates four; TWO_LR/TWO_TB create four; EIGHT creates eight.\n\nFor rectangular cutout, the source center is offset by the margin, as in Python. Double patterns use (source dimension + two margins) / 4; tool radius does not change this spacing.\n\nIf margin or width removes a requested bridge, rectangular generation is rejected. Manual gaps replace the pattern. Check the preview before generating CNC.
