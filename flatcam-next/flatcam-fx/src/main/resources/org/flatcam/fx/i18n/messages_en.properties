# CncPreflight.java
ui.c7a394da9f72=Laser: power is the S/PWM value requested from the controller, not physical RPM. The preview shows paths but does not simulate beam, material, interlocks or electrical settings; it is not safety validation.
# CncPreflight.java
ui.e6b011d26eaf=Laser: one pass per path, without Multi-Depth, mechanical tool changes, Dwell or Extra Cut. Isolated points require exposure time and are rejected. End Z/XY is shared; feed/power are individual per group and Z_laser/Marlin allow individual focus.
# CncPreflight.java
ui.fb3647cef05d=GRBL laser: confirm $30 (S scale), $32 (laser mode) and control wiring. FX commands M5 before positioning; it does not detect machine configuration or assume S represents a percentage.
# CncPreflight.java
ui.bfb39f3cb997=Marlin laser: confirm INCH_MODE_SUPPORT for IN, output configuration and the default, non-inline control mode. Fixed G0_FEEDRATE may ignore Feed rapids. M400 includes final parking but does not confirm physical beam shutdown.
# CncPreflight.java
ui.5ed498ea494d=Marlin FAN: M106/M107 use PWM from 1 to 255 in this profile. Confirm FAN pin and LASER_SYNCHRONOUS_M106_M107; fan speed is not calibrated optical power.
# CncPreflight.java
ui.833e9f781ddb=Repetier: power is FAN PWM from 0 to 255, not RPM. M106/M107 require suitable FAN output and circuitry; they do not confirm physical rotation. Zero power neither turns the output on nor guarantees a final stop if it was already on.
# CncPreflight.java
ui.a963bb6108f4=Repetier: @pause requests an operator tool change through Repetier-Host; it does not select a tool automatically. M84 releases motors and may lose the reference. Check fixtures, origin and height before resuming; the preview does not simulate this loss.
# CncPreflight.java
ui.2a98c7ae4ac7=Berta: confirm M110/M111 command configuration and G54 origin. Their effects depend on the machine and are not simulated; do not select the profile merely because it accepts generic G-code.
# CncPreflight.java
ui.12993adbfa62=Berta: G64 P0.03 retains the Python profile value in program units: 0.03 mm in MM or 0.762 mm in IN. This is a configured path tolerance, not guaranteed accuracy. Check before exporting.
# CncPreflight.java
ui.ad72fab202c4=Dwell: interface time remains in seconds; G4 P is emitted in milliseconds, including in IN. Native feed is per minute, without G94.
# CncPreflight.java
ui.1a5bfef7cb45=Manual tool change: three M0 pauses per tool. Between them, a commanded move to Z0 uses the tool's Feed Z and returns to Tool change Z; G90 is restored before vertical moves. This is not probing or automatic contact detection.
# CncPreflight.java
ui.bfa4c6d10df1=Confirm workpiece zero, XY position and free height before continuing each pause. Operator movements and origin/unit changes are not simulated.
# CncPreflight.java
ui.056653f07521=Custom tool change: Tn/M6 when tool changes are enabled, without additional M0. Height and XY are commanded before the macro; afterwards, G90 and Z are restored before the next XY. The macro, physical tool selection and origin changes are not simulated.
# CncPreflight.java
ui.551bc50c7c28=ISEL ICP: mm only; coordinates in micrometers, VEL/FASTVEL in micrometers per second and WAIT in milliseconds. Values are truncated to integers without increasing controller precision.
# CncPreflight.java
ui.c055d19b5676=ISEL ICP: GETTOOL performs automatic tool changes even without a manual pause. Confirm the macro, referencing and heights; the preview simulates neither that change nor rapid timing. Parking preserves the origin without WPCLEAR.
# CncPreflight.java
ui.b78eb28ba8ec=line_xyz: initial raising and Z restoration after M6 retain current X/Y. XYZ are explicit when known; confirm the controller accepts the vertical preamble. The M6 macro is not simulated.
# CncPreflight.java
ui.beced43c3234=ISEL CNC: this profile uses mm, G71/G94 and T1–T128. Dwell times set in seconds are converted to milliseconds in G-code.
# CncPreflight.java
ui.47beaa3c3a96=ISEL Remote DIN/ISO: M01 is a stop involving operator interaction. On other controllers, check whether stopping is optional and enabled; do not assume M01 always behaves identically.
# CncPreflight.java
ui.61300f9e6d65=ISEL CNC: tool change heights/XY are emitted before M06 and Z is restored afterwards. The tool change macro and physical referencing are not simulated. M30 ends after final parking.
# CncPreflight.java
ui.b47b197e04cf=Marlin: confirm SPINDLE_FEATURE and CUTTER_POWER_UNIT=RPM. S represents RPM only with that configuration.
# CncPreflight.java
ui.d39e5a5107c0=Marlin: Tn may select extruders; Tn/M6 require CNC-compatible configuration or a macro. M0 depends on pause support; IN requires INCH_MODE_SUPPORT.
# CncPreflight.java
ui.942ad8da333b=Marlin: every G0 receives Feed rapids, but fixed G0_FEEDRATE may ignore F. M400 waits for planner movements; it does not confirm physical spindle stopping.
# CncPreflight.java
ui.0fb95639fea3=The probing preview does not simulate G31, contact, G92 or tool change macros. It does not validate machine safety.
# CncPreflight.java
ui.651add8c8080=The preview is 2D: it does not simulate material removal, clamps, machine limits or M6 macro movements.
