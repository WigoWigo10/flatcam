ui.0812ae6fee63=Edit the text and click Apply to update the in-memory CNC Job. Save file writes a copy of the draft; it does not automatically change the original file. Cancel discards changes. Preview covers G0/G1 moves, G2/G3 arcs in XY and linear subsets of ISEL ICP, HPGL and Roland RML-1 (^IN/^PA/Z/V/!MC); G31 probing and G92 referencing make preview unavailable. Macros and origin resets are not simulated, and program safety for a CNC machine is not validated.
