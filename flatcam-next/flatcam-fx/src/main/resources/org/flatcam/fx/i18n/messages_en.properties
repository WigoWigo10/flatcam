ui.9b65181e62d6=Expands with a positive distance; contracts with a negative distance. Object units (mm or in). Rounded corners smooths corners; unchecked uses mitered corners.\n\nExcellon: changes diameters by the entered value, keeping centers and slots, as in Python. Geometry/Gerber: changes areas/paths; this is not CNC compensation. Empty results are rejected. Use objects with the same units.
# TransformToolPanel.java
ui.542124ea4ea2=Uses a factor of 1 + percentage/100; requires a percentage greater than -100 and different from zero. Scales shapes around their local centers, not the global reference. Excellon changes only diameters; slots retain their endpoints. Does not change Geometry tool diameters.\n\nGerber: outlines are approximated; aperture metadata remains unchanged. Check the result and export.
