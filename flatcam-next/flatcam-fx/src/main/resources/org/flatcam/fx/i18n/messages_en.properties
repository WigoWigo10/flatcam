# GeometryCncToolPanel.java
ui.95bd9c5e9b98=Retract keeps direction and returns to the start above the workpiece. Alternating continuous reverses the path between passes, including closed LineStrings. Same-direction continuous repeats closed contours without raising, like Python rings; rejects open paths.\n\nWarning: alternating changes Climb/Conventional and does not accept Preserve direction. Both continuous modes reject Extra Cut/probing and use final depth only for isolated points. Validate material, tool and chip removal.
# GeometryCncToolPanel.java
ui.fdfb85fe5fa3=Extra Cut adds a segment after completing a closed path. Has no effect on open paths and is unavailable for laser/HPGL.\n\nThis setting is individual per tool; Apply parameters to all copies it explicitly.
# GeometryCncToolPanel.java
ui.d7fbfcd03f08=Extra Cut Length: additional length where a closed path's start meets its end. Used only with Extra Cut enabled.\n\nUnits: object units (mm or in). Not a depth or pass count.
# GeometryCncToolPanel.java
ui.5c2dedd18ed9=Path preserves paths. In/Out apply half the diameter inward/outward; Custom uses a signed distance. Individual per tool; does not change original Geometry.\n\nFor open lines, Out creates the buffer outline; In may eliminate the path and is rejected.\n\nAvailable for milling without probing. Active settings are not discarded when switching to an incompatible profile: return to milling and clear them before generating.
# GeometryCncToolPanel.java
ui.3bc49c9baccd=Custom Offset: positive expands; negative contracts. Available when Tool Offset is Custom; zero requires Path.\n\nUnits: object units (mm or in).\n\nWarning: Isolation/NCC/Cutout already generate compensated paths; normally use Path to avoid duplicate compensation.
# GeometryCncToolPanel.java
ui.5f2152bec38d=Tool change (profile-dependent)
# GeometryCncToolPanel.java
ui.2bebec796add=For normal milling, positive RPM commands starting at the requested speed. Zero RPM leaves starting and stopping under manual control: it sends no automatic start and guarantees no final stop. Enabled tool changes may stop the spindle before pausing.\n\nZero does not mean turn the spindle off. Check G-code and machine procedure. For laser/PWM, this field represents power and follows the selected profile's rules.
# GeometryCncToolPanel.java
ui.ab6e2746eacf=Milling, laser and plotter profiles. Simulate and dry-run before use.
# GeometryCncToolPanel.java
ui.78d8c77120b9=Focus height / Travel Z
# GeometryCncToolPanel.java
ui.266bd35a9573=With Z_laser and Marlin laser, each group can have its own Z focus. Between groups, laser power is off and XY travels at the job's highest focus; only then is the next focus positioned. This does not detect obstacles or workpiece height.\n\nBasic GRBL_laser does not position focus: keep this value equal across groups or use Z_laser. Without explicit End Z, final height is the last group with paths.\n\nFor milling, this field is Travel Z. Object units (mm or in). Feed rapids and final positions are shared.
# GeometryCncToolPanel.java
ui.1cfa5d669f35=S/PWM power:
# GeometryCncToolPanel.java
ui.e69b3a0570e6=Cut Z (non-V):
# GeometryCncToolPanel.java
ui.fa4b5b467ada=Pass strategy:
# GeometryCncToolPanel.java
ui.4ab89e701ae5=Job maximum Travel Z: conservative default, using the highest height on every path.\n\nEach tool's Travel Z: uses each tool's configured height, as in the Python Geometry workflow; also applies between passes and when parking the last tool. Check each height and fixture before selecting.\n\nTool change Z remains shared and must be at least maximum Travel Z. Over exclusions never lower effective height. Does not simulate shank, toolhead or physical safety.
# GeometryCncToolPanel.java
ui.a3e15129b7de=Start Z: initial Z movement before starting the spindle. Empty/None uses the displayed Travel Z when generating; accepts zero or positive values.\n\nBefore XY travel, FX retracts to safe height. Start Z does not perform referencing or confirm tool clearance.\n\nUnits: object units (mm or in).
# GeometryCncToolPanel.java
ui.6dcc9e5883c7=End Z: final height after stopping the spindle. Empty/None uses the last tool's effective Travel Z: the job maximum by default, or its own height in per-tool mode.\n\nIf End Z is lower, End X,Y moves first at safe height; only then lowers to End Z. Confirm destination clearance.
# GeometryCncToolPanel.java
ui.3cecae9744b0=Final X,Y position. Empty/None keeps the last cut position. Use 10.5;20.5 or, with decimal commas, 10,5;20,5.\n\nFX travels at safe height before lowering to End Z. The move appears in preview.\n\nUnits: object units (mm or in).
# GeometryCncToolPanel.java
ui.d8ac73a6edc4=Tool change Z: height used before changing tools. Empty/None uses maximum Travel Z.\n\nMust be at least the tools' highest Travel Z. Applied only when tool changes are enabled or the profile selects tools automatically.
# GeometryCncToolPanel.java
ui.ab78a163d37e=Tool change X,Y: change position, including the first change, when enabled. Empty/None changes at the current position. Use 10.5;20.5 or 10,5;20,5.\n\nFX retracts before XY and M0/M6.\n\nWarning: check clamps and the machine macro; preview does not simulate movements inside an M6 macro.\n\nUnits: object units (mm or in).
