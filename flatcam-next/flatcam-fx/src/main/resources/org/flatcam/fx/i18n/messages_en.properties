# CutoutToolPanel.java
ui.804cc12e4532=Calculates a cutout for each separate source part, such as boards in a panel, with its own bridges.\n\nWarning: copper islands do not necessarily represent separate boards; check the chosen outline Geometry.
# CutoutToolPanel.java
ui.615fb942b47a=Use board area Geometry created from Edge_Cuts, not copper: all source internal rings will be machined. For multiple boards, select Panel.\n\nAvailable only with Free-form, without Convex Shape and with a nonnegative margin. Tool radius and margin offset the path into each opening. Generation is rejected if an opening disappears or splits.\n\nInternal cutouts are closed, without bridges, Thin or M-Bites, even with manual gaps. This is not pocket roughing: review corners, fixtures and loose pieces before generating CNC.
# CutoutToolPanel.java
ui.b3b282224871=Negative, finite Cut Z saved in cutout Geometry. Example: -1.7.\n\nUnits: object units (mm or in).\n\nWarning: check board thickness and how far the tool will enter the sacrificial material before generating CNC.
# CutoutToolPanel.java
ui.42adc98e530c=Thin Depth is negative Z, shallower than Cut Z. Example: cutout -1.7 and bridges -0.5. Used only for Thin.\n\nThis value goes into separate bridge Geometry; the main cutout retains Cut Z. Generate the two CNC Jobs separately.\n\nUnits: object units (mm or in).
