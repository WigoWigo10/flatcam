# CncExclusionEditor.java
ui.c75681fd3399=Around goes around areas in XY. Over raises before entering and lowers after leaving the region expanded by radius and margin. Where areas overlap, it uses the highest Over Z required for that segment. Both reject cuts inside the area.\n\nFX adds tool radius and a 0.1 mm margin (or equivalent in inches). Tool changes, returns between passes and parking are also checked.
